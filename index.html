<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PythonHub</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060A14;--pn:#0C1322;--ln:#1B2744;--tx:#E6ECFF;--mu:#8A97B8;--ac:#4D8DFF;--ac2:#8FD0FF;--ok:#34D399;--code:#050810;--r:14px}
[data-theme=light]{--bg:#F3F6FD;--pn:#FFFFFF;--ln:#DAE3F3;--tx:#0E1830;--mu:#5B6B8C;--ac:#2F6BFF;--ac2:#2F6BFF;--code:#EDF2FC}
*{box-sizing:border-box;margin:0}
body{font:15px/1.65 Inter,system-ui,sans-serif;background:radial-gradient(900px 520px at 85% -10%,#173a7a55,transparent),var(--bg);color:var(--tx);min-height:100vh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{display:grid;grid-template-columns:290px 1fr;min-height:100vh;transition:.3s}
body.collapsed #app{grid-template-columns:0 1fr}
#side{background:var(--pn);border-right:1px solid var(--ln);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
body.collapsed #side{padding:0;overflow:hidden;border:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:14px}
.wh{margin:14px 0 4px;font-weight:600;font-size:13px;color:var(--mu)}
.wh em{font-weight:400;opacity:.7}
#side a{display:block;padding:6px 10px;border-radius:8px;font-size:14px;color:var(--mu)}
#side a:hover,#side a.on{background:#4d8dff1f;color:var(--tx)}
#side a.dn{color:var(--ok)}
.tools{margin-top:22px;display:grid;gap:8px}
.gh{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 12px;font:500 13px Inter;cursor:pointer;text-align:center}
.gh:hover{border-color:var(--ac)}
main{padding:20px 32px 40px;max-width:980px;width:100%}
#top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ib{background:var(--pn);border:1px solid var(--ln);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer}
.view{animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin-bottom:12px}
h2{font-size:19px;margin:28px 0 12px;letter-spacing:-.01em}
p{margin:8px 0}
.mu{color:var(--mu)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:12px;transition:border-color .2s}
.card:hover{border-color:#4d8dff66}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.wg{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tg{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid .card{margin:0}
.big{font-size:24px;font-weight:700}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:14px;background:linear-gradient(135deg,#12306a66,var(--pn))}
.hero h1{font-size:34px}
.btn{display:inline-block;margin-top:10px;background:linear-gradient(135deg,var(--ac),#2F6BFF);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:600 14px Inter;cursor:pointer;box-shadow:0 6px 22px #2f6bff55}
.btn2{border:1px solid var(--ln);border-radius:10px;padding:9px 14px;font-size:14px;color:var(--mu);max-width:48%}
.btn2:hover{border-color:var(--ac);color:var(--tx)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.dots{display:flex;gap:6px;margin:10px 0}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--ln);background:var(--code)}
.dot.on{background:var(--ac);border-color:var(--ac);box-shadow:0 0 10px var(--ac)}
a.dot:hover{border-color:var(--ac)}
.vid{aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--ln)}
.vid iframe{width:100%;height:100%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.chip{border:1px solid var(--ln);border-radius:99px;padding:3px 12px;font-size:13px;color:var(--mu)}
.chip.ok{color:var(--ok);border-color:var(--ok);background:#34d39914}
.lnk{font-size:13px;color:var(--ac2);cursor:pointer;margin-left:auto}
pre{background:var(--code);border:1px solid var(--ln);border-radius:10px;padding:14px;overflow:auto;font:13px/1.6 'JetBrains Mono',monospace;margin:8px 0}
code{font:13px 'JetBrains Mono',monospace;background:var(--code);padding:1px 6px;border-radius:6px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--ac2);font-weight:500}
.q{margin-bottom:16px}
.q label{display:block;padding:6px 10px;border-radius:8px;cursor:pointer}
.q label:hover{background:#4d8dff14}
.good{background:#34d39922}
.bad{background:#f8717126}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--code);border:1px solid var(--ln)}
.heat i.h1{background:#4d8dff44}.heat i.h2{background:#4d8dff88}.heat i.h3{background:#4d8dffcc}.heat i.h4{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.heat i.f{opacity:.25}
.bd{display:flex;flex-wrap:wrap;gap:10px}
.bg{border:1px solid var(--ln);border-radius:99px;padding:6px 14px;color:var(--mu);opacity:.6}
.bg.on{opacity:1;color:var(--tx);border-color:var(--ac);box-shadow:0 0 14px #4d8dff55}
#bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--pn);border-top:1px solid var(--ln);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
#bnav a{flex:1;display:flex;flex-direction:column;align-items:center;font-size:18px;line-height:1.3;color:var(--mu)}
#bnav a span{font-size:11px}
#bnav a.on{color:var(--ac)}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ac);border-radius:12px;padding:12px 20px;z-index:50;box-shadow:0 10px 40px #4d8dff55;animation:in .4s}
.cf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@media(max-width:899px){
#app{display:block}
#side{position:fixed;inset:0 auto 0 0;width:min(310px,86vw);z-index:30;transform:translateX(-100%);transition:transform .3s;box-shadow:12px 0 40px #0008}
#side.open{transform:none}
#bnav{display:flex}
main{padding:16px 18px 90px}}
@media(max-width:720px){h1,.hero h1{font-size:25px}.hero{padding:16px}.btn2{font-size:13px}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.wg,.tg{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.nav{flex-direction:column}.btn2{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
:root{--fd:'Cormorant Garamond',Georgia,serif;--sb:#2A3A63;--s1:8px;--s2:16px;--s3:24px;--s4:32px;--s5:56px}
[data-theme=light]{--sb:#B9C7E6}
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ac);background-clip:content-box}
::selection{background:#4d8dff55}
body{font-size:16px;line-height:1.75}
h1,h2,h3,.brand span,.big,.toc b{font-family:var(--fd);font-weight:600;letter-spacing:-.01em}
h1{font-size:clamp(40px,5vw,60px);line-height:1.05;margin:var(--s1) 0 var(--s3)}
h2{font-size:32px;line-height:1.2;margin:var(--s5) 0 var(--s2)}
h3{font-size:27px;line-height:1.25;margin:8px 0 var(--s3)}
.big{font-size:42px;line-height:1.1}
main{padding:var(--s4) clamp(20px,5vw,72px) 96px;max-width:1240px}
#top{margin-bottom:var(--s4)}
#side{padding:var(--s3) var(--s2)}
.brand{font-size:28px;margin:0 8px var(--s3)}
.wk{display:block;margin-bottom:6px}
.wk>summary,.wk.soon{list-style:none;display:grid;grid-template-columns:1fr auto;padding:12px;cursor:pointer;border-radius:12px;color:var(--tx);font-size:14px;line-height:1.4}
.wk>summary::-webkit-details-marker{display:none}
.wk span{font-size:12px;color:var(--mu)}
.wk em{font-style:normal;font-weight:500;grid-column:1}
.wk small{grid-column:2;grid-row:1/3;align-self:center;color:var(--mu);font-size:12px}
.wk.soon{opacity:.45;cursor:default}
.wk[open]>summary{background:#4d8dff14}
#side a{padding:9px 12px 9px 16px;margin:2px 0 2px 10px;border-left:2px solid var(--ln);border-radius:0 8px 8px 0;line-height:1.4}
#side a.on{border-color:var(--ac);background:#4d8dff1f;color:var(--tx)}
#side.open{box-shadow:0 0 0 100vmax #0009}
.card{padding:var(--s3);margin-bottom:var(--s2);border-radius:18px}
.grid{gap:var(--s2)}
.hero{padding:var(--s4)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--pn);border:1px solid var(--ln);border-radius:14px;width:max-content;max-width:100%;overflow-x:auto;margin:var(--s3) 0 var(--s4)}
.tabs button{background:none;border:0;color:var(--mu);font:500 14px Inter;padding:10px 22px;border-radius:10px;cursor:pointer;transition:.2s;min-height:44px}
.tabs button.on{background:var(--ac);color:#fff;box-shadow:0 4px 18px #4d8dff66}
.tabs button.ck::after{content:' ✓';color:var(--ok)}
.tabs button.on.ck::after{color:#fff}
.chips{margin:0}
.vid{max-width:880px;border-radius:20px;box-shadow:0 30px 80px -30px #000}
.lnk{display:inline-block;margin:var(--s2) 0 0}
.rd{display:grid;grid-template-columns:minmax(0,1fr)}
.rd article{max-width:68ch}
.rd section{scroll-margin-top:24px}
.rd h2:first-child{margin-top:0}
.rd section+section{margin-top:var(--s5)}
dl{display:grid;gap:var(--s2);margin:0}
dt{font-weight:600}
dd{margin:0 0 var(--s2);color:var(--mu);padding-bottom:var(--s2);border-bottom:1px solid var(--ln)}
.toc{display:none}
@media(min-width:1100px){.rd{grid-template-columns:minmax(0,68ch) 200px;justify-content:space-between}.toc{display:flex;flex-direction:column;gap:10px;position:sticky;top:32px;align-self:start;font-size:14px;border-left:1px solid var(--ln);padding-left:var(--s2)}.toc a{color:var(--mu);cursor:pointer}.toc a:hover{color:var(--tx)}.toc b{font-size:22px}}
pre{padding:var(--s3);border-radius:14px;line-height:1.7}
.opts{display:grid;gap:12px;margin-bottom:var(--s3)}
.opt{text-align:left;background:var(--code);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:14px 18px;font:500 15px/1.5 Inter;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--ac);transform:translateX(4px)}
.opt.good{background:#34d39922;border-color:var(--ok)}
.opt.bad{background:#f8717126;border-color:#f87171}
.ok{color:var(--ok)}
.nav{margin-top:var(--s5)}
.btn,.btn2{padding:12px 22px;border-radius:12px}
@media(max-width:899px){#top{margin-bottom:var(--s2)}}
@media(max-width:720px){h2{font-size:28px}.tabs{width:100%}.tabs button{flex:1;padding:10px 6px}.hero{padding:var(--s3)}}
@media(max-width:480px){main{padding:20px 16px 96px}.big{font-size:34px}.tabs button{font-size:13px}}
</style>
<style>
.hero2{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);padding:var(--s5) var(--s4);margin-bottom:var(--s3);border:1px solid var(--ln);border-radius:28px;background:radial-gradient(600px 300px at 90% 0,#4d8dff33,transparent),var(--pn);overflow:hidden}
.hero2 h1{font-size:clamp(40px,6vw,72px);max-width:12ch;margin:8px 0 12px}
.lead{font-family:var(--fd);font-size:28px;font-style:italic;color:var(--ac2);margin:0 0 var(--s2)}
.rg{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.rg svg{filter:drop-shadow(0 0 22px #4d8dff66)}
.rg circle+circle{animation:draw 1.4s ease-out}
@keyframes draw{from{stroke-dashoffset:164}}
.path{list-style:none;padding:0;margin:var(--s3) 0 0;position:relative}
.path::before{content:'';position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--ac),var(--ln) 30%)}
.path li{position:relative;padding:0 0 var(--s4) 52px}
.path .nd{position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--ln)}
.path .done .nd{background:var(--ac);border-color:var(--ac)}
.path .now .nd{border-color:var(--ac);box-shadow:0 0 0 6px #4d8dff2a,0 0 24px var(--ac)}
.path h3{margin:0 0 12px}
.path .soon{opacity:.5}
.ls{display:flex;flex-wrap:wrap;gap:8px}
.ls a{border:1px solid var(--ln);border-radius:99px;padding:6px 16px;font-size:14px;color:var(--mu);transition:.2s}
.ls a:hover{border-color:var(--ac);color:var(--tx)}
.ls a.dn{color:var(--ok);border-color:#34d39966}
.code{position:relative}
.cp{position:absolute;top:10px;right:10px;z-index:1;background:var(--pn);border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:4px 12px;font:500 12px Inter;cursor:pointer}
.cp:hover{color:var(--tx);border-color:var(--ac)}
.t-c{color:#6B7BA4;font-style:italic}.t-s{color:#9CE5B4}.t-k{color:#7AA7FF}.t-d{color:#E5C07B}.t-n{color:#F6A878}
[data-theme=light] .t-c{color:#7C8AAE}[data-theme=light] .t-s{color:#0F8A4F}[data-theme=light] .t-k{color:#2F5BE0}[data-theme=light] .t-d{color:#A06A00}[data-theme=light] .t-n{color:#C2410C}
@media(max-width:720px){.hero2{flex-direction:column;align-items:flex-start;padding:var(--s4) var(--s3)}}
</style>
<style>
:root{--gold:#F2B45A}
[data-theme=light]{--gold:#B7791F}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:56px 56px;opacity:.28;-webkit-mask-image:radial-gradient(ellipse at 75% 0,#000,transparent 70%);mask-image:radial-gradient(ellipse at 75% 0,#000,transparent 70%)}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.hero2 h1{background:linear-gradient(120deg,var(--tx) 35%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--gold)}
.grid>.card:first-child .big{color:var(--gold)}
dt{color:var(--gold)}
#cd.ok{color:var(--gold);border-color:var(--gold);background:#f2b45a14}
.bg.on{border-color:var(--gold);box-shadow:0 0 18px #f2b45a44}
.path .done .nd{background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px #f2b45a88}
.toast{border-color:var(--gold);box-shadow:0 12px 44px #f2b45a55}
.card{transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 18px 40px -22px #4d8dff99}
.btn{transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px #2f6bff88}
.btn2,#side a{transition:.2s}
#side a:hover{padding-left:20px}
.tabs button:hover:not(.on){color:var(--tx);background:#4d8dff14}
.hero2>*{animation:in .9s cubic-bezier(.2,.7,.2,1) both}
.hero2>.rg{animation-delay:.18s}
.grid>.card,.path li{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
.grid>.card:nth-child(2){animation-delay:.1s}.grid>.card:nth-child(3){animation-delay:.2s}.grid>.card:nth-child(4){animation-delay:.3s}
.path li:nth-child(n+2){animation-delay:.08s}.path li:nth-child(n+4){animation-delay:.2s}.path li:nth-child(n+6){animation-delay:.3s}.path li:nth-child(n+8){animation-delay:.4s}.path li:nth-child(n+10){animation-delay:.5s}
[data-theme=light] body{background:radial-gradient(900px 520px at 85% -10%,#2f6bff22,transparent),var(--bg)}
[data-theme=light] .hero2{background:radial-gradient(600px 300px at 90% 0,#2f6bff22,transparent),var(--pn)}
[data-theme=light] .card,[data-theme=light] .hero2{box-shadow:0 1px 2px #0e183010,0 12px 28px -16px #0e18302e}
[data-theme=light] .card:hover{box-shadow:0 18px 40px -22px #2f6bff88}
[data-theme=light] .vid{box-shadow:0 24px 60px -30px #0e183066}
[data-theme=light] .tabs button.on,[data-theme=light] .btn{box-shadow:0 6px 18px #2f6bff44}
[data-theme=light] .path .now .nd{box-shadow:0 0 0 6px #2f6bff22}
[data-theme=light] #side.open{box-shadow:0 0 0 100vmax #0e183080}
</style>
<style>
.ib{display:grid;place-items:center}
.ib svg,#bnav svg,.sn svg,.bk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#bnav a{font-size:11px;line-height:1.2;gap:4px;padding:6px 0;transition:color .2s}
#bnav a.on svg{filter:drop-shadow(0 0 6px var(--ac))}
#side a.brand{padding:0;margin:0 8px var(--s3);border:0;color:var(--tx);background:none}
#side a.brand:hover{padding-left:0}
.sn{display:grid;gap:2px;margin-bottom:var(--s3)}
#side .sn a{display:flex;align-items:center;gap:12px;margin:0;padding:10px 12px;border:0;border-radius:10px}
#side .sn a:hover{padding-left:12px;background:#4d8dff14}
#side .sn a.on{background:#4d8dff1f;color:var(--ac2)}
#sw{position:relative;flex:1;max-width:460px;margin:0 12px}
#sq{width:100%;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 16px;color:var(--tx);font:15px Inter,sans-serif;transition:border-color .2s}
#sq:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px #4d8dff22}
#sr{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:8px;z-index:25;box-shadow:0 24px 50px -20px #000}
#sr.on{display:block}
#sr a{display:flex;flex-direction:column;padding:10px 12px;border-radius:10px;line-height:1.4}
#sr a:hover{background:#4d8dff1f}
#sr span,#sr p{font-size:13px;padding:0 4px}
.bk{display:inline-flex;align-items:center;gap:8px;margin-right:auto;padding:6px 14px;border-radius:99px;font-size:13px}
.bk svg{width:16px;height:16px}
.bk.on{color:var(--gold);border-color:var(--gold)}
.bk.on svg{fill:var(--gold)}
.lk{display:block;font-size:13px;color:var(--ac2)}
.fcard{display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;gap:var(--s3);min-height:300px;max-width:560px;padding:var(--s4);border:1px solid var(--ln);border-radius:24px;background:radial-gradient(400px 200px at 50% 0,#4d8dff26,transparent),var(--pn);cursor:pointer;transition:border-color .3s}
.fcard.flip{border-color:var(--gold)}
.ft{font-family:var(--fd);font-size:clamp(30px,5vw,44px);line-height:1.2;font-weight:600;animation:fade .35s}
.fcard.flip .ft{font-family:Inter,sans-serif;font-size:19px;font-weight:400;line-height:1.6}
.r2{display:flex;gap:12px;margin-top:var(--s3)}
.r2 .btn,.r2 .gh{margin:0;padding:12px 28px}
.ls.col{flex-direction:column;max-width:560px}
.ls.col a{border-radius:14px;padding:14px 18px;font-size:16px;color:var(--tx)}
@media(max-width:480px){#sw{margin:0 8px}}
</style>

===NOTES===
## What you will be able to do after this lesson
By the end of this lesson you will be able to check which Python you have, create an isolated environment for any project, activate it and leave it, install packages into it with pip, record those packages in a file, and rebuild the whole environment from that file on a clean machine. You will also be able to read the three errors beginners hit most often and say what caused each one.

This can look like housekeeping, but it is the foundation of the whole course. Every Flask project you build will live in its own environment, and deployment later depends on the file you create here.

## Part 1: What "Python is installed" actually means
Installing Python gives you three things. The **interpreter** is the program (`python.exe`) that reads your code and runs it. The **standard library** is the set of modules that ship with Python, such as `json` and `pathlib`. And **site-packages** is a folder where third-party packages, like Flask, are stored. Third-party code is not part of Python. It lives on the **Python Package Index (PyPI)**, and **pip** is the tool that downloads it from there into site-packages.

Check what you have. Open PowerShell and run:
```powershell
python --version
```
Expected output (the last number may differ): `Python 3.14.0`. If you see `'python' is not recognized`, either Python is not installed or its folder is not on your **PATH**, the list of folders Windows searches when you type a command. On Windows the `py` launcher is a second way in: `py --version` does the same job.

Now check pip, and notice the shape of the command:
```powershell
python -m pip --version
```
The `-m` flag means "run this module as a script". So `python -m pip` asks this particular interpreter to run its own pip. Compare that with a bare `pip`, which means "whichever pip.exe Windows finds first on PATH", and that one may belong to a different Python. `python -m pip` removes the doubt, so it is the form we use throughout this course.

## Part 2: The problem virtual environments solve
Imagine project A (your quiz app) works with version 2 of a library, and project B (a new Flask site) needs version 3. Site-packages holds only one copy of each package per interpreter, so upgrading for B silently breaks A. There is a second problem: a global install hides what each project needs, so nobody, including future you, can say what to install on a new machine.

A **virtual environment** solves both by giving each project its own private site-packages and its own `python` and `pip` launchers. Engineering analogy: a fleet of robots where every robot carries its own firmware and tool versions, so updating one never bricks another.

## Part 3: Creating an environment
```powershell
mkdir pythonhub-demo
cd pythonhub-demo
python -m venv .venv
```
Read the last line piece by piece:
- `python` runs the interpreter.
- `-m venv` runs the standard-library module named `venv`.
- `.venv` is the folder to create. The name is a convention, not a rule. Common alternatives are `venv` and `env`. The leading dot marks it as a tooling folder, and VS Code and most `.gitignore` templates recognise `.venv` automatically, so the convention saves you configuration.

What you now have:
```
.venv/
  pyvenv.cfg          # records which Python created this environment
  Scripts/            # python.exe, pip.exe and the activate scripts (bin/ on macOS and Linux)
  Lib/site-packages/  # empty for now: this is where YOUR packages will go
```
The environment is a small folder, not a full copy of Python. It points back at the interpreter that created it, which is why `pyvenv.cfg` exists.

## Part 4: Activating it
Creating an environment does not use it. You have to tell your terminal to use it:
```powershell
.venv\Scripts\Activate.ps1
```
Your prompt gains a `(.venv)` prefix. What activation does is modest: it puts `.venv\Scripts` at the front of PATH for **this terminal window only**, so `python` and `pip` resolve to the environment's copies, and it changes the prompt. Nothing is installed or changed system-wide. That is why a new terminal window starts without it.

The command depends on your shell:
- PowerShell: `.venv\Scripts\Activate.ps1`
- Command Prompt: `.venv\Scripts\activate.bat`
- Git Bash: `source .venv/Scripts/activate`
- macOS and Linux: `source .venv/bin/activate`

Leave the environment at any time with `deactivate`.

### The error you will probably meet
PowerShell may refuse with a message containing "running scripts is disabled on this system". Windows blocks script files by default, and `Activate.ps1` is a script. You have three routes, and each has a different outcome:
- **Route A (recommended):** `Set-ExecutionPolicy -Scope Process -ExecutionPolicy RemoteSigned`. This relaxes the rule for the current window only and vanishes when you close it. Nothing permanent changes.
- **Route B:** the same command with `-Scope CurrentUser`. It is permanent for your account. Convenient, but it changes your machine's security setting for good.
- **Route C:** skip activation entirely and run `.venv\Scripts\python.exe` directly. This works because activation is only a convenience: the environment's interpreter is just a file you can call by path. It is also what scripts and deployment tools do.

## Part 5: Installing packages with pip
With the environment active, install Flask:
```powershell
python -m pip install flask
```
Piece by piece: `install` is the pip command, and `flask` is the package name on PyPI. Pip downloads Flask and also the several libraries it depends on, such as Werkzeug and Jinja2, and puts them all in `.venv\Lib\site-packages`. Inspect the result:
```powershell
python -m pip list          # every package installed in this environment
python -m pip show flask    # version, location and what it depends on
python -m pip uninstall flask
```
Run `pip list` in a fresh environment and you will see only pip itself. That emptiness is the point: the environment contains only what this project asked for.

## Part 6: Recording your packages
A project that cannot be rebuilt is a project that only works on your laptop. The standard solution is a text file named **requirements.txt**:
```powershell
python -m pip freeze > requirements.txt
```
`pip freeze` prints every installed package with its exact version, one per line. The `>` symbol is a shell operator that sends that output into a file instead of the screen, and it overwrites the file if it already exists. A file might look like this (your versions will differ):
```
blinker==1.9.0
click==8.1.8
Flask==3.1.0
Jinja2==3.1.5
```
To rebuild the environment anywhere, create a fresh `.venv`, activate it, and run:
```powershell
python -m pip install -r requirements.txt
```
The `-r` flag means "read the list of packages from this file".

There are two routes to a requirements file, with different outcomes:
- **Freeze everything (the route above):** you get exact versions of every package, including the hidden dependencies. Rebuilding gives you an identical environment, which is what you want for deployment. The cost is a longer, noisier file.
- **Write it by hand:** list only the packages you chose, for example `flask` alone. The file is short and readable, but a rebuild installs whatever versions are newest that day, so two machines can end up different.

For this course, freeze. Reproducibility matters more than tidiness.

## Part 7: What goes into Git
Never commit the `.venv` folder. It holds absolute paths from your machine, compiled files for your operating system, and thousands of files that pip can regenerate in seconds. Commit `requirements.txt` instead. Add this line to a file named `.gitignore`:
```
.venv/
```

## Part 8: Reading the errors
- **`'python' is not recognized as an internal or external command`:** Windows cannot find the interpreter. Fix PATH, reinstall Python with the PATH option ticked, or use `py` instead.
- **`ModuleNotFoundError: No module named 'flask'`:** the interpreter running your code is not the one pip installed into. Almost always the environment is not activated, or VS Code is using a different interpreter. Diagnose it with `python -c "import sys; print(sys.executable)"` and check that the path points inside `.venv`.
- **"running scripts is disabled on this system":** the execution policy problem from Part 4.

## Part 9: How this connects to Flask
Your Flask app will be a folder with a `.venv`, a `requirements.txt`, and your code. When you deploy in Week 11, the hosting platform will read `requirements.txt` and rebuild your environment on its own server. Every habit in this lesson is a habit you will use on every project from here on.

## Recap and cheat sheet
- Create: `python -m venv .venv`
- Activate (PowerShell): `.venv\Scripts\Activate.ps1`
- Leave: `deactivate`
- Install: `python -m pip install <package>`
- Inspect: `python -m pip list`
- Record: `python -m pip freeze > requirements.txt`
- Rebuild: `python -m pip install -r requirements.txt`
- Git: ignore `.venv/`, commit `requirements.txt`
===TASKS===
### Build your first environment | guided
Create a folder called `env-lab`, open PowerShell in it, create a virtual environment named `.venv`, activate it, and run `python -m pip list`. If PowerShell blocks the activation script, use Route A from Part 4.
HINT: The prompt should start with `(.venv)` once activation works. If it does not, run the activate command again and read the error message carefully.
EXPECT: Your prompt starts with `(.venv)` and `pip list` shows only `pip` (and possibly a very small number of other base packages).
SOL:
```powershell
mkdir env-lab
cd env-lab
python -m venv .venv
Set-ExecutionPolicy -Scope Process -ExecutionPolicy RemoteSigned
.venv\Scripts\Activate.ps1
python -m pip list
```
### Prove the environment is isolated | guided
Run `python -c "import sys; print(sys.prefix)"` once while the environment is active and once after `deactivate`. Compare the two paths and write one sentence explaining the difference.
HINT: `sys.prefix` is the folder of the Python installation currently in use.
EXPECT: Active: a path ending in `env-lab\.venv`. Deactivated: the path of your global Python installation.
SOL:
Inside the environment the prefix points at the `.venv` folder, because `python` now resolves to the environment's copy. Outside it points at the global installation. This is the proof that activation switches which interpreter you are using.
### Rebuild an environment from a file | independent
Install `requests` into your environment, freeze to `requirements.txt`, then deactivate and delete the `.venv` folder. Create a new `.venv`, activate it, install from `requirements.txt`, and verify that it works by printing the version of `requests`.
HINT: Use `python -c "import requests; print(requests.__version__)"` to verify. Delete the folder in File Explorer or with `Remove-Item -Recurse -Force .venv`.
EXPECT: A version number prints, and `requirements.txt` lists `requests` with several of its dependencies.
SOL:
```powershell
python -m pip install requests
python -m pip freeze > requirements.txt
deactivate
Remove-Item -Recurse -Force .venv
python -m venv .venv
.venv\Scripts\Activate.ps1
python -m pip install -r requirements.txt
python -c "import requests; print(requests.__version__)"
```
### Diagnose three broken setups | debugging
For each situation, write down the cause and the exact fix. (a) You run `pip install flask`, then `python app.py` fails with `ModuleNotFoundError: No module named 'flask'`. (b) Typing `python` gives `'python' is not recognized`. (c) You committed the `.venv` folder to Git and your repository is 400 MB.
HINT: For (a), the question is which interpreter each command used. For (c), think about what should be committed instead.
SOL:
(a) The bare `pip` and the bare `python` belong to different interpreters, or the environment is not active. Fix: activate `.venv`, then run `python -m pip install flask` and `python app.py` so both use the same interpreter. Confirm with `python -c "import sys; print(sys.executable)"`.
(b) The interpreter is not on PATH. Fix: reinstall Python with the "add to PATH" option, or use `py`.
(c) Remove it from tracking with `git rm -r --cached .venv`, add `.venv/` to `.gitignore`, and commit `requirements.txt` instead.
### Write a setup script | challenge
Write a PowerShell script `setup.ps1` that creates `.venv` if it does not exist, installs from `requirements.txt` if that file exists, and prints the path of the interpreter it used. It must work without activating the environment.
HINT: Call `.venv\Scripts\python.exe` directly. Use `Test-Path` to check whether a file or folder exists.
EXPECT: Running `.\setup.ps1` on a fresh clone builds the environment and prints a path ending in `.venv\Scripts\python.exe`.
SOL:
```powershell
if (-not (Test-Path .venv)) { python -m venv .venv }
if (Test-Path requirements.txt) { & .\.venv\Scripts\python.exe -m pip install -r requirements.txt }
& .\.venv\Scripts\python.exe -c "import sys; print(sys.executable)"
```
===QUIZ===
Q: Which statement about **activating** a virtual environment is accurate?
- It copies a fresh Python interpreter into your current folder
- It changes PATH and the prompt for that terminal session only, so `python` and `pip` resolve to the environment's copies *
- It is required before `.venv\Scripts\python.exe` can run at all
- It permanently edits the system-wide PATH for all terminals
WHY: Activation is a convenience layer. Because it only edits the current session, a new terminal starts without it. The environment's interpreter is an ordinary file, so calling it by full path works even with no activation.
Q: You create `.venv` but do **not** activate it, then run `pip install requests`. Where does the package go?
- Into `.venv`, because the folder exists in the current directory
- Into whichever interpreter owns the first `pip` on PATH, which is the global one rather than `.venv` *
- Nowhere, because pip refuses to run outside an environment
- Into both, so that either interpreter can import it
WHY: Pip has no idea about the folder in front of you. It installs into the interpreter it belongs to, and without activation that is the global one. This is the classic way people pollute their global Python by accident.
Q: Which single flag lets `python` run a module as a script, as in `python -m venv .venv`?
TYPE: -m
WHY: `-m` means "run library module as a script". The same flag powers `python -m pip`, which guarantees that pip belongs to the interpreter you named.
Q: Why does this course use `python -m pip install flask` instead of `pip install flask`?
- It downloads packages faster
- It guarantees pip is the one belonging to the interpreter you invoked, rather than whichever pip is first on PATH *
- It avoids needing an internet connection
- It always installs globally
WHY: The only difference is which pip runs. `python -m pip` removes any chance that the install lands in a different Python from the one that will run your code.
Q: A virtual environment is active, and the project lives at `C:\code\hub`. What does this print?
```powershell
python -c "import sys; print(sys.prefix)"
```
- The folder of the global Python installation
- `C:\code\hub\.venv` *
- `C:\code\hub`
- `C:\Windows\System32`
WHY: `sys.prefix` is the root of the installation currently in use. With the environment active, `python` resolves to the copy inside `.venv`, so the prefix is the `.venv` folder. Without activation you would see the global path.
Q: Why should `.venv/` be listed in `.gitignore` rather than committed?
- Git cannot store folders that contain executables
- It contains your passwords and API keys
- It holds machine-specific absolute paths and thousands of regenerable files, while `requirements.txt` is enough to rebuild it *
- Environments are read-only, so Git cannot track them
WHY: The environment is an output, like compiled code, and the requirements file is its recipe. Committing the output bloats the repository and breaks on other machines.
Q: What is the conventional file name that lists a project's dependencies for `pip install -r`?
TYPE: requirements.txt
WHY: The name is a convention, so tools and teammates know where to look. `-r` can read any file, but this name is expected everywhere.
Q: You installed Flask yesterday, yet today `python app.py` raises `ModuleNotFoundError: No module named 'flask'`. What is the most likely cause?
- Flask removes itself after 24 hours
- Flask does not support Python 3.14
- The terminal or editor is running a different interpreter than the one pip installed into, usually because the environment is not active *
- `requirements.txt` was deleted
WHY: The error means "the interpreter running this code has no flask in its site-packages". The package exists, just in another interpreter. Check `sys.executable` to see which one is running.
Q: You must give a teammate an environment that is identical to yours for a deployment. Which route is best, and why?
- A hand-written file listing only `flask`, because shorter files are more reliable
- `pip freeze` output with exact versions, because a rebuild then installs the same versions of every package, including hidden dependencies *
- Zip and send the `.venv` folder, because it contains everything
- Nothing is needed, because pip always installs identical versions
WHY: A short hand-written file leaves versions open, so two machines drift apart. Zipping `.venv` fails because the environment contains absolute paths from your machine.
Q: Which single command leaves a virtual environment and returns the prompt to normal?
TYPE: deactivate
WHY: `deactivate` is defined by the activation script, which is why it only exists while an environment is active. It restores PATH and the prompt for that terminal session.

===NOTES===
## What you will be able to do after this lesson
You will be able to write a function from scratch and explain every part of its first line, call it with positional and keyword arguments, decide between printing and returning, return more than one value, predict which variable a name refers to inside and outside a function, and read the three function errors beginners meet most: a wrong number of arguments, a missing return value, and the scope error `UnboundLocalError`.

## Part 1: Why functions exist
A **function** is a named, reusable block of code that takes some inputs, does a job, and can hand back a result. You already use them: `print()`, `len()` and `sum()` are functions someone else wrote. Writing your own gives you three things.
- **No repetition.** If you need to convert a motor speed from RPM to radians per second in ten places, you write the formula once. When you find a bug, you fix it once.
- **A name for an idea.** `clamp(speed, 0, 100)` is easier to read than three lines of `if` statements.
- **Testability.** A small function with clear inputs and outputs can be checked on its own, which is how professionals catch bugs early.

In Flask, every page of your website will be a function, so this lesson is not optional background.

## Part 2: Anatomy of a function definition
```python
def area(width, height):
    return width * height

result = area(3, 4)
print(result)
```
Output: `12`. Read the first line piece by piece:
- `def` is the keyword that says "I am defining a function".
- `area` is the function's name. Use `snake_case` (lowercase words joined by underscores) and a verb or noun that says what it does.
- `(width, height)` lists the **parameters**: names for the inputs the function expects.
- The colon `:` ends the header and says "the body follows".
- The **indented** lines are the body. Indentation is how Python knows which lines belong to the function. Use four spaces, and keep it consistent.
- `return` sends a value back to whoever called the function and ends the function immediately.

Defining a function does not run it. Nothing happens until you **call** it with parentheses: `area(3, 4)`. The values `3` and `4` are the **arguments**. Parameters are the names in the definition, arguments are the values you pass in. Python matches them up and runs the body.

## Part 3: Calling a function, and how it can go wrong
There are two ways to pass arguments, and they give the same result when used correctly:
```python
area(3, 4)                    # positional: matched by order
area(height=4, width=3)       # keyword: matched by name, any order
```
Use positional for obvious inputs. Use keywords when the meaning of a value is not obvious from its position, for example `move(speed=5, safe=True)` is clearer than `move(5, True)`.

If the count is wrong, Python stops and tells you exactly why:
```python
area(3)
# TypeError: area() missing 1 required positional argument: 'height'

area(3, 4, 5)
# TypeError: area() takes 2 positional arguments but 3 were given
```
Read tracebacks from the bottom. The last line names the function and the problem, which here points directly at the call you got wrong.

## Part 4: return, print, and None
Beginners often mix up two different actions:
```python
def show_area(w, h):
    print(w * h)          # displays text, then the function ends

def get_area(w, h):
    return w * h          # hands the number back to the caller

a = show_area(3, 4)       # prints 12, but a is None
b = get_area(3, 4)        # prints nothing, b is 12
```
`print` is for humans to read. `return` is for other code to use. If you only print, the value is gone: you cannot add it to something or store it. A function with no `return` statement returns `None`, Python's value meaning "nothing here". When a result you expected turns out to be `None`, a missing `return` is the first suspect.

Two useful details:
- **Several values:** `return low, high` actually returns one **tuple** `(low, high)`, which you can unpack: `low, high = bounds(data)`.
- **Early return:** `return` ends the function on the spot, so you can handle special cases first.
```python
def safe_divide(a, b):
    if b == 0:
        return None       # leave early: nothing sensible to return
    return a / b
```

## Part 5: Scope, or where a name is visible
**Scope** is the region of code where a name exists. Variables created inside a function are **local**: they exist only while the function runs.
```python
x = 10                    # global: visible everywhere in this file

def show():
    x = 5                 # a NEW local x, unrelated to the global
    print(x)

show()                    # 5
print(x)                  # 10: the global was never touched
```
When Python meets a name, it searches in this order, called **LEGB**: Local (inside the current function), Enclosing (any function wrapped around it), Global (the file), Built-in (names like `len`). It stops at the first match.

That rule produces a famous trap. Assigning to a name anywhere in a function makes it local for the whole function:
```python
count = 0

def bump():
    count += 1            # UnboundLocalError

bump()
```
The error reads: `UnboundLocalError: cannot access local variable 'count' where it is not associated with a value`. Python saw an assignment to `count`, decided it was local, and then found no value for it yet. There are three routes out, with different outcomes:
- **Pass it in and return it (best):** `def bump(count): return count + 1`. The function depends only on its inputs, so it is easy to test and reason about.
- **Use the `global` keyword:** `global count` inside the function makes it use the global one. It works, but any function can now change shared state, which makes bugs hard to track.
- **Wrap the state in an object:** this is what classes are for, and you met them in Week 2.

Shadowing is a related trap. If you write `len = 3` inside a function, a later `len([1, 2])` in that function fails with `TypeError: 'int' object is not callable`, because your local name hides the built-in.

## Part 6: Docstrings and naming
A **docstring** is a string placed first in the body. It documents the function and is shown by `help(area)`:
```python
def area(width, height):
    """Return the area of a rectangle."""
    return width * height
```
Good functions do one job and have a name that says which. If you cannot name it without the word "and", split it into two functions.

## Part 7: How this connects to Flask
A Flask page is a function: the function runs when someone visits a URL, and its **return value is the response** the browser receives. A URL like `/user/<name>` becomes a parameter on your function. And because Flask views must `return`, the print-versus-return distinction you just learned decides whether your page shows anything at all.

## Recap
- `def name(parameters):` defines a function, and calling it with arguments runs it.
- Parameters are names in the definition; arguments are the values you pass.
- `return` hands a value back and ends the function; no `return` means `None`.
- Names assigned inside a function are local, and Python searches Local, Enclosing, Global, Built-in.
- Prefer passing values in and returning results over changing globals.
===TASKS===
### Write and call your first functions | guided
Create `functions_lab.py`. Write `area(width, height)` returning the area of a rectangle, then print `area(3, 4)` and `area(height=2, width=5)`. Finally, call `area(3)` on purpose and read the error.
HINT: The keyword call should give the same result as swapping the order of positional arguments.
EXPECT: `12`, then `10`, then a `TypeError` mentioning the missing argument `'height'`.
SOL:
```python
def area(width, height):
    return width * height

print(area(3, 4))
print(area(height=2, width=5))
print(area(3))  # TypeError: area() missing 1 required positional argument: 'height'
```

EXPECT: `show_double(4)` prints `8` and its variable prints `None`; `get_double(4)` prints nothing itself and its variable prints `8`.

===NOTES===
## What you will be able to do after this lesson
You will be able to give parameters default values and explain when those defaults are evaluated, collect any number of extra arguments with `*args` and `**kwargs`, unpack lists and dictionaries into a call with `*` and `**`, force arguments to be passed by name, and avoid the mutable default argument bug, one of the most famous traps in Python.

## Part 1: Default arguments
A **default argument** gives a parameter a value to use when the caller leaves it out.
```python
def log(message, level="INFO"):
    print(f"[{level}] {message}")

log("Motor started")            # [INFO] Motor started
log("Battery low", "WARN")      # [WARN] Battery low
log("Stall", level="ERROR")     # [ERROR] Stall
```
The syntax is `parameter=value` in the definition. The purpose is to make the common case short while keeping the unusual case possible. One rule applies: parameters with defaults must come **after** parameters without them. Reversing them is rejected before your program even starts:
```python
def log(level="INFO", message):   # SyntaxError: parameter without a default follows parameter with a default
```
The reason is simple. When you call `log("hello")`, Python fills parameters from left to right, so a required parameter after an optional one would be ambiguous.

## Part 2: The mutable default trap
Here is the surprising part. A default value is created **once**, when the `def` line runs, not each time the function is called. For numbers and strings that does not matter, because they cannot change. For a list or dictionary it matters a great deal:
```python
def add_reading(value, readings=[]):
    readings.append(value)
    return readings

print(add_reading(10))   # [10]
print(add_reading(20))   # [10, 20]   <-- the same list was reused
```
You expected `[20]`. Both calls shared one list that was created when the function was defined. There are two routes, with different outcomes:
- **The `None` sentinel (recommended):** use `None` as the default, which is immutable and safe, and create the list inside the function.
```python
def add_reading(value, readings=None):
    if readings is None:
        readings = []
    readings.append(value)
    return readings
```
- **Copying the argument:** `readings = list(readings)` at the top avoids changing the caller's list, but it does not fix the shared default by itself. It only helps once you have already chosen a safe default.

Remember the rule: never use a list, dictionary or set as a default value. Use `None`.

## Part 3: `*args`, accepting any number of positional arguments
Sometimes you do not know how many inputs you will get. `*args` collects all the extra positional arguments into one **tuple**:
```python
def total(*args):
    print(args)
    return sum(args)

total(4, 8, 15)     # prints (4, 8, 15) and returns 27
total()             # prints () and returns 0
```
The star in the **definition** means "pack". The name `args` is only a convention, and `*numbers` works identically, but sticking to `args` makes code recognisable. With no extra arguments you simply get an empty tuple, so the function never crashes for lack of input.

The star also works in the opposite direction, in a **call**, where it means "unpack":
```python
readings = [4, 8, 15]
total(*readings)    # same as total(4, 8, 15)
```
Without the star, `total(readings)` would pass one argument, the list itself, and `sum` would fail trying to add a list to `0`.

## Part 4: `**kwargs`, accepting any number of keyword arguments
`**kwargs` collects extra **keyword** arguments into a **dictionary**:
```python
def describe(name, **kwargs):
    print(name, kwargs)

describe("Rover", speed=5, mode="safe")
# Rover {'speed': 5, 'mode': 'safe'}
```
Two stars in a call unpack a dictionary into keyword arguments:
```python
settings = {"speed": 5, "mode": "safe"}
describe("Rover", **settings)    # identical to the call above
```
You will see this constantly. Libraries use `**kwargs` so they can accept options without listing every one in advance.

## Part 5: Keyword-only arguments and parameter order
A bare `*` in the parameter list forces everything after it to be passed by name:
```python
def move(speed, *, safe=True):
    return (speed, safe)

move(5, safe=False)    # fine
move(5, False)         # TypeError: move() takes 1 positional argument but 2 were given
```
The purpose is safety: `move(5, False)` hides what `False` means, so the function demands you write it out. When you combine every kind of parameter, the order is fixed:
```python
def f(a, b=1, *args, c=2, **kwargs):
    return a, b, args, c, kwargs

f(1, 2, 3, 4, c=5, d=6)
# (1, 2, (3, 4), 5, {'d': 6})
```
Trace it: `1` goes to `a`, `2` to `b`, the extra positionals `3, 4` into `args`, `c=5` matches the keyword-only `c`, and the leftover `d=6` lands in `kwargs`. The order is: required, defaults, `*args`, keyword-only, `**kwargs`.

## Part 6: Forwarding arguments
A very common pattern is a function that accepts anything and passes it along unchanged:
```python
def wrapper(*args, **kwargs):
    print("calling")
    return real_function(*args, **kwargs)
```
The wrapper does not need to know what the real function expects. This exact pattern is how decorators work, which is the topic two lessons from now.

## Part 7: How this connects to Flask
Flask uses all of this. `Flask(__name__, static_folder="assets")` mixes positional and keyword arguments. And `render_template("page.html", title="Hub", items=items)` accepts any number of keyword arguments, because its signature collects them with `**context`. Every key you pass becomes a variable available inside your HTML template.

## Recap
- A default is evaluated once, when the function is defined.
- Never use a mutable object as a default; use `None` and create the object inside.
- `*args` packs extra positionals into a tuple, and `**kwargs` packs extra keywords into a dict.
- In a call, `*` and `**` unpack a sequence or a dictionary.
- A bare `*` makes later parameters keyword-only. The order is required, defaults, `*args`, keyword-only, `**kwargs`.

<script type="text/markdown" id="n-1-4">
===NOTES===
## What you will be able to do after this lesson
You will be able to treat functions as ordinary values (store them, pass them and return them), write short `lambda` functions and know when not to, define a function inside another function, build a closure that remembers its surroundings, explain what a closure actually captures, use `nonlocal` correctly, and avoid the late-binding trap that catches almost everyone.

## Part 1: Functions are values
In Python a function is an object, just like a number or a list. A name refers to it, and you can give it more names, put it in containers, or hand it to another function.
```python
def double(n):
    return n * 2

f = double           # no parentheses: f now refers to the same function
print(f(5))          # 10
print(double)        # <function double at 0x000001A2B3C4D5E0>
```
The difference between `double` and `double(5)` is the key idea of this lesson. **`double`** is the function itself. **`double(5)`** is a call that runs it and produces a result. Writing `print(double)` is a common mistake: it shows the function object, not an answer. Because functions are values, you can store them in a dictionary and choose one at runtime:
```python
operations = {"double": double, "square": lambda n: n * n}
print(operations["square"](4))     # 16
```
This replaces long `if/elif` chains, and Flask uses a similar idea to map URLs to functions.

## Part 2: Passing functions to other functions
A function that takes another function as an argument is called a **higher-order function**. You already know one: `sorted` accepts a `key` function that decides how to compare items.
```python
words = ["pear", "fig", "apple"]
print(sorted(words, key=len))      # ['fig', 'pear', 'apple']
```
Notice `key=len` has no parentheses. You are giving `sorted` the function so that it can call `len` on each word itself. If you wrote `len()` you would be calling it immediately, with no argument, and get an error.

## Part 3: `lambda`, the one-line function
When the function is tiny and used once, a **lambda** is a compact way to write it:
```python
square = lambda n: n * n
```
Read it as: `lambda` (keyword), `n` (parameters), `:` (separator), `n * n` (the expression whose value is returned automatically). A lambda has no name and its body must be a **single expression**. It cannot contain statements such as `return`, assignment or loops.
```python
points = [("a", 3), ("b", 1), ("c", 2)]
print(sorted(points, key=lambda p: p[1]))   # [('b', 1), ('c', 2), ('a', 3)]
```
Use a lambda for short throwaway functions like this. If you need a name, a docstring, several lines, or you will reuse it, write a normal `def`. Lambdas are never required, just convenient.

## Part 4: Functions inside functions
Python lets you define a function inside another one:
```python
def outer():
    message = "hello"
    def inner():
        print(message)     # inner can read outer's variable
    inner()
```
`inner` can read `message` because of the **Enclosing** step in the LEGB lookup from the last lesson. The inner function exists only while `outer` runs, unless you return it.

## Part 5: Closures
Now the important step: return the inner function instead of calling it.
```python
def make_multiplier(n):
    def times(x):
        return x * n
    return times

double = make_multiplier(2)
triple = make_multiplier(3)
print(double(5))     # 10
print(triple(5))     # 15
```
`make_multiplier` has finished by the time `double(5)` runs, so you would expect `n` to be gone. It is not. `times` **remembers** the variable `n` from the function that created it. A function bundled together with the variables it remembers is a **closure**. The two closures `double` and `triple` each carry their own separate `n`. You can even inspect it:
```python
print(double.__closure__[0].cell_contents)    # 2
```
The purpose of closures is configuration without classes: `make_multiplier(2)` builds a function that is "pre-set" to multiply by 2. Think of it as a controller you tune once with a gain value and then call repeatedly.

## Part 6: What a closure captures, and the late-binding trap
A closure captures the **variable**, not a snapshot of its value at that moment. If the variable changes later, the closure sees the new value. This produces a famous surprise:
```python
funcs = [lambda x: x * i for i in range(3)]
print([f(10) for f in funcs])     # [20, 20, 20]  not [0, 10, 20]
```
All three lambdas share one variable `i`. By the time you call them, the loop has finished and `i` is `2`. There are two routes to fix it:
- **Bind the value with a default argument (common):** `lambda x, i=i: x * i`. Defaults are evaluated at definition time, so each lambda gets its own copy: `[0, 10, 20]`.
- **Use a factory function:** write `make_multiplier(i)` and call it in the loop. Each call has its own `n`, which is the same idea as the example in Part 5.

## Part 7: `nonlocal`, changing the remembered variable
Reading an enclosing variable works automatically. Changing it does not:
```python
def make_counter():
    count = 0
    def increment():
        count += 1          # UnboundLocalError
        return count
    return increment
```
This is the same scope rule from Lesson 1-2: assigning to a name makes it local to `increment`. The keyword `nonlocal` says "this name belongs to the nearest enclosing function".
```python
def make_counter():
    count = 0
    def increment():
        nonlocal count
        count += 1
        return count
    return increment

c = make_counter()
print(c(), c(), c())      # 1 2 3
```
Each counter keeps its own `count`, so `make_counter()` called twice gives two independent counters. The alternatives to `nonlocal` are a mutable container such as `count = [0]` (works, but looks hacky) or a class with an attribute, which is often the clearest choice once state grows beyond one or two values.

## Part 8: Why this matters for Flask
Closures and functions-as-values are the machinery behind decorators, which come next. When you write `@app.route("/")`, Flask receives your function as a value and stores it in a table that maps URLs to functions. A decorator is simply a function that takes a function and returns a closure.

## Recap
- A function is a value. `f` is the function, `f()` calls it.
- A higher-order function takes or returns functions, for example `sorted(items, key=len)`.
- A lambda is a one-expression anonymous function.
- A closure is an inner function that remembers variables from its enclosing function.
- Closures capture variables, not values, which causes the late-binding trap.
- Use `nonlocal` to reassign a remembered variable.
===TASKS===
### A dictionary of functions | guided

===NOTES===
## What you will be able to do after this lesson
You will be able to explain what a decorator is in one sentence, write one from scratch, apply it with the `@` syntax and say exactly what that syntax does behind the scenes, keep the original function's name with `functools.wraps`, write decorators that take arguments, and predict the order when several decorators are stacked.

## Part 1: The idea
A **decorator** is a function that takes a function and returns a new function, usually one that does the original job plus something extra. Last lesson you learned both ingredients: functions can be passed around as values, and an inner function can remember variables from its enclosing function. A decorator combines them.

Why bother? Because some behaviour belongs to many functions: timing, logging, checking that a user is logged in, retrying on failure. Without decorators you would copy that code into every function. With one, you write it once and attach it with a single line.

## Part 2: Building a decorator by hand
Start with a plain function we want to time:
```python
import time

def slow():
    time.sleep(0.2)
    return "done"
```
Now write a function that takes another function and returns a timed version:
```python
def timer(func):
    def wrapper(*args, **kwargs):
        start = time.perf_counter()
        result = func(*args, **kwargs)
        elapsed = time.perf_counter() - start
        print(f"{func.__name__} took {elapsed:.4f}s")
        return result
    return wrapper
```
Read it layer by layer:
- `timer(func)` receives the original function as a value.
- `wrapper` is the new function. It is a closure, so it remembers `func`.
- `*args, **kwargs` means the wrapper accepts any arguments at all and passes them on unchanged, so the decorator works on any function.
- `time.perf_counter()` is a high-resolution clock suited to measuring durations.
- `result = func(...)` runs the original and **saves its result**.
- `return result` hands that result back. Forgetting this line is the number one decorator bug: the original function would appear to return `None`.
- `return wrapper` hands back the new function itself, without calling it. There are no parentheses after `wrapper`.

Use it by hand:
```python
slow = timer(slow)
print(slow())      # slow took 0.2003s   then   done
```
We replaced the name `slow` with the wrapped version. Anyone calling `slow()` now gets the timed behaviour.

## Part 3: The `@` syntax
Python provides a shortcut for that reassignment:
```python
@timer
def slow():
    time.sleep(0.2)
    return "done"
```
This is exactly equivalent to writing `def slow(): ...` and then `slow = timer(slow)`. Nothing more. The `@` line is **syntactic sugar**, which is a convenience with no new behaviour. Two timing facts matter and are asked about in the quiz:
- The decorator function (`timer`) runs **once**, at the moment the `def` line is executed.
- The wrapper runs **every time** you call the decorated function.

## Part 4: `functools.wraps`, keeping the identity
There is a side effect. After decoration, `slow` is really `wrapper`:
```python
print(slow.__name__)     # wrapper
```
Debuggers, error messages and documentation tools all see `wrapper` instead of `slow`, and the docstring is lost. The standard library fixes this with a decorator for decorators:
```python
import functools

def timer(func):
    @functools.wraps(func)
    def wrapper(*args, **kwargs):
        ...
    return wrapper
```
`functools.wraps(func)` copies the original's name, docstring and other metadata onto `wrapper`. Make it a habit in every decorator you write. This matters for Flask in particular: Flask identifies each route by its function name, and two decorated functions both named `wrapper` would collide.

## Part 5: Decorators that take arguments
What if you want `@repeat(3)`? Now there are **three** layers, because `repeat(3)` must itself return a decorator:
```python
import functools

def repeat(times):                # layer 1: receives the argument
    def decorator(func):          # layer 2: receives the function
        @functools.wraps(func)
        def wrapper(*args, **kwargs):   # layer 3: runs on each call
            for _ in range(times):
                result = func(*args, **kwargs)
            return result
        return wrapper
    return decorator

@repeat(3)
def hello():
    print("hello")

hello()    # prints hello three times
```
Trace what `@repeat(3)` does. Python first evaluates `repeat(3)`, which returns `decorator`. Then it applies that to the function: `hello = repeat(3)(hello)`. Forgetting the parentheses, as in `@repeat`, passes the function in as `times`, which is a classic bug.

## Part 6: Stacking decorators
You can attach several. They apply from the **bottom up**, the one closest to the function first:
```python
def bold(f):
    def w(*a, **k):
        return "<b>" + f(*a, **k) + "</b>"
    return w

def italic(f):
    def w(*a, **k):
        return "<i>" + f(*a, **k) + "</i>"
    return w

@bold
@italic
def hi():
    return "hi"

print(hi())     # <b><i>hi</i></b>
```
It is equivalent to `hi = bold(italic(hi))`. `italic` wraps first, so it sits inside, and `bold` wraps the result on the outside.

## Part 7: How this connects to Flask
Here is the line you will write in every Flask app:
```python
@app.route("/")
def home():
    return "Hello"
```
`app.route("/")` is a decorator **with an argument**, exactly the three-layer pattern above. It registers your function in Flask's table of URLs, then hands your function back unchanged. Later you will meet `@login_required`, which wraps a view with a check before it runs. You now understand the machinery instead of memorising the syntax.

## Recap
- A decorator takes a function and returns a function, using closures.
- `@deco` above a `def` means `f = deco(f)`, run once at definition time.
- The wrapper takes `*args, **kwargs`, calls the original, and returns its result.
- Use `functools.wraps` to preserve the name and docstring.
- `@deco(arg)` is three layers: the outer function returns the decorator.
- Stacked decorators apply bottom up.

(a) A decorator's wrapper calls `func(*args, **kwargs)` but does not return it, so decorated functions return `None`. (b) A decorator ends with `return wrapper()` and later raises `TypeError: 'NoneType' object is not callable`. (c) You write `@repeat` instead of `@repeat(3)`. Explain each cause and the fix.

### Retry on failure | challenge
Write `@retry(times)` that calls the function, and if it raises an exception tries again, up to `times` attempts in total. If the last attempt still fails, let the exception propagate. Test it with a function that fails twice and then succeeds.
HINT: Use a `for attempt in range(1, times + 1)` loop with `try/except`, and `raise` inside the `except` on the final attempt.
EXPECT: The asserts below pass.
SOL:
```python
import functools

def retry(times):
    def decorator(func):
        @functools.wraps(func)
        def wrapper(*args, **kwargs):
            for attempt in range(1, times + 1):
                try:
                    return func(*args, **kwargs)
                except Exception:
                    if attempt == times:
                        raise
        return wrapper
    return decorator

calls = {"n": 0}

@retry(3)
def flaky():
    calls["n"] += 1
    if calls["n"] < 3:
        raise ValueError("fail")
    return "ok"

assert flaky() == "ok" and calls["n"] == 3
```

===NOTES===
## What you will be able to do after this lesson
You will be able to explain what a class and an object are and why they exist, write a class with an `__init__` method and several methods, say precisely what `self` is, create independent instances, read and change their attributes, explain the difference between two objects being equal and being the same object, and diagnose the three most common beginner errors with classes.

## Part 1: Why classes exist
Imagine tracking a robot with plain variables: `name = "Rover"`, `battery = 100`, `x = 0`. For one robot that is fine. For ten robots you now have thirty variables, and the functions that act on them (drive, charge) need all the right ones passed in. A dictionary helps: `robot = {"name": "Rover", "battery": 100}`. But then the data is in one place and the behaviour is somewhere else, and nothing stops you building a dictionary with a misspelt key.

A **class** bundles the data and the behaviour that belongs together into one unit. The class is a **blueprint**. An **object** (also called an **instance**) is one real thing built from that blueprint. One `Robot` class, many `Robot` objects, each with its own battery level.

## Part 2: Your first class
```python
class Robot:
    def __init__(self, name, battery=100):
        self.name = name
        self.battery = battery

    def status(self):
        return f"{self.name}: {self.battery}% battery"

r1 = Robot("Rover")
r2 = Robot("Scout", 60)
print(r1.status())     # Rover: 100% battery
print(r2.status())     # Scout: 60% battery
```
Read it carefully:
- `class Robot:` starts the blueprint. Class names use **PascalCase** (each word capitalised, no underscores). Functions and variables use snake_case, so you can tell them apart at a glance.
- `def __init__(self, name, battery=100):` defines the **initializer**, a special method Python calls automatically right after it creates a new object. Its job is to set the object's starting data. The double underscores mark names that Python itself gives meaning to; they are called dunder (double-underscore) methods.
- `self.name = name` creates an **attribute**, a variable stored on this particular object. The left side is the attribute, the right side is the parameter.
- `Robot("Rover")` creates a new object and runs `__init__` with the arguments you gave. You never pass `self` yourself.

## Part 3: What `self` really is
`self` is the most confusing word in beginner Python, so let us make it concrete. When you write `r1.status()`, Python translates it into `Robot.status(r1)`. The object before the dot becomes the **first argument**, automatically. Inside the method, the parameter that receives it is conventionally named `self`.

So `self` simply means "the particular object this method was called on". That is how one `status` method can report `Rover` for `r1` and `Scout` for `r2`: inside the method `self` refers to different objects each time. The name `self` is a convention, not a keyword, but every Python programmer uses it, so you should too.

You can see the stored data directly:
```python
print(r1.__dict__)     # {'name': 'Rover', 'battery': 100}
```
Attributes are stored in a dictionary belonging to each object. That is why the two robots do not interfere with each other.

## Part 4: Methods that change state
A method can read attributes, and it can also change them:
```python
class Robot:
    def __init__(self, name, battery=100):
        self.name = name
        self.battery = battery

    def drive(self, km):
        self.battery = max(0, self.battery - 2 * km)

r = Robot("Rover")
r.drive(10)
print(r.battery)       # 80
```
`drive` returns nothing, because its purpose is a **side effect**: it changes the object. Compare with `status`, which returns a value. Deciding whether a method should change the object, return a value, or both is a design choice, and a good rule is to make each method clearly do one of them.

## Part 5: Instances are independent, equality is not identity
Two objects built from one class do not share attributes:
```python
a = Robot("A")
b = Robot("A")
a.drive(10)
print(a.battery, b.battery)    # 80 100
print(a == b)                  # False
print(a is b)                  # False
```
Even though `a` and `b` have identical data, `==` is `False`. By default, `==` on your own objects compares **identity**, whether they are the very same object in memory, and `is` asks exactly that. Python does not guess what "equal" should mean for your class. In Lesson 2-3 you will define `__eq__` to teach it.

Now the opposite situation, which surprises beginners:
```python
c = a          # not a copy: c is a second name for the same object
c.drive(10)
print(a.battery)    # 60
```
Assignment never copies an object. It attaches another name to it, so changes through `c` show up in `a`.

## Part 6: Attributes, errors and printing
Reading an attribute that does not exist raises `AttributeError: 'Robot' object has no attribute 'color'`. Python lets you add new attributes from outside (`r.color = "red"`), but that scatters the data definition around your program, so set every attribute inside `__init__`.

Printing an object shows something unhelpful by default:
```python
print(r)     # <__main__.Robot object at 0x000001A2B3C4D5E0>
```
That is Python saying "an object of class Robot at this memory address". Lesson 2-3 shows how to control this with `__repr__`.

## Part 7: The three errors you will meet
- **Forgetting `self` in the definition.** `def status():` inside a class, then `r.status()`, raises `TypeError: Robot.status() takes 0 positional arguments but 1 was given`. Python passed the object in automatically and there was nowhere to put it.
- **Forgetting `self.` in front of an attribute.** In `__init__`, writing `name = name` only changes a local variable, and later `r.name` raises `AttributeError`.
- **Calling a method on the class instead of an object.** `Robot.status()` raises `TypeError: Robot.status() missing 1 required positional argument: 'self'`, because no object was supplied.

## Part 8: How this connects to Flask
`app = Flask(__name__)` creates an **instance** of the class `Flask`. Everything you do with `app`, such as `app.route(...)` and `app.run()`, is a method call on that object. The `request` object, database models and form classes you will meet in later weeks are all built on the ideas from this lesson.

## Recap
- A class is a blueprint, and an object (instance) is one thing built from it.
- `__init__` runs automatically on creation and sets up the attributes.
- `self` is the object a method was called on; `r.status()` means `Robot.status(r)`.
- Instances have independent attributes, and assignment attaches a new name rather than copying.
- `==` compares identity by default; you can define what equal means yourself later.

### Build the Robot class | guided

===NOTES===
## What you will be able to do after this lesson
You will be able to tell instance attributes from class attributes and predict which one Python finds, avoid the shadowing and shared-list traps, write a `@classmethod` as an alternative constructor, write a `@staticmethod`, and choose among a normal method, a class method and a static method for any given job.

## Part 1: Instance attributes versus class attributes
In the last lesson every attribute was set through `self` inside `__init__`, so each object held its own copy. Those are **instance attributes**. A **class attribute** is defined in the class body, outside any method, and belongs to the class itself, so every instance can see the same one.
```python
class Robot:
    count = 0                 # class attribute: shared by all robots
    max_battery = 100         # class attribute: a constant for the design

    def __init__(self, name):
        self.name = name      # instance attribute: one per robot
        Robot.count += 1

r1 = Robot("Rover")
r2 = Robot("Scout")
print(Robot.count)    # 2
print(r1.count)       # 2  (r1 has no count of its own, so Python finds the class's)
```
When Python evaluates `r1.count` it searches in a fixed order: first the **instance's own attributes**, then the **class's**, then parent classes. The first match wins. That lookup order explains everything in this lesson.

Class attributes are the right home for data that belongs to the whole design: a count of how many objects exist, a limit shared by all robots, a default setting, a constant such as a tax rate.

## Part 2: The shadowing trap
Assigning through an instance never changes the class attribute. It creates a **new instance attribute with the same name** that hides the class one:
```python
r1.count = 5
print(r1.count, r2.count, Robot.count)    # 5 2 2
```
`r1` now has its own `count`, found first in the lookup, while the class attribute is untouched. The same thing happens with `r1.count += 1`, because that reads the class value and then assigns a new instance attribute. To change the shared value, assign through the class: `Robot.count += 1`. Inside a method you can write `type(self).count += 1`, which also works when subclasses are involved.

## Part 3: The shared mutable trap
This is the class-level cousin of the mutable default argument bug:
```python
class Team:
    members = []              # one list for the whole class

    def add(self, name):
        self.members.append(name)

a, b = Team(), Team()
a.add("Ada")
print(b.members)              # ['Ada']  <-- b sees a's data
```
`append` modifies the shared list in place, and no assignment happens, so no shadowing occurs. The fix is to create the list per instance:
```python
class Team:
    def __init__(self):
        self.members = []     # one list per team
```
Rule: use class attributes for immutable constants and counters. Per-object data, especially lists and dictionaries, belongs in `__init__`.

## Part 4: Class methods
A normal method receives the instance as `self`. A **class method** receives the **class** as its first argument, by convention called `cls`. You mark it with the `@classmethod` decorator (you now know what a decorator is):
```python
class Robot:
    def __init__(self, name, battery=100):
        self.name = name
        self.battery = battery

    @classmethod
    def from_string(cls, text):
        name, battery = text.split("-")
        return cls(name, int(battery))

r = Robot.from_string("Rover-80")
print(r.name, r.battery)      # Rover 80
```
The main use is an **alternative constructor**: another way to build an object, here from a string. A class can have only one `__init__`, so classmethods are how you offer several creation routes (`from_string`, `from_dict`, `from_file`).

Notice `cls(name, int(battery))` rather than `Robot(name, int(battery))`. If a subclass `Drone` inherits `from_string`, then `Drone.from_string("D-50")` receives `cls = Drone` and builds a **Drone**. Hard-coding `Robot` would always build a `Robot`, which breaks inheritance.

## Part 5: Static methods
A **static method** receives neither the instance nor the class. It is an ordinary function that happens to live inside the class because it is related to it:
```python
class Robot:
    @staticmethod
    def is_valid_name(name):
        return name.isalpha() and len(name) >= 2

print(Robot.is_valid_name("R2"))      # False
```
There is no `self`, so a static method cannot read or change any object's data. If you try to use `self` inside one you get `NameError: name 'self' is not defined`. Both `Robot.is_valid_name("x")` and `r.is_valid_name("x")` work.

## Part 6: Choosing between the three
Ask what the method needs to know:
- It needs **this object's** data: a normal method, with `self`.
- It needs **the class** (to build instances, or to read or change class attributes): a `@classmethod`, with `cls`.
- It needs **neither**: a `@staticmethod`, or simply a module-level function. If you cannot decide, a plain function is often cleaner. Static methods mostly serve organisation, keeping a helper next to the class it belongs to.

## Part 7: How this connects to Flask
Flask configuration is commonly written as a class of class attributes, such as `class Config: DEBUG = False`, then loaded with `app.config.from_object(Config)`. Later, when you build database models, you will call methods on the class itself (`User.query...`) and write your own `from_dict` constructors. Class methods and class attributes are everywhere in real Flask code.

## Recap
- Class attributes are shared; instance attributes belong to one object. Lookup checks the instance first, then the class.
- Assigning through an instance creates a new instance attribute that shadows the class one.
- Never store per-object lists or dictionaries as class attributes.
- `@classmethod` receives `cls` and is the standard way to write alternative constructors.
- `@staticmethod` receives nothing and is just a related function stored in the class.
