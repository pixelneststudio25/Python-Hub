===NOTES===
## What you will be able to do after this lesson
You will be able to add, change and remove rows with `INSERT`, `UPDATE` and `DELETE`, explain why a missing `WHERE` is the most dangerous mistake in SQL, protect your data with `NOT NULL`, `UNIQUE`, `CHECK` and `DEFAULT`, catch the errors those constraints raise, explain transactions and use them so a multi-step change either fully happens or not at all, and read back the id and the number of rows affected by a statement.

Reading data (Lesson 5-2) cannot hurt anything. Writing data can. This lesson is about doing it safely.

## Part 1: INSERT
```sql
INSERT INTO lessons (title, week, done, created) VALUES ('Classes', 2, 0, '2026-10-13');
```
- The column list in parentheses says which columns you are filling, and `VALUES` gives the values **in the same order**. Always write the column list. Without it you depend on the table's column order, and adding a column later breaks your code.
- Columns you leave out get their `DEFAULT` value, or `NULL` if there is none, or fail if the column is `NOT NULL` with no default.
- Several rows at once: `VALUES (...), (...), (...)`.
- From Python, with several rows of data, use `executemany`:
```python
rows = [("Setup", 1), ("Functions", 1), ("Classes", 2)]
conn.executemany("INSERT INTO lessons (title, week, done, created) VALUES (?, ?, 0, date('now'))", rows)
```
`executemany` runs the statement once per tuple, efficiently and inside one transaction. `date('now')` is a built-in SQLite function that returns today's date as text in UTC.

After an insert, `cursor.lastrowid` gives the id SQLite assigned:
```python
cur = conn.execute("INSERT INTO lessons (title, week, done, created) VALUES (?, ?, 0, date('now'))",
                   ("Flask", 3))
new_id = cur.lastrowid
```
This is how you redirect to the new item's page after creating it.

## Part 2: UPDATE
```sql
UPDATE lessons SET done = 1 WHERE id = 3;
UPDATE lessons SET week = week + 1, title = 'Classes II' WHERE id = 4;
```
- `SET` lists the columns to change, with expressions allowed (`week + 1` uses the current value).
- **`WHERE` chooses which rows.** If you leave `WHERE` out, **every row** is updated. `UPDATE lessons SET done = 1;` marks the entire table finished, instantly, with no warning and no undo once committed.

**The safe habit.** Before running an `UPDATE` or `DELETE`, run the same `WHERE` as a `SELECT` and look at the rows it picks:
```sql
SELECT * FROM lessons WHERE id = 3;     -- check first
UPDATE lessons SET done = 1 WHERE id = 3;
```
In Python, `cursor.rowcount` tells you how many rows a statement changed. If you update by id and `rowcount` is `0`, that id did not exist, which your Flask view can turn into a 404.

## Part 3: DELETE
```sql
DELETE FROM lessons WHERE id = 3;
DELETE FROM lessons WHERE done = 0 AND week > 8;
```
The same warning, stronger: `DELETE FROM lessons;` removes every row (the table itself remains). `DROP TABLE lessons;` removes the table and everything in it.

**Two routes to "removing" data.**
- **Hard delete:** `DELETE`. The row is gone. Simple, but there is no way back and links to it break.
- **Soft delete:** add a column such as `deleted INTEGER NOT NULL DEFAULT 0` and run `UPDATE ... SET deleted = 1`. Your queries then add `WHERE deleted = 0`. Outcome: you can undo, audit and keep history, at the price of remembering the filter in every query.
Real applications often choose soft delete for user-visible content, and hard delete for data they must erase, such as when someone requests deletion of their personal data.

## Part 4: Constraints, rules the database enforces
A **constraint** is a rule attached to a column or table. The database refuses any change that breaks it, so bad data cannot get in, no matter which program or bug tries to write it. This is stronger than checking only in Python, because every future piece of code is covered too.
```sql
CREATE TABLE users (
    id       INTEGER PRIMARY KEY,
    email    TEXT    NOT NULL UNIQUE,
    name     TEXT    NOT NULL,
    role     TEXT    NOT NULL DEFAULT 'student' CHECK (role IN ('student', 'admin')),
    age      INTEGER CHECK (age IS NULL OR age BETWEEN 5 AND 120),
    created  TEXT    NOT NULL DEFAULT (date('now'))
);
```
- `NOT NULL`: a value is required.
- `UNIQUE`: no two rows may have the same value. Here two accounts cannot share an email. (A primary key is already unique.)
- `DEFAULT value`: used when the column is omitted from an insert. A function default needs parentheses: `DEFAULT (date('now'))`.
- `CHECK (condition)`: any condition you can write in `WHERE`. Note how `age` allows `NULL` explicitly, because a failing comparison with NULL is *unknown*, and `CHECK` treats unknown as passing, but being explicit is clearer.

When a rule is broken, Python raises `sqlite3.IntegrityError` with a message such as `UNIQUE constraint failed: users.email` or `CHECK constraint failed: role`. Catch it and turn it into something friendly:
```python
try:
    conn.execute("INSERT INTO users (email, name) VALUES (?, ?)", (email, name))
    conn.commit()
except sqlite3.IntegrityError:
    errors["email"] = "That email is already registered."
```
**Why not check in Python first** (`SELECT` to see if the email exists, then insert)? Because two requests can both pass the check and then both insert, a **race condition**. The constraint is the only check that cannot be raced, so rely on it, and treat the error as the normal signal.

## Part 5: Transactions
A **transaction** is a group of statements that is treated as one unit: either **all** of them take effect, or **none** do. The famous example is moving money: subtract from account A, add to account B. If the program crashes in between, you must not lose the money.
```python
try:
    with conn:                       # begins a transaction
        conn.execute("UPDATE accounts SET balance = balance - 50 WHERE id = 1")
        conn.execute("UPDATE accounts SET balance = balance + 50 WHERE id = 2")
except sqlite3.Error:
    print("transfer failed, nothing changed")
```
The `with conn:` block **commits** at the end if no exception occurred, and **rolls back** (undoes everything since the transaction began) if one did. You can also call `conn.commit()` and `conn.rollback()` yourself.

The four promises a database gives about transactions are abbreviated **ACID**:
- **Atomic:** all or nothing.
- **Consistent:** constraints always hold after a transaction.
- **Isolated:** concurrent transactions do not see each other's half-finished work.
- **Durable:** once committed, it survives a crash.
These guarantees are exactly what a JSON file cannot give you.

Practical rules: group steps that belong together into one transaction, keep transactions short, and let the `with` block do the committing.

## Part 6: Two routes to updating a counter
You want to count lesson views.
- **Route A, read, add in Python, write back:**
```python
n = conn.execute("SELECT views FROM lessons WHERE id = ?", (id,)).fetchone()[0]
conn.execute("UPDATE lessons SET views = ? WHERE id = ?", (n + 1, id))
```
Outcome: if two requests run together, both read the same `n` and both write `n + 1`, so one view is lost.
- **Route B, let the database do the arithmetic:**
```python
conn.execute("UPDATE lessons SET views = views + 1 WHERE id = ?", (id,))
```
Outcome: one atomic statement, no lost updates. Whenever a new value depends on the old one, compute it in SQL.

## Part 7: Putting it together in a Flask-shaped function
```python
def mark_done(conn, lesson_id):
    with conn:
        cur = conn.execute("UPDATE lessons SET done = 1 WHERE id = ?", (lesson_id,))
    return cur.rowcount == 1          # False means no such lesson
```
In a view this becomes `if not mark_done(db, lesson_id): abort(404)`. Notice how little code each decision takes: the `WHERE id = ?` limits the change, `with conn` handles the transaction, and `rowcount` reports whether anything happened.

## Part 8: The mistakes
- **`UPDATE` or `DELETE` without `WHERE`.** Check with a `SELECT` first, and consider testing on a copy of the database file.
- **Forgetting to commit** (Lesson 5-1) so changes vanish.
- **Checking uniqueness in Python only**, leaving a race. Use `UNIQUE` and catch `IntegrityError`.
- **Read, modify, write counters in Python** instead of `views = views + 1`.
- **Catching `Exception` around everything**, which hides real bugs. Catch `sqlite3.IntegrityError` specifically.

## Recap
- `INSERT` needs a column list, `executemany` inserts many rows, and `lastrowid` gives the new id.
- `UPDATE` and `DELETE` change every row unless `WHERE` limits them. Preview with `SELECT`, and use `rowcount` to confirm.
- Constraints (`NOT NULL`, `UNIQUE`, `CHECK`, `DEFAULT`) enforce rules for every program, and violations raise `IntegrityError`.
- Rely on the constraint rather than a Python pre-check, which can be raced.
- A transaction is all-or-nothing. `with conn:` commits on success and rolls back on error. Compute values that depend on old values inside SQL.

===NOTES===
## What you will be able to do after this lesson
You will be able to summarise many rows into one answer with `COUNT`, `SUM`, `AVG`, `MIN` and `MAX`, explain how aggregates treat `NULL`, group rows with `GROUP BY` and compute one result per group, filter before grouping with `WHERE` and after grouping with `HAVING`, predict what a grouped query returns, fix the classic "column must appear in GROUP BY" confusion, and use these tools for the dashboards and statistics your apps need.

Until now each result row was one stored row. Aggregates let a query answer questions such as "how many?", "what is the average?" and "which week has the most lessons?", with the database doing the arithmetic instead of Python.

## Part 1: The practice data
Create a scratch table that you will reuse through the lesson.

 ('Cy',  'Flask',  NULL, '2026-10-01'),
 ('Dee', 'SQL',    5,    '2026-10-02'),
 ('Eli', 'SQL',    2,    '2026-10-03'),
 ('Fay', 'Python', 3,    '2026-10-03');
""")
```
Cy gave no rating (`NULL`), which will teach us how aggregates treat missing values.

## Part 2: Aggregate functions
An **aggregate function** takes many values and returns one.
```sql
SELECT COUNT(*)      FROM feedback;   -- 6   (number of rows)
SELECT COUNT(rating) FROM feedback;   -- 5   (non-NULL ratings)
SELECT AVG(rating)   FROM feedback;   -- 3.8 (19 / 5)
SELECT SUM(rating), MIN(rating), MAX(rating) FROM feedback;  -- 19, 2, 5
```
- `COUNT(*)` counts **rows**, whatever they contain.
- `COUNT(column)` counts the rows where that column is **not NULL**.
- `SUM`, `AVG`, `MIN` and `MAX` **ignore NULL**. This is why `AVG(rating)` is `19 / 5 = 3.8`, not `19 / 6`. Cy is not counted as a zero. Whether that is what you want is a decision to make deliberately.
- With no matching rows: `COUNT` returns `0`, but `SUM`, `AVG`, `MIN` and `MAX` return `NULL`. Use `COALESCE(SUM(x), 0)` if you want a zero.
- `COUNT(DISTINCT course)` counts different values: `3`.
- `AVG` of integers returns a decimal in SQLite, and you can round it: `ROUND(AVG(rating), 1)`.

Read them from Python with `fetchone()`:
```python
avg = conn.execute("SELECT ROUND(AVG(rating), 1) FROM feedback").fetchone()[0]
```
The result is a single row with a single column, so `[0]` picks the value.

## Part 3: GROUP BY
An aggregate over the whole table gives one number. **`GROUP BY` splits the rows into groups and gives one result row per group.**
```sql
SELECT course, COUNT(*) AS responses, ROUND(AVG(rating), 1) AS average
FROM feedback
GROUP BY course;
```
```
course  | responses | average
--------+-----------+--------
Flask   |         3 |     4.5
Python  |         1 |     3.0
SQL     |         2 |     3.5
```
Here is what the database does, step by step:
1. It collects every row and puts rows with the same `course` into the same group.
2. For each group it computes the aggregates, using only that group's rows.
3. It outputs one row per group.

Flask has three rows (ratings 5, 4, NULL), so `COUNT(*)` is 3 but the average only uses two ratings: 4.5.

**The rule that confuses everyone:** in a grouped query, every column in `SELECT` must either be in the `GROUP BY` or be inside an aggregate function. This is because the group has *many* rows, and a plain column like `name` has no single value for the group. Writing `SELECT course, name ... GROUP BY course` is meaningless, since Flask has three names. Many databases raise an error. SQLite quietly picks an arbitrary row's value, which hides the bug. Do not rely on that.

You can group by several columns, `GROUP BY course, created`, giving one group per distinct combination. You can also group by an expression, such as the month: `GROUP BY substr(created, 1, 7)` groups dates like `2026-10-02` by their first 7 characters, `2026-10`.

## Part 4: WHERE versus HAVING
Both filter, but at different moments.
- **`WHERE`** filters **rows before** they are grouped.
- **`HAVING`** filters **groups after** the aggregates are computed.
```sql
-- Only count ratings of 3 or more, then show courses with 2+ such ratings
SELECT course, COUNT(*) AS good
FROM feedback
WHERE rating >= 3
GROUP BY course
HAVING COUNT(*) >= 2;
```
Step by step: `WHERE` first throws away Eli (2) and Cy (NULL), leaving Ada, Bo, Dee, Fay. They are grouped: Flask has 2, SQL has 1, Python has 1. `HAVING COUNT(*) >= 2` keeps only Flask.

You cannot put an aggregate in `WHERE`, because the groups do not exist yet. `WHERE COUNT(*) >= 2` is an error. The reverse mistake, filtering ordinary columns in `HAVING`, works but is slower and unclear, so put row conditions in `WHERE`.

The complete order of work is now: `FROM`, `WHERE`, `GROUP BY`, aggregates, `HAVING`, `SELECT`, `ORDER BY`, `LIMIT`.

## Part 5: Sorting and limiting groups
You can sort by an aggregate, and `ORDER BY` can use the alias you gave it, because it runs after `SELECT`:
```sql
SELECT course, COUNT(*) AS responses
FROM feedback
GROUP BY course
ORDER BY responses DESC, course
LIMIT 2;
```
This returns the two most-reviewed courses, a classic "top N" query. The second sort key makes ties predictable.

## Part 6: Two routes to the same statistic
You want the average rating per course on a dashboard.
- **Route A, compute in Python:** `SELECT course, rating FROM feedback`, then loop, collect lists in a dictionary, divide. Outcome: it works, but every row travels from the database into Python, and you must hand-code the NULL handling.
- **Route B, compute in SQL:** the `GROUP BY` query above. Outcome: three result rows no matter how many feedback entries exist, calculated close to the data, with consistent NULL behaviour.

Rule of thumb: let the database summarise, and let Python present. Reserve Python loops for logic SQL cannot express.

## Part 7: Conditional counting
A useful trick is counting different categories in one pass, using a condition inside an aggregate:
```sql
SELECT course,
       COUNT(*)                                  AS total,
       SUM(CASE WHEN rating >= 4 THEN 1 ELSE 0 END) AS happy,
       SUM(rating IS NULL)                       AS unrated
FROM feedback
GROUP BY course;
```
- `CASE WHEN condition THEN a ELSE b END` is SQL's if-else. Here it gives `1` for each happy rating and `0` otherwise, and `SUM` then counts them.
- In SQLite, a comparison such as `rating IS NULL` evaluates to `1` or `0`, so you can sum it directly. Other databases need the `CASE` form, which is the portable one.

## Part 8: Common mistakes
- **Selecting a non-grouped, non-aggregated column** (Part 3).
- **`WHERE` with an aggregate**, which belongs in `HAVING`.
- **Forgetting that `AVG` skips NULL**, so the average is of the *rated* rows only.
- **Using `COUNT(column)` when you meant `COUNT(*)`**, undercounting rows with NULLs.
- **Integer division in your own formulas**: `SUM(x) / COUNT(*)` with integers truncates. Use `1.0 * SUM(x) / COUNT(*)`, or just `AVG(x)`.
- **Expecting empty groups to appear.** A course with no feedback has no rows, so it has no group. Showing zeros for missing groups needs a join, which is Week 6.

## Recap
- Aggregates (`COUNT`, `SUM`, `AVG`, `MIN`, `MAX`) reduce many rows to one value and ignore `NULL`, except `COUNT(*)`.
- `GROUP BY` makes one result row per distinct value of the grouping columns. Every selected column must be grouped or aggregated.
- `WHERE` filters rows before grouping, `HAVING` filters groups after, and aggregates are only allowed in `HAVING`.
- Sort and limit groups with `ORDER BY` on an alias for top-N queries.
- Let SQL summarise (a few result rows) and Python present. `CASE WHEN` inside `SUM` counts categories in one pass.

Q: What does `COUNT(*)` count?
- Non-NULL values of the first column
- Every row in the group or table *
- Distinct values
- Only numeric rows
WHY: `COUNT(*)` counts rows. `COUNT(column)` skips rows where that column is NULL.
Q: A table has ratings 5, 4, NULL. What is `AVG(rating)`?
- 3
- 4.5 *
- 4
- NULL

Q: What do `SUM`, `AVG`, `MIN` and `MAX` return when no rows match?
- 0
- NULL *
- An error
- An empty string
WHY: With nothing to summarise they give NULL, while `COUNT` gives 0. Use `COALESCE` for a default.
Q: What does `GROUP BY course` do?
- Sorts rows by course
- Puts rows with the same course into groups and returns one result row per group *
- Removes duplicate courses only
- Deletes rows
WHY: Aggregates are then calculated separately for each group.
Q: Why is `SELECT course, name FROM feedback GROUP BY course` a mistake?
- `name` is a reserved word
- A group contains many names, so `name` has no single value for the group *
- GROUP BY needs two columns
- It is slower
WHY: Selected columns must be grouped or aggregated. SQLite hides the bug by picking an arbitrary value.
Q: Which clause filters groups after the aggregates are computed?
TYPE: HAVING
WHY: `WHERE` filters rows before grouping, so it cannot see aggregates.
Q: Which query is correct for "courses with at least 2 responses"?
- `WHERE COUNT(*) >= 2 GROUP BY course`
- `GROUP BY course HAVING COUNT(*) >= 2` *
- `GROUP BY course WHERE COUNT(*) >= 2`
- `HAVING course >= 2`
WHY: The condition is on a group, so it belongs in `HAVING`, after `GROUP BY`.
Q: What does `SUM(CASE WHEN rating >= 4 THEN 1 ELSE 0 END)` compute?
- The sum of the ratings
- The number of ratings that are 4 or higher *
- The average
- The number of NULLs
WHY: `CASE` produces 1 for each match, and `SUM` adds those ones, which counts the matches.

- ORDER BY removes it

===NOTES===
## What you will be able to do after this lesson
You will be able to connect a Flask app to SQLite correctly, explain why each request gets its own connection and how `g` and `teardown_appcontext` manage it, define your schema in a `schema.sql` file, create a custom `flask init-db` command, move the Hub's data from JSON and Python lists into tables, write views that read, insert, update and aggregate with SQL, and test the whole thing against a temporary database. This is the project that combines every lesson of Week 5 into **Hub v2**.

## Part 1: The connection problem
In the scripts of Lessons 5-1 to 5-4 you opened a connection, used it, and closed it. In a web app, many requests are handled, sometimes at the same time. Two facts follow:
- A SQLite connection object **must not be shared between threads**. Flask's development server handles requests in separate threads, so one global connection would sometimes fail with `ProgrammingError: SQLite objects created in a thread can only be used in that same thread`.
- Opening a connection for **every query** is wasteful.

The standard answer is **one connection per request**: open it the first time the request needs it, reuse it for the rest of that request, and close it when the request ends. Flask gives you two tools to do this.

## Part 2: g, app context and teardown
- **`g`** is a special object that lives for **one request** and is a place to store things. You attach attributes to it (`g.db = ...`) and every function handling that request can see them. It is reset for each request, so one visitor never sees another's data.
- **`current_app`** is a proxy to the app handling the current request, which is how code outside `app.py` reads `current_app.config[...]` without importing `app` (and creating circular imports).
- **`app.teardown_appcontext(function)`** registers a function that Flask calls **when the request ends**, even if it ended with an error. That is the perfect place to close the connection.

```python
# db.py
import sqlite3
from pathlib import Path

import click
from flask import current_app, g

def get_db():
    if "db" not in g:
        path = Path(current_app.config["DATABASE"])
        path.parent.mkdir(parents=True, exist_ok=True)
        g.db = sqlite3.connect(path)
        g.db.row_factory = sqlite3.Row
        g.db.execute("PRAGMA foreign_keys = ON")
    return g.db

def close_db(error=None):
    db = g.pop("db", None)
    if db is not None:
        db.close()
```
Line by line:
- `"db" not in g` asks whether this request already opened a connection. If so it is reused.
- `mkdir(parents=True, exist_ok=True)` makes sure the `data` folder exists, because SQLite creates the file but not the folder.
- `row_factory = sqlite3.Row` is set once here, so every query in the app returns name-accessible rows.
- `PRAGMA foreign_keys = ON` switches on a safety feature you will need in Week 6. SQLite has it **off by default**, and it must be set for each connection.
- `g.pop("db", None)` removes and returns the connection, or `None` if there was none. The `error=None` argument is needed because Flask passes the exception (or `None`) to teardown functions.

## Part 3: The schema in its own file
SQL belongs in `.sql` files, not buried in Python strings.
```sql
-- schema.sql
CREATE TABLE IF NOT EXISTS lessons (
    id    INTEGER PRIMARY KEY,
    title TEXT    NOT NULL UNIQUE,
    week  INTEGER NOT NULL CHECK (week BETWEEN 1 AND 12),
    done  INTEGER NOT NULL DEFAULT 0 CHECK (done IN (0, 1)),
    views INTEGER NOT NULL DEFAULT 0
);

CREATE TABLE IF NOT EXISTS feedback (
    id      INTEGER PRIMARY KEY,
    name    TEXT    NOT NULL,
    email   TEXT    NOT NULL,
    rating  INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5),
    message TEXT    NOT NULL,
    created TEXT    NOT NULL DEFAULT (datetime('now'))
);
```
`datetime('now')` is the current UTC time as text. Storing UTC and converting for display is a good habit, because it avoids time zone confusion.

**Two routes to resetting the schema.**
- **Route A, `DROP TABLE IF EXISTS ...` at the top of the file.** Outcome: running `init-db` always gives a clean slate, which is handy while experimenting, and **silently destroys all data** if you run it on a database you care about.
- **Route B, `CREATE TABLE IF NOT EXISTS` (above).** Outcome: running it is always safe and changes nothing that exists. The cost is that it cannot change an existing table's shape. Handling that properly is what **migrations** do, a topic you will meet with SQLAlchemy in Week 7.
Use Route B, and delete the `.db` file by hand when you really want to start over.

## Part 4: A custom command to create the database
```python
def init_db():
    db = get_db()
    with current_app.open_resource("schema.sql") as f:
        db.executescript(f.read().decode("utf-8"))

@click.command("init-db")
def init_db_command():
    """Create the tables."""
    init_db()
    click.echo("Database ready.")

def init_app(app):
    app.teardown_appcontext(close_db)
    app.cli.add_command(init_db_command)
```
- `current_app.open_resource("schema.sql")` opens a file **relative to your app's folder**, so it works wherever you start the server from (no more working-directory surprises).
- `executescript` runs all the statements in the file.
- `click` is the command-line library Flask uses. `@click.command("init-db")` turns the function into a command, `app.cli.add_command` registers it, and `click.echo` prints.
- `init_app(app)` is a small function that **plugs the database into the app**, called once from `app.py`. This pattern of "a module that offers `init_app`" is the shape of every Flask extension.

In `app.py`:
```python
import db
app = Flask(__name__)
app.config.from_object("config.Config")
db.init_app(app)
```
Now create the database from PowerShell:
```powershell
flask --app app init-db
```
Run it twice and nothing breaks, thanks to `IF NOT EXISTS`.

## Part 5: Views that use the database
Each view asks for the connection and runs SQL, with the lessons of this week applied.
```python
from db import get_db

@app.route("/lessons")
def lessons():
    rows = get_db().execute(
        "SELECT id, title, week, done FROM lessons ORDER BY week, id").fetchall()
    return render_template("lessons.html", lessons=rows)

@app.route("/lesson/<int:lesson_id>")
def lesson(lesson_id):
    db = get_db()
    with db:
        changed = db.execute(
            "UPDATE lessons SET views = views + 1 WHERE id = ?", (lesson_id,)).rowcount
    if changed == 0:
        abort(404)
    row = db.execute("SELECT * FROM lessons WHERE id = ?", (lesson_id,)).fetchone()
    return render_template("lesson.html", lesson=row)
```
Spot the earlier lessons: `ORDER BY` for a stable order (5-2), placeholders for the id (5-2), `views = views + 1` as an atomic update (5-3), `rowcount` to detect a missing row and abort with 404 (5-3), and the `with db` block to commit (5-1). Templates can use the rows directly, because `sqlite3.Row` supports `row.title` style access in Jinja through item lookup: `{{ lesson["title"] }}` always works, and Jinja also resolves `{{ lesson.title }}` by trying item access.

Saving feedback with constraints doing the real work:
```python
@app.route("/feedback", methods=["GET", "POST"])
def feedback():
    errors = validate_feedback(request.form) if request.method == "POST" else {}
    if request.method == "POST" and not errors:
        db = get_db()
        with db:
            db.execute(
                "INSERT INTO feedback (name, email, rating, message) VALUES (?, ?, ?, ?)",
                (request.form["name"].strip(), request.form["email"].strip(),
                 int(request.form["rating"]), request.form["message"].strip()))
        flash("Thanks for your feedback!", "success")
        return redirect(url_for("home"))
    status = 400 if errors else 200
    return render_template("feedback.html", errors=errors, values=request.form), status
```
The validation function from Lesson 4-1 still runs first for friendly messages, while the `CHECK` constraint on `rating` is the last line of defence if a bug ever lets a bad value through.

## Part 6: Testing against a temporary database
Tests must not touch your real data, and each test should start from an empty database.
```python
# test_app.py
import tempfile
from pathlib import Path
from app import app
from db import init_db

def make_client():
    path = Path(tempfile.mkdtemp()) / "test.db"
    app.config.update(TESTING=True, DATABASE=path, SECRET_KEY="test")
    with app.app_context():
        init_db()
    return app.test_client()
```
- `app.config.update(DATABASE=path)` points the app at a fresh temporary file.
- `with app.app_context():` makes `g` and `current_app` available outside a request so `init_db` can run. When the block ends, Flask calls the teardown function and closes that connection.
- Each call to `make_client()` produces an independent, empty database.

A test can then post feedback, read it back, and check the database:
```python
client = make_client()
client.post("/feedback", data={"name": "Ada", "email": "a@b.co", "rating": "5",
                               "message": "Clear and detailed"})
with app.app_context():
    row = get_db().execute("SELECT COUNT(*) FROM feedback").fetchone()
    assert row[0] == 1
```

## Part 7: Project, Hub v2
Rebuild Hub's storage on SQLite. Requirements:
- **Structure:** `app.py`, `config.py`, `db.py`, `schema.sql`, `validation.py`, templates, static, tests. The JSON storage module is removed.
- **Config:** `DATABASE` in `Config`, secret key from the environment.
- **Commands:** `flask --app app init-db` creates the tables, and is safe to run twice. A seed step inserts the Week 1 to 5 lessons only if the table is empty.
- **Lessons:** the list and detail pages read from the table, the detail page counts views atomically, and unknown ids give 404.
- **Feedback:** the form from Hub v1 stores rows in the table, shows flash messages and redirects after success.
- **Admin:** `/feedback/all` lists rows newest first with pagination (`?page=`), `/admin/stats` shows the aggregates from Lesson 5-4, and a POST-only route deletes one entry (404 if it does not exist, 405 for GET).
- **Tests:** every route against a temporary database: success paths, validation failures, constraint protection, 404, 405, and a check that two clients do not share data.

Build in this order: `db.py` and schema with the `init-db` command, lessons pages, feedback form, list with pagination, stats, delete, tests. Commit after each step if you use Git.

## Part 8: When something breaks
- **`no such table`:** you have not run `init-db`, or the config points to a different file than you think. Print `app.config["DATABASE"]`.
- **`RuntimeError: Working outside of application context`:** you called `get_db()` outside a request. Wrap it in `with app.app_context():`.
- **`ProgrammingError ... same thread`:** you stored a connection in a global variable. Use `g`.
- **`database is locked`:** two writers collided, or a connection was left open in a transaction. Keep transactions short, always use `with db:`, and close connections in teardown. SQLite allows one writer at a time, which is fine for small sites and a reason to move to PostgreSQL for busy ones.
- **Changes missing after a request:** a missing `with db:` or `commit()`.

## Recap
- Use one SQLite connection per request, stored on `g`, opened lazily in `get_db()` and closed by a teardown function.
- Keep SQL in `schema.sql` using `CREATE TABLE IF NOT EXISTS`, and create the database with a custom `flask init-db` command. Destructive resets must be deliberate.
- Views ask for the connection, use placeholders, `ORDER BY`, `rowcount`, atomic updates and `with db:` as you learned this week.
- Constraints are the last line of defence behind your Python validation.
- Test against a fresh temporary database each time, using `app.config.update` and `app.app_context()`.

===NOTES===
## What you will be able to do after this lesson
You will be able to explain why data is split across several tables, describe one-to-many relationships, create a foreign key and say exactly what it guarantees, switch on foreign key enforcement in SQLite (it is off by default), choose between `RESTRICT`, `CASCADE` and `SET NULL` for what happens on delete and predict the outcome of each, spot repeated data that should be split out, and read the error `FOREIGN KEY constraint failed`.

Last week every table stood alone. Real applications are about things that belong to other things: feedback belongs to a lesson, a lesson belongs to a week, progress belongs to a user. This lesson is how a database represents "belongs to".

## Part 1: The problem with one big table
Suppose feedback is stored with everything about the lesson repeated:
```
feedback_flat
id | name | rating | lesson_title | lesson_week
 1 | Ada  |      5 | SQL basics   |           5
 2 | Bo   |      4 | SQL basics   |           5
 3 | Cy   |      3 | Forms        |           4
```
This design causes three kinds of trouble, known as **anomalies**:
- **Update anomaly.** Rename "SQL basics" and you must change every feedback row. Miss one and the database now disagrees with itself about what lesson 5 is called.
- **Insert anomaly.** You cannot record a new lesson until somebody leaves feedback on it, because the lesson only exists inside a feedback row.
- **Delete anomaly.** Delete the only feedback for "Forms" and you have also lost the fact that the lesson exists.

The cure is **normalisation**: store each fact **once**, in the table it belongs to, and refer to it from elsewhere. Informally, the guideline is "one table per kind of thing, and every column describes only that thing". Lessons get a table, feedback gets a table, and feedback **points to** its lesson.

## Part 2: Keys that connect tables
```
lessons                       feedback
id | title      | week        id | name | rating | lesson_id
 1 | Forms      |    4         1 | Ada  |      5 |         2
 2 | SQL basics |    5         2 | Bo   |      4 |         2
                              3 | Cy   |      3 |         1
```
The column `feedback.lesson_id` holds the **primary key of a row in `lessons`**. A column that refers to another table's primary key is a **foreign key**. The relationship here is **one-to-many**: one lesson has many feedback rows, and each feedback row belongs to exactly one lesson. This is by far the most common relationship in applications (one user has many posts, one order has many items, one author has many books).

Now renaming a lesson changes **one** row, a lesson can exist with no feedback, and deleting feedback never erases a lesson.

## Part 3: Declaring a foreign key
```sql
CREATE TABLE lessons (
    id    INTEGER PRIMARY KEY,
    title TEXT NOT NULL UNIQUE,
    week  INTEGER NOT NULL
);

CREATE TABLE feedback (
    id        INTEGER PRIMARY KEY,
    lesson_id INTEGER NOT NULL REFERENCES lessons (id),
    name      TEXT    NOT NULL,
    rating    INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5)
);
```
- `REFERENCES lessons (id)` declares the foreign key: every value in `feedback.lesson_id` must match an existing `lessons.id`.
- `NOT NULL` on top means feedback **must** belong to a lesson. Without it, `NULL` is allowed and means "no lesson". Choose deliberately: `NOT NULL` for "always belongs", nullable for "may belong".
- The equivalent table-level form is `FOREIGN KEY (lesson_id) REFERENCES lessons (id)` as a separate line. Use it when a key has several columns.

A foreign key guarantees **referential integrity**: you can never have a feedback row pointing at a lesson that does not exist (an **orphan** row).

## Part 4: SQLite does not enforce them unless you ask
This is the single most surprising fact of this lesson. In SQLite, foreign key checking is **off by default** (for historical reasons), and it must be switched on **for every connection**:
```python
conn = sqlite3.connect("hub.db")
conn.execute("PRAGMA foreign_keys = ON")
```
A `PRAGMA` is a SQLite-specific setting command. Compare the outcomes:
```python
conn.execute("INSERT INTO feedback (lesson_id, name, rating) VALUES (99, 'Ada', 5)")
```
- **Pragma off:** the insert succeeds, and you now have feedback for a lesson that does not exist. Later a JOIN loses this row without any error.
- **Pragma on:** `sqlite3.IntegrityError: FOREIGN KEY constraint failed`.

That is why the `get_db()` you wrote in Lesson 5-5 includes `PRAGMA foreign_keys = ON`. Two details: it has no effect inside an open transaction, so run it right after connecting, and it is per-connection, so a fresh connection forgets it. Always create connections through one helper function that sets it.

## Part 5: What happens when you delete a parent
You delete lesson 2, but feedback rows 1 and 2 point at it. The database must do something, and **you** choose what with `ON DELETE`:
```sql
lesson_id INTEGER NOT NULL REFERENCES lessons (id) ON DELETE CASCADE
```
- **`RESTRICT`** (and the default, `NO ACTION`): refuse the delete while children exist. Error: `FOREIGN KEY constraint failed`. Safest, you must remove or reassign the children first.
- **`CASCADE`**: delete the children automatically. Convenient, but dangerous: one delete can wipe thousands of rows.
- **`SET NULL`**: keep the children and set their foreign key to `NULL`. The column must allow `NULL`.
- **`SET DEFAULT`**: set it to the column's default value.

**Three routes to the same situation.** A lesson is removed from the course. What should happen to its feedback?
- Route A, `RESTRICT`. Outcome: you cannot delete a lesson that has feedback. Good when the children matter and deletion should be a deliberate act, but awkward if you want to clean up.
- Route B, `CASCADE`. Outcome: the lesson and all its feedback disappear in one statement. Right for data that is meaningless without its parent, such as the items of a deleted shopping cart.
- Route C, `SET NULL` (with a nullable `lesson_id`). Outcome: feedback survives as "general feedback". Right when the children have value of their own.

There is no universally correct choice. Ask: "if the parent disappears, is the child still meaningful?" If no, `CASCADE`. If yes, `SET NULL`. If you are unsure, `RESTRICT` is the cautious start.

## Part 6: Foreign keys in practice
**Insert order matters.** The parent must exist first:
```python
cur = conn.execute("INSERT INTO lessons (title, week) VALUES (?, ?)", ("SQL basics", 5))
lesson_id = cur.lastrowid
conn.execute("INSERT INTO feedback (lesson_id, name, rating) VALUES (?, ?, ?)",
             (lesson_id, "Ada", 5))
conn.commit()
```
`lastrowid` (Lesson 5-3) is how you carry the new parent id to the child.

**Catch the error and be specific:**
```python
try:
    with conn:
        conn.execute("INSERT INTO feedback (lesson_id, name, rating) VALUES (?, ?, ?)", (99, "Ada", 5))
except sqlite3.IntegrityError as e:
    print(e)        # FOREIGN KEY constraint failed
```
The message does not say which key failed, so make your Python code check the likely cause (does the lesson exist?) when you need a friendly message.

**Reading across tables** needs a `JOIN`, which is the whole of Lesson 6-2. For now you can follow a key by hand:
```python
lesson = conn.execute("SELECT * FROM lessons WHERE id = ?", (feedback_row["lesson_id"],)).fetchone()
```

## Part 7: Design guidelines
- **Name foreign keys `<thing>_id`** (`lesson_id`, `user_id`). It is a convention that makes joins readable.
- **Store a fact once.** If you copy a value into a second table "for convenience", you have created a future update anomaly. The exception is deliberate **denormalisation** for speed, which is an advanced decision made after measuring.
- **Use `NOT NULL` when the relationship is mandatory**, nullable when optional.
- **Choose the delete rule when you create the key**, not after the first accident.
- **Index your foreign keys** (Lesson 6-4). SQLite does not do it automatically, and joins and cascades get slow without it.

## Part 8: Common mistakes
- Forgetting `PRAGMA foreign_keys = ON`, so the constraint exists but never fires.
- Inserting a child before its parent.
- Using `CASCADE` everywhere "to avoid errors", then deleting far more than intended.
- Declaring `SET NULL` on a `NOT NULL` column, which fails at delete time.
- Storing a title or name in the child table instead of a key.

## Recap
- Splitting data into related tables avoids update, insert and delete anomalies. Each fact lives once.
- A foreign key column holds another table's primary key and guarantees referential integrity. One-to-many is the most common relationship.
- SQLite ignores foreign keys unless `PRAGMA foreign_keys = ON` is run on every connection.
- `ON DELETE` decides the parent-delete behaviour: `RESTRICT` refuses, `CASCADE` deletes children, `SET NULL` keeps them without a parent.
- Create parents first and carry the new id with `lastrowid`.

===TASKS===
### Orphans, with and without the pragma | guided
Using an in-memory database, create `lessons` and `feedback` as in Part 3. With foreign keys **off** (the default), insert feedback for lesson 99 and select it. Then run `PRAGMA foreign_keys = ON` on a new connection, create the tables again, and try the same insert. Write the exact error.
HINT: A new `sqlite3.connect(":memory:")` is a brand new database, so recreate the tables.
EXPECT: Off: the insert succeeds and an orphan row exists. On: `IntegrityError: FOREIGN KEY constraint failed`.
SOL:
```python
import sqlite3

SCHEMA = """
CREATE TABLE lessons (id INTEGER PRIMARY KEY, title TEXT NOT NULL UNIQUE, week INTEGER NOT NULL);
CREATE TABLE feedback (
    id INTEGER PRIMARY KEY,
    lesson_id INTEGER NOT NULL REFERENCES lessons (id),
    name TEXT NOT NULL, rating INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5));
"""
for enforce in (False, True):
    conn = sqlite3.connect(":memory:")
    if enforce:
        conn.execute("PRAGMA foreign_keys = ON")
    conn.executescript(SCHEMA)
    try:
        conn.execute("INSERT INTO feedback (lesson_id, name, rating) VALUES (99, 'Ada', 5)")
        print(enforce, "inserted:", conn.execute("SELECT * FROM feedback").fetchall())
    except sqlite3.IntegrityError as e:
        print(enforce, "refused:", e)
```
### Three delete rules | guided
Build three versions of the `feedback` table that differ only in `ON DELETE` (`RESTRICT`, `CASCADE`, `SET NULL`; the last needs a nullable `lesson_id`). In each, insert one lesson with two feedback rows, then delete the lesson. Print the feedback table or the error after each. Write one sentence on when you would pick each rule.
HINT: Turn the pragma on first, and use a fresh in-memory database for every version.
EXPECT: `RESTRICT` raises the foreign key error and keeps all rows, `CASCADE` leaves the feedback table empty, `SET NULL` keeps both rows with `lesson_id` equal to `None`.

===QUIZ===
Q: What is the main reason to split data into several related tables?
- Databases cannot store long rows
- Each fact is stored once, avoiding update, insert and delete anomalies *
- It makes the file smaller in every case
- SQL requires at least two tables
WHY: Repeated data drifts apart when only some copies are updated. Storing each fact once removes that risk.
Q: What is a foreign key?
- A key that opens the database file
- A column that holds the primary key of a row in another table *
- A second primary key in the same table
- An index on a text column
WHY: It points from a child row to its parent, such as `feedback.lesson_id` to `lessons.id`.
Q: What does referential integrity guarantee?
- Every table has a primary key
- No row can refer to a parent row that does not exist *
- All columns are NOT NULL
- Queries are fast
WHY: A foreign key constraint refuses orphan rows.
Q: In SQLite, what must you do to make foreign keys actually enforced?
TYPE: PRAGMA foreign_keys = ON | PRAGMA foreign_keys=ON
WHY: Enforcement is off by default and must be switched on for every connection.
Q: With the pragma on, what happens when you insert feedback for a lesson id that does not exist?
- It succeeds
- `IntegrityError: FOREIGN KEY constraint failed` *
- The lesson is created automatically
- `NULL` is stored
WHY: The database refuses the row, so no orphan can be created.
Q: Which `ON DELETE` rule refuses to delete a parent that still has children?
- CASCADE
- SET NULL
- RESTRICT *
- SET DEFAULT
WHY: `RESTRICT` (and the default `NO ACTION`) raise an error while children exist.
Q: Which rule deletes all child rows automatically when the parent is deleted?
TYPE: CASCADE | ON DELETE CASCADE
WHY: `CASCADE` follows the delete to the children. It is convenient and dangerous, so use it where the child is meaningless without the parent.
Q: For `ON DELETE SET NULL` to work, the foreign key column must be:

- Nullable *
- UNIQUE
- A primary key

- Feedback first, then the lesson

===NOTES===
## What you will be able to do after this lesson
You will be able to combine rows from two or more tables with `JOIN`, explain what an inner join and a left join each keep and drop, predict the number of rows a join produces, use table aliases and fix the "ambiguous column name" error, combine joins with `WHERE`, `GROUP BY` and aggregates, show zero counts for parents that have no children, and avoid the classic mistake of turning a left join into an inner join without noticing.

In Lesson 6-1 you split data across tables. A **join** is how a query puts it back together, and it is the most important idea in relational databases.

## Part 1: The practice data
```python
import sqlite3
conn = sqlite3.connect(":memory:")
conn.row_factory = sqlite3.Row
conn.execute("PRAGMA foreign_keys = ON")
conn.executescript("""
CREATE TABLE lessons  (id INTEGER PRIMARY KEY, title TEXT NOT NULL, week INTEGER NOT NULL);
CREATE TABLE feedback (id INTEGER PRIMARY KEY,
    lesson_id INTEGER NOT NULL REFERENCES lessons (id),
    name TEXT NOT NULL, rating INTEGER NOT NULL);
INSERT INTO lessons (id, title, week) VALUES
    (1, 'Setup', 1), (2, 'Forms', 4), (3, 'SQL basics', 5), (4, 'Joins', 6);
INSERT INTO feedback (lesson_id, name, rating) VALUES
    (2, 'Ada', 5), (2, 'Bo', 4), (3, 'Cy', 3), (3, 'Dee', 5), (3, 'Eli', 2);
""")
```
Lessons 2 and 3 have feedback. Lessons 1 and 4 have none, and that detail decides which join you need.

## Part 2: The problem a join solves
You want a list showing the lesson **title** next to each rating. The title is in `lessons`, the rating is in `feedback`, and they are linked by `feedback.lesson_id = lessons.id`.

**Route A, two queries and Python glue:** read all feedback, then for each row query its lesson. For 1000 feedback rows that is **1001 queries**, which is called the **N+1 problem** and is a classic cause of slow pages.

**Route B, one join:** ask the database to do the matching.
```sql
SELECT lessons.title, feedback.name, feedback.rating
FROM feedback
JOIN lessons ON lessons.id = feedback.lesson_id;
```
One query, one round trip, and the database uses its indexes to match rows efficiently.

## Part 3: INNER JOIN, step by step
`JOIN` on its own means `INNER JOIN`. Think of the database doing this:
1. Take each row of the first table (`feedback`).
2. Look for rows in the second table (`lessons`) where the `ON` condition is true.
3. For every match, output **one combined row** with the columns of both.
4. Rows with **no match are dropped**.

Result of the query above:
```
title       | name | rating
Forms       | Ada  | 5
Forms       | Bo   | 4
SQL basics  | Cy   | 3
SQL basics  | Dee  | 5
SQL basics  | Eli  | 2
```
Five feedback rows, five result rows. Notice that lessons **Setup** and **Joins** do not appear at all: they matched nothing, so an inner join discards them.

**How many rows does a join return?** For one-to-many, it is one row per child (each feedback row matches exactly one lesson). A parent with three children appears three times, once per child, with its columns repeated. That repetition is normal and is what makes `GROUP BY` after a join so useful.

## Part 4: Aliases and ambiguous names
Long table names get tiring. **Alias** them with a short name, and use the alias to say which table a column comes from:
```sql
SELECT l.title, f.name, f.rating
FROM feedback AS f
JOIN lessons  AS l ON l.id = f.lesson_id
ORDER BY l.week, f.rating DESC;
```
When both tables have a column of the same name (`id`, here), writing just `id` fails with `ambiguous column name: id`. Qualify it: `l.id` or `f.id`. A good habit is to qualify **every** column in a join, so the query stays correct when someone adds a column later.

If you need two columns with the same name in the result, rename them: `SELECT l.id AS lesson_id, f.id AS feedback_id ...`. Otherwise the second overwrites the first when you turn rows into dictionaries.

## Part 5: LEFT JOIN, keeping the unmatched
Suppose you want **every lesson**, with its feedback if it has any. An inner join loses Setup and Joins. A **left join** keeps every row of the **left** table (the one before `LEFT JOIN`) and fills the right side with `NULL` when there is no match:
```sql
SELECT l.title, f.name, f.rating
FROM lessons AS l
LEFT JOIN feedback AS f ON f.lesson_id = l.id
ORDER BY l.week;
```
```
title       | name | rating
Setup       | NULL | NULL
Forms       | Ada  | 5
Forms       | Bo   | 4
SQL basics  | Cy   | 3
SQL basics  | Dee  | 5
SQL basics  | Eli  | 2
Joins       | NULL | NULL
```
The rule to remember: **left join = "all the left rows, matched where possible"**. The table you want *everything* from goes on the left.

SQLite also supports `RIGHT JOIN` and `FULL JOIN` in recent versions (3.39 and later), but older installations lack them. Since a right join is only a left join with the tables swapped, write left joins and put the table you want complete on the left.

**Finding the unmatched.** A left join plus a test on the right side finds parents without children:
```sql
SELECT l.title
FROM lessons AS l
LEFT JOIN feedback AS f ON f.lesson_id = l.id
WHERE f.id IS NULL;           -- lessons nobody has reviewed yet
```
This is useful for "users who never ordered" or "lessons without feedback".

## Part 6: Joins with aggregates, and showing zeros
Remember the closing warning of Lesson 5-4: a group with no rows does not appear. Join solves it.
```sql
SELECT l.title,
       COUNT(f.id)              AS responses,
       ROUND(AVG(f.rating), 1)  AS average
FROM lessons AS l
LEFT JOIN feedback AS f ON f.lesson_id = l.id
GROUP BY l.id
ORDER BY l.week;
```
```
title       | responses | average
Setup       |         0 | NULL
Forms       |         2 | 4.5
SQL basics  |         3 | 3.3
Joins       |         0 | NULL
```
Study the details:
- `COUNT(f.id)` counts only non-NULL values of the right table's key, so lessons with no feedback give `0`. **`COUNT(*)` would give `1`** for them, because the unmatched row still exists (with NULLs). This is the most common aggregate-with-left-join bug.
- `AVG` ignores `NULL`, giving `NULL` when nothing was rated. Use `COALESCE(AVG(f.rating), 0)` or show "no ratings" in the template.
- We group by `l.id`, the primary key, and select `l.title`. Since the title is determined by the id, this is safe. (Group by `l.id, l.title` if you prefer to be explicit.)

## Part 7: The WHERE trap on a left join
You want every lesson, with only its **five-star** feedback.
- **Route A:**
```sql
SELECT l.title, f.name
FROM lessons AS l
LEFT JOIN feedback AS f ON f.lesson_id = l.id
WHERE f.rating = 5;
```
Outcome: Setup and Joins **disappear again**. `WHERE` runs after the join, and for the unmatched rows `f.rating` is `NULL`, so `NULL = 5` is not true and they are filtered out. You have silently turned your left join into an inner join.
- **Route B, put the condition in `ON`:**
```sql
LEFT JOIN feedback AS f ON f.lesson_id = l.id AND f.rating = 5
```
Outcome: the condition decides **which feedback matches**, and every lesson is still kept. Lessons without five-star feedback appear with `NULL`.

The rule: for a left join, conditions on the **right** table that should not remove left rows belong in `ON`. Conditions on the **left** table can stay in `WHERE`.

## Part 8: Joining more than two tables, and joining a table to itself
You can chain joins. With a `users` table and `feedback.user_id`:
```sql
SELECT u.name, l.title, f.rating
FROM feedback AS f
JOIN users   AS u ON u.id = f.user_id
JOIN lessons AS l ON l.id = f.lesson_id;
```
Each `JOIN ... ON` adds one more table and needs its own condition. If you forget the `ON`, or write `FROM a, b` with no condition, you get a **cross join**: every row of `a` paired with every row of `b`. With 1000 rows in each table that is **a million rows**, which is almost always a bug. If a join suddenly returns far too many rows, check that every table has an `ON` linking it.

A table can be joined to **itself** using two aliases, for hierarchies such as employees and their managers:
```sql
SELECT e.name AS employee, m.name AS manager
FROM employees AS e
LEFT JOIN employees AS m ON m.id = e.manager_id;
```

## Part 9: Joins in Flask
```python
@app.route("/lessons")
def lessons():
    rows = get_db().execute("""
        SELECT l.id, l.title, l.week,
               COUNT(f.id) AS responses,
               ROUND(AVG(f.rating), 1) AS average
        FROM lessons AS l
        LEFT JOIN feedback AS f ON f.lesson_id = l.id
        GROUP BY l.id
        ORDER BY l.week, l.id
    """).fetchall()
    return render_template("lessons.html", lessons=rows)
```
One query replaces what would have been `1 + N` queries, and the template just loops. In the template, show a missing average gracefully: `{{ l.average if l.average is not none else "no ratings yet" }}`.

## Recap
- A join matches rows across tables using an `ON` condition, replacing the slow "one query per row" pattern.
- `INNER JOIN` keeps only matches. `LEFT JOIN` keeps every left row and fills `NULL` where nothing matches.
- Alias tables and qualify columns to avoid `ambiguous column name`.
- With a left join, use `COUNT(right.id)`, not `COUNT(*)`, to count zero correctly.
- A `WHERE` condition on the right table of a left join removes the unmatched rows. Put such a condition in `ON`.
- A missing `ON` creates a cross join with a huge number of rows.

Q: What is the N+1 problem?
- A query that returns N+1 columns
- Running one query for the list plus one more for each row, instead of a single join *
- Joining N tables
- A primary key bug
WHY: A thousand rows become 1001 queries. One join does it in a single round trip.
Q: What does an INNER JOIN do with rows that have no match in the other table?
- Keeps them with NULLs
- Drops them *
- Raises an error
- Duplicates them
WHY: Only rows with a match on the `ON` condition appear in the result.
Q: Which join keeps every row of the left table even without a match?
TYPE: LEFT JOIN | left
WHY: Unmatched left rows are kept, with `NULL` in the columns of the right table.
Q: Lesson 1 has no feedback. In a left join from lessons to feedback with `GROUP BY l.id`, what does `COUNT(*)` give for lesson 1?
- 0
- 1 *
- NULL
- An error
WHY: The unmatched row still exists, with NULLs. `COUNT(*)` counts it, while `COUNT(f.id)` counts only real matches and gives 0.
Q: What does `COUNT(f.id)` give for a lesson with no feedback in a left join?
- 1
- NULL
- 0 *
- It depends
WHY: `f.id` is NULL for the unmatched row and `COUNT(column)` skips NULLs.
Q: What is wrong with `LEFT JOIN feedback f ON ... WHERE f.rating = 5` if you want every lesson?
- Nothing
- The WHERE removes the unmatched rows, turning the left join into an inner join *
- The syntax is invalid
- It returns duplicates
WHY: For unmatched rows `f.rating` is NULL, and `NULL = 5` is not true, so they are filtered out. Move the condition into `ON`.
Q: Which error means two joined tables both have a column with that name and you did not qualify it?
- no such table
- ambiguous column name *
- datatype mismatch
- foreign key failed

Q: What happens if you join two tables without any `ON` condition?
- An error
- A cross join pairing every row of one table with every row of the other *
- An inner join on ids
- Nothing is returned
WHY: Without a condition, every row matches every row, giving a huge number of rows.
Q: How do you list lessons that nobody has reviewed?
- INNER JOIN with WHERE f.id = 0
- LEFT JOIN with `WHERE f.id IS NULL` *
- ORDER BY f.id

WHY: Unmatched rows have NULL on the right side, which `IS NULL` finds.

===NOTES===
## What you will be able to do after this lesson
You will be able to recognise a many-to-many relationship, explain why it cannot be stored with a single foreign key, build a junction table with a composite primary key, query across it with two joins, add and remove links safely, store extra information on the relationship itself (such as when a user completed a lesson), combine rows into a list with `GROUP_CONCAT`, and use `EXISTS` and `IN` with subqueries to answer "which items have this tag" and "which items do not".

In Lesson 6-1 one lesson had many feedback rows, and each feedback row belonged to one lesson. Many real relationships go **both ways**: a lesson has many tags and a tag labels many lessons. A user completes many lessons and a lesson is completed by many users. Those are **many-to-many** relationships.

## Part 1: Why one foreign key is not enough
Try storing tags directly in the lessons table.
- **Attempt 1, a `tag` column:** `lessons.tag = 'sql'`. A lesson can only have one tag.
- **Attempt 2, a text column holding a list:** `lessons.tags = 'sql,beginner,flask'`. It looks workable, but you can no longer ask the database "which lessons have the tag `sql`?" properly. `WHERE tags LIKE '%sql%'` also matches `nosql`, you cannot enforce that tags exist, renaming a tag means editing text in many rows, and counting lessons per tag becomes string surgery. Storing several values in one column breaks the "one fact per cell" rule from Lesson 6-1.
- **Attempt 3, columns `tag1`, `tag2`, `tag3`:** a hard limit, many NULLs, and every query must look in all three columns.

All three fail for the same reason: a foreign key can point to only **one** row, and here each side needs to point to **many**.

## Part 2: The junction table
The solution is a third table whose only job is to record which rows are connected. It is called a **junction table** (also an association table, link table or bridge table).
```
lessons            tags              lesson_tags
id | title         id | name         lesson_id | tag_id
 1 | Forms          1 | sql                  1 |      2
 2 | SQL basics     2 | web                  2 |      1
 3 | Joins          3 | beginner             2 |      3
                                             3 |      1
```
Each row of `lesson_tags` is one link: "lesson 2 has tag 1 (sql)". A lesson with three tags has three link rows, a tag used by five lessons has five. The many-to-many relationship has become **two one-to-many relationships** that meet in the middle: `lessons → lesson_tags` and `tags → lesson_tags`.

```sql
CREATE TABLE lessons (id INTEGER PRIMARY KEY, title TEXT NOT NULL UNIQUE);
CREATE TABLE tags    (id INTEGER PRIMARY KEY, name  TEXT NOT NULL UNIQUE);

CREATE TABLE lesson_tags (
    lesson_id INTEGER NOT NULL REFERENCES lessons (id) ON DELETE CASCADE,
    tag_id    INTEGER NOT NULL REFERENCES tags    (id) ON DELETE CASCADE,
    PRIMARY KEY (lesson_id, tag_id)
);
```
Read the design:
- **Two foreign keys**, both `NOT NULL`: a link must connect two real things.
- **`PRIMARY KEY (lesson_id, tag_id)`** is a **composite primary key**: the *pair* is unique. This means the same tag cannot be attached to the same lesson twice, with no extra code. It also acts as an index for looking up by `lesson_id`.
- **`ON DELETE CASCADE`** on both sides: if a lesson or a tag is deleted, the links to it are meaningless and go away. The lessons and tags on the other side survive. This is the textbook case where `CASCADE` is right (Lesson 6-1).
- `UNIQUE` on `tags.name` keeps the vocabulary clean (`sql` exists once).

## Part 3: Adding and removing links
```python
db.execute("INSERT OR IGNORE INTO tags (name) VALUES (?)", ("sql",))
tag_id = db.execute("SELECT id FROM tags WHERE name = ?", ("sql",)).fetchone()["id"]
db.execute("INSERT OR IGNORE INTO lesson_tags (lesson_id, tag_id) VALUES (?, ?)", (lesson_id, tag_id))
```
- `INSERT OR IGNORE` silently skips a row that would violate a `UNIQUE` or primary key rule. It makes the operation **idempotent**: doing it twice has the same effect as once, which is exactly right for "make sure this tag is attached".
- Why not insert, catch `IntegrityError`, and carry on? That also works, but `OR IGNORE` is shorter and cannot be confused with other integrity problems. Be careful: it also swallows `NOT NULL` and `CHECK` failures, so use it only where ignoring a duplicate is the intent.
- Removing a link is an ordinary delete with both keys: `DELETE FROM lesson_tags WHERE lesson_id = ? AND tag_id = ?`. Deleting the link does not delete the lesson or the tag.

To **replace** all tags of a lesson (as a form with checkboxes would), do it in one transaction so the lesson is never seen half-updated:
```python
with db:
    db.execute("DELETE FROM lesson_tags WHERE lesson_id = ?", (lesson_id,))
    db.executemany("INSERT INTO lesson_tags (lesson_id, tag_id) VALUES (?, ?)",
                   [(lesson_id, t) for t in tag_ids])
```

## Part 4: Querying across the junction
To follow the relationship you join **through** the junction table, using two joins.
```sql
-- the tags of lesson 2
SELECT t.name
FROM lesson_tags AS lt
JOIN tags AS t ON t.id = lt.tag_id
WHERE lt.lesson_id = 2;

-- the lessons that have the tag 'sql'
SELECT l.title
FROM tags AS t
JOIN lesson_tags AS lt ON lt.tag_id = t.id
JOIN lessons     AS l  ON l.id = lt.lesson_id
WHERE t.name = 'sql';
```
The pattern is always: start from the thing you know, hop through the junction, arrive at the thing you want. For lessons with a tag you could also skip the first table by filtering `lt.tag_id` directly, if you already have the tag's id.

## Part 5: Collapsing the results into one row
A page showing "Forms: web, beginner" wants **one row per lesson**, not one per tag. `GROUP_CONCAT` joins the values of each group into one text:
```sql
SELECT l.id, l.title, GROUP_CONCAT(t.name, ', ') AS tags
FROM lessons AS l
LEFT JOIN lesson_tags AS lt ON lt.lesson_id = l.id
LEFT JOIN tags        AS t  ON t.id = lt.tag_id
GROUP BY l.id
ORDER BY l.id;
```
- `GROUP_CONCAT(value, separator)` builds the list. The default separator is a comma with no space, so pass the one you want.
- The **order** inside the list is not guaranteed. If it matters, sort in Python after splitting, or in recent SQLite versions use `GROUP_CONCAT(t.name, ', ' ORDER BY t.name)`.
- Both joins are `LEFT` so that lessons with no tags still appear (with `NULL` in `tags`), the lesson from Lesson 6-2.
- Treat the result as display text. If you need to filter or count by tag, query the junction table, never the combined string.

## Part 6: "Which lessons have no tag" and "which lack this tag"
- No tags at all: `LEFT JOIN ... WHERE lt.lesson_id IS NULL` (Lesson 6-2), or with a subquery:
```sql
SELECT title FROM lessons
WHERE id NOT IN (SELECT lesson_id FROM lesson_tags);
```
- Lessons that do **not** have the tag `sql`. This is where beginners go wrong. The join `WHERE t.name <> 'sql'` returns lessons that have *some other* tag, including lessons that also have `sql`. The right tool is `NOT EXISTS`:
```sql
SELECT l.title
FROM lessons AS l
WHERE NOT EXISTS (
    SELECT 1
    FROM lesson_tags AS lt
    JOIN tags AS t ON t.id = lt.tag_id
    WHERE lt.lesson_id = l.id AND t.name = 'sql'
);
```
`EXISTS (subquery)` is true if the subquery returns **at least one row**, and the inner query may refer to the outer row (`l.id`). The `SELECT 1` is a convention: only the existence matters, not the values.

**Two routes to "lessons that have both tags `sql` and `web`".**
- Route A, join and filter with `AND` on the same row: `WHERE t.name = 'sql' AND t.name = 'web'`. Outcome: **no rows ever**, since one row cannot have two names.
- Route B, group and count:
```sql
SELECT l.title
FROM lessons AS l
JOIN lesson_tags AS lt ON lt.lesson_id = l.id
JOIN tags AS t ON t.id = lt.tag_id
WHERE t.name IN ('sql', 'web')
GROUP BY l.id
HAVING COUNT(DISTINCT t.name) = 2;
```
Outcome: first keep only the two relevant link rows per lesson, then require that both appeared. Change `2` to the number of tags you asked for.

## Part 7: Data on the relationship itself
Sometimes the link carries its own information: *when* a user completed a lesson, *what score* they got. That data belongs to the **pair**, so it lives in the junction table as extra columns:
```sql
CREATE TABLE progress (
    user_id      INTEGER NOT NULL REFERENCES users   (id) ON DELETE CASCADE,
    lesson_id    INTEGER NOT NULL REFERENCES lessons (id) ON DELETE CASCADE,
    completed_at TEXT    NOT NULL DEFAULT (datetime('now')),
    score        INTEGER CHECK (score BETWEEN 0 AND 100),
    PRIMARY KEY (user_id, lesson_id)
);
```
This is still a many-to-many relationship, but the junction table is now a real entity with its own columns. Marking a lesson complete is then an idempotent upsert:
```sql
INSERT INTO progress (user_id, lesson_id, score) VALUES (?, ?, ?)
ON CONFLICT (user_id, lesson_id) DO UPDATE SET score = excluded.score, completed_at = datetime('now');
```
`ON CONFLICT ... DO UPDATE` is an **upsert** ("update or insert"): insert the row, but if the primary key already exists, update it instead. `excluded` is the row you tried to insert, so `excluded.score` is the new score. (Available in SQLite 3.24 and later, which every current Python includes.)

## Part 8: Common mistakes
- Putting a comma-separated list in one column.
- Forgetting the composite primary key, so the same link can be stored twice.
- Filtering "has tag A and tag B" with two conditions on the same joined row (always empty).
- Using `<>` to mean "does not have the tag" (use `NOT EXISTS`).
- Forgetting `ON DELETE CASCADE` on the junction table, so deleting a tag fails with a foreign key error.
- Treating the `GROUP_CONCAT` text as data to filter on.

## Recap
- A many-to-many relationship needs a **junction table** with two foreign keys, usually a composite primary key, and `CASCADE` on both.
- Query by joining through the junction, and collapse with `GROUP BY` and `GROUP_CONCAT` for display.
- `INSERT OR IGNORE` and upserts (`ON CONFLICT DO UPDATE`) make link operations safe to repeat.
- "Has both" needs `HAVING COUNT(DISTINCT ...)`, and "does not have" needs `NOT EXISTS`.
- Data about the relationship (a date, a score) is stored as extra columns on the junction table.

Q: Why can a many-to-many relationship not be stored with one foreign key column?
- Foreign keys cannot be text
- A foreign key points to only one row, but each side needs to point to many *
- SQLite forbids it
- It would be too slow
WHY: A single column can refer to one parent. Many-to-many needs a third table that records each pair.
Q: What is a junction table?
- A table with no primary key
- A table whose rows record which rows of two other tables are linked *
- A backup table
- A temporary table
WHY: Each row says "this A is connected to this B". The relationship becomes two one-to-many relationships.
Q: What does `PRIMARY KEY (lesson_id, tag_id)` achieve in `lesson_tags`?
- It makes lesson ids unique
- It makes the pair unique, so the same tag cannot be attached to the same lesson twice *
- It sorts the table
- It creates two tables
WHY: A composite primary key is unique as a combination, not column by column.
Q: Why is `ON DELETE CASCADE` the right choice for a junction table's foreign keys?
- It makes inserts faster
- A link is meaningless once either side is gone, so it should be deleted with it *
- It is required by SQL
- It deletes the lessons too
WHY: The cascade removes the link rows only. The row on the other side, such as the lesson, survives.
Q: Which clause makes "attach this tag" safe to run twice?
TYPE: INSERT OR IGNORE | OR IGNORE
WHY: It skips a row that would break a uniqueness rule, making the operation idempotent.
Q: What does `GROUP_CONCAT(t.name, ', ')` produce?
- The number of tags
- One text value that joins each group's tag names with the separator *
- A list object in Python
- The first tag only
WHY: It collapses the values of a group into a single string, useful for display.
Q: Why does `WHERE t.name = 'sql' AND t.name = 'web'` return nothing?
- The tags do not exist
- One joined row has one tag name, so it can never equal both *
- AND is not allowed in WHERE
- GROUP BY is missing
WHY: Each row of the join is a single lesson-tag pair. "Has both" needs grouping and counting.
Q: Which query pattern finds lessons that do **not** have the tag `sql`?
- A join with `WHERE t.name <> 'sql'`
- `WHERE NOT EXISTS (subquery for the tag)` *
- `ORDER BY name`
- `GROUP BY tag`
WHY: The `<>` join returns lessons that have any other tag, including lessons that also have `sql`.
Q: What is an upsert?
- Deleting then selecting
- Inserting a row, or updating it if its key already exists *
- A rollback
- A kind of join
WHY: `INSERT ... ON CONFLICT (...) DO UPDATE` does both in one atomic statement.

===NOTES===
## What you will be able to do after this lesson
You will be able to explain what an index is and why it makes some queries thousands of times faster, create single-column, composite and unique indexes, read `EXPLAIN QUERY PLAN` output to see whether a query scans a table or searches an index, explain the cost of indexes on writes and storage, recognise queries that cannot use an index, choose which columns deserve one, and run a timing experiment that proves the difference with your own numbers.

Everything you wrote so far was fast because the tables were tiny. This lesson is about what happens when a table has a million rows, and how to keep it fast.

## Part 1: The cost of looking
Imagine a phone book with a million names in **random order**, and you want "Okafor". The only way is to read from the first name until you find it. In the worst case you read a million entries. A database does exactly this by default and calls it a **full table scan**: it reads **every row** and tests your `WHERE` condition on each one. Double the rows and the query takes twice as long.

Now imagine the phone book is **sorted**. You open it in the middle, see "Lagos", know Okafor comes later, jump to the middle of the second half, and so on. A million entries take about **20 steps**, and a billion take about 30. A structure that lets the database do this is called an **index**.

## Part 2: What an index is
An **index** is a separate, sorted data structure (SQLite uses a **B-tree**, a balanced tree built for disk) that stores the values of one or more columns together with a pointer to the row they came from. It works like the index at the back of a book: instead of reading every page to find "foreign key", you look it up alphabetically and jump to the page numbers.

```sql
CREATE INDEX idx_feedback_rating ON feedback (rating);
```
- `idx_feedback_rating` is the index name. A common convention is `idx_<table>_<columns>`.
- `ON feedback (rating)` says which table and column to index.
- The database builds it once from existing rows, then **keeps it up to date automatically** on every insert, update and delete. Your queries do not mention it: the database **decides** whether to use it.

Some indexes already exist without you asking:
- The **primary key**. Looking up `WHERE id = 5` is already fast.
- Every **`UNIQUE` constraint** creates an index, because the database needs to find existing values to check uniqueness.
- **Foreign key columns are not indexed automatically** in SQLite. `feedback.lesson_id` has no index unless you create one, so a join from lessons to their feedback, or a `CASCADE` delete, scans the whole feedback table. This is the most common missing index in real projects.

## Part 3: Seeing what the database does
You do not have to guess. Put `EXPLAIN QUERY PLAN` in front of any query and SQLite describes how it will run it.
```python
for row in conn.execute("EXPLAIN QUERY PLAN SELECT * FROM feedback WHERE rating = 5"):
    print(row["detail"])
```
Before the index:
```
SCAN feedback
```
After `CREATE INDEX idx_feedback_rating ON feedback (rating)`:
```
SEARCH feedback USING INDEX idx_feedback_rating (rating=?)
```
(Older SQLite versions print `SCAN TABLE feedback` and `SEARCH TABLE feedback USING INDEX ...`. The words that matter are **SCAN** and **SEARCH**.)

- **`SCAN`** means it reads every row. Fine for a small table, a warning sign for a large one.
- **`SEARCH ... USING INDEX`** means it jumps straight to matching rows.
- **`USING INTEGER PRIMARY KEY`** is a lookup by `id`, the fastest kind.
- **`USING COVERING INDEX`** means the index alone contained every column the query needed, so the table itself was never touched.
- **`USE TEMP B-TREE FOR ORDER BY`** means SQLite had to sort the results itself. An index on the sort column can avoid it.

Make `EXPLAIN QUERY PLAN` a habit whenever a query touches a table that will grow.

## Part 4: Measuring it yourself
Never trust a claim about speed that you have not measured. Build a table with 200 000 rows and time the same query with and without an index.
```python
import sqlite3, random, time

conn = sqlite3.connect(":memory:")
conn.execute("CREATE TABLE feedback (id INTEGER PRIMARY KEY, lesson_id INTEGER, rating INTEGER, message TEXT)")
rows = [(random.randint(1, 5000), random.randint(1, 5), "text") for _ in range(200_000)]
with conn:
    conn.executemany("INSERT INTO feedback (lesson_id, rating, message) VALUES (?, ?, ?)", rows)

def timed(sql, params=()):
    start = time.perf_counter()
    for _ in range(50):
        conn.execute(sql, params).fetchall()
    return (time.perf_counter() - start) / 50

query = "SELECT COUNT(*) FROM feedback WHERE lesson_id = ?"
print("before:", timed(query, (1234,)))
conn.execute("CREATE INDEX idx_feedback_lesson ON feedback (lesson_id)")
print("after: ", timed(query, (1234,)))
```
On a typical laptop the second number is hundreds or thousands of times smaller. Notes on the experiment: the inserts are inside **one transaction** (`with conn:`), which is dramatically faster than committing each row, and we average 50 runs because a single measurement is noisy. `time.perf_counter()` is the right clock for measuring short durations.

## Part 5: What indexes cost
If indexes make reads fast, why not index everything? Because they are not free.
- **Writes get slower.** Every `INSERT`, `UPDATE` of an indexed column and `DELETE` must also update every index on the table. Ten indexes mean eleven structures to maintain per insert.
- **They use disk space and memory.**
- **They help only some queries.** An index on a column nobody filters by is pure cost.

So the rule is: **index the columns your queries actually use to find, join or sort rows, and measure.** For a table that is mostly read (lessons, tags), indexes are cheap insurance. For a table with a constant flood of writes (event logs), be selective.

**Two routes to a fast "feedback for this lesson" page.**
- Route A, leave the table alone. Outcome: fine with 500 rows, painfully slow with 5 million, and the slowness grows silently as the site succeeds.
- Route B, `CREATE INDEX idx_feedback_lesson ON feedback (lesson_id)`. Outcome: the query stays fast at any size, at a small extra cost on every insert.
For a column that appears in `WHERE`, `JOIN ... ON` or `ORDER BY` on a table that will grow, Route B is the standard answer.

## Part 6: Composite indexes
An index can cover several columns, sorted by the first, then the second within equal first values (like a phone book sorted by surname, then first name):
```sql
CREATE INDEX idx_feedback_lesson_created ON feedback (lesson_id, created);
```
This serves queries such as `WHERE lesson_id = ? ORDER BY created DESC` very well: it jumps to the lesson and reads the rows already in date order, with no separate sort.

The key rule is the **leftmost prefix**: a composite index on `(a, b)` can help queries filtering on `a`, or on `a` and `b`, but **not** a query filtering only on `b`. A phone book sorted by surname is useless for finding everyone called "Ada". So put the column you filter by with `=` first, and the sort or range column after it. A separate index on `lesson_id` alone becomes redundant, because the composite one already serves it.

## Part 7: Queries that cannot use an index
An index stores the raw column values, so the database can only use it when your condition looks at the column **as it is**. These common patterns defeat it:
- **A function on the column:** `WHERE lower(email) = ?` or `WHERE substr(created, 1, 7) = '2026-10'`. The index holds `email`, not `lower(email)`. Rewrite as a range (`WHERE created >= '2026-10-01' AND created < '2026-11-01'`) or create an index on the expression (`CREATE INDEX idx_users_lower_email ON users (lower(email))`).
- **A leading wildcard:** `LIKE '%fast%'` cannot use an index because it could match anywhere. `LIKE 'fast%'` (a prefix) can in some configurations, though SQLite's case-insensitive `LIKE` often prevents it. For real text search SQLite offers a feature called FTS5, beyond this lesson.
- **Type mismatch:** comparing an integer column with a text value can force a scan.
- **Arithmetic on the column:** `WHERE rating + 1 = 5`. Write `WHERE rating = 4`.
- **`OR` across different columns,** which often falls back to a scan.
- **Low-selectivity columns:** an index on a column with only a few distinct values, such as a yes/no flag, rarely helps, because the database would read most of the table anyway.

In every case the verdict comes from `EXPLAIN QUERY PLAN`, not from guessing.

## Part 8: Unique indexes and partial indexes
- `CREATE UNIQUE INDEX idx_users_email ON users (email)` enforces uniqueness exactly like a `UNIQUE` constraint, and can be added to an existing table (it fails if duplicates already exist).
- A **partial index** covers only the rows that match a condition, keeping it small:
```sql
CREATE INDEX idx_lessons_open ON lessons (week) WHERE done = 0;
```
It is used only by queries whose `WHERE` implies the same condition.

To remove one: `DROP INDEX idx_feedback_rating;`. Dropping an index never loses data, only speed.

## Part 9: Where this goes in a Flask project
Indexes are part of the **schema**, so they live in `schema.sql`, written with `IF NOT EXISTS` like the tables:
```sql
CREATE INDEX IF NOT EXISTS idx_feedback_lesson_created ON feedback (lesson_id, created);
CREATE INDEX IF NOT EXISTS idx_progress_lesson ON progress (lesson_id);
```
A sensible default checklist for a new table: index every foreign key that you join or cascade on (unless it is already the first column of a composite primary key, like `user_id` in `progress (user_id, lesson_id)`), plus columns you filter or sort by in your common queries. Then verify with `EXPLAIN QUERY PLAN`.

## Recap
- A full table scan reads every row, so cost grows with table size. An index is a sorted B-tree that lets the database jump to matching rows.
- Primary keys and `UNIQUE` columns are indexed automatically. Foreign keys in SQLite are not, so index them yourself.
- `EXPLAIN QUERY PLAN` shows `SCAN` (reads everything) or `SEARCH ... USING INDEX` (jumps). Measure before and after with `time.perf_counter()`.
- Indexes slow writes and cost space, so index the columns you actually filter, join and sort by.
- A composite index follows the leftmost-prefix rule. Functions, leading wildcards and arithmetic on a column defeat an index.

conn.executescript("""
CREATE TABLE users (id INTEGER PRIMARY KEY, email TEXT NOT NULL);
CREATE INDEX idx_users_email ON users (email);
CREATE TABLE feedback (id INTEGER PRIMARY KEY, created TEXT NOT NULL);

""")
def show(sql):
    print(sql, "->", [r[3] for r in conn.execute("EXPLAIN QUERY PLAN " + sql)])

show("SELECT * FROM users WHERE lower(email) = 'ada@example.com'")          # SCAN
show("SELECT * FROM feedback WHERE substr(created, 1, 7) = '2026-10'")      # SCAN
show("SELECT * FROM feedback WHERE created >= '2026-10-01' AND created < '2026-11-01'")
show("SELECT * FROM users WHERE email = 'ada@example.com'")                  # store lowercase
conn.execute("CREATE INDEX idx_users_lower_email ON users (lower(email))")
