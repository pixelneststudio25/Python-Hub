===QUIZ===
Q: What principle does template inheritance apply to web pages?
- Premature optimisation
- DRY: each piece of shared markup lives in one place *
- Encapsulation of private data
- Lazy loading
WHY: Without inheritance the navigation and footer would be copied into every page, and every change would need editing everywhere.
Q: What does a `{% block content %}{% endblock %}` in a base template define?
- A Python function
- A named hole that child templates may fill *
- A CSS class
- A database table
WHY: The block is the contract between parent and child. Children replace the blocks they care about and inherit the rest.
Q: Which tag must come first in a child template?
TYPE: {% extends "base.html" %} | extends
WHY: Jinja has to know the parent layout before it can place any block, so `extends` must be the first tag in the file.
Q: A child template contains `<h1>About</h1>` outside any block. What appears on the page?
- The heading, above the base layout
- An error message
- Nothing, the content outside blocks is ignored without any error *
- The heading at the bottom
WHY: Only blocks are merged into the parent. Everything else in a child template is dropped silently, which is why this bug is hard to spot.
Q: The base has `{% block content %}` but the child writes `{% block contnt %}`. What happens?
- Flask raises a `NameError`
- The base's default content shows and the child's text never appears, with no error *
- The child's text appears anyway
- The server stops
WHY: Block names are matched by exact text. A typo creates a new block that the base never uses.
Q: What does `{{ super() }}` do inside a child block?
- Calls the parent view function
- Prints the parent's version of that block so you can add to it *
- Deletes the block
- Imports the base template
WHY: It lets a child extend a block rather than replace it, such as `{{ super() }}: About` for a page title.
Q: Where must a file `style.css` live so that `url_for('static', filename='style.css')` finds it?
- In `templates/`
- In a folder named `static` next to the app file *
- In the virtual environment
- In the project root only
WHY: Flask serves a folder called `static` at `/static/...`. The `url_for('static', ...)` call builds that URL.
Q: After you edit `style.css`, the page looks unchanged. What should you try first?
- Reinstall Flask
- Hard refresh the browser (Ctrl+F5), because the old file may be cached *
- Rename the app file
- Turn off debug mode
WHY: Browsers cache static files. A hard refresh fetches the new copy, and the Network tab shows whether it was loaded.
Q: Which is the best use of `{% include "_card.html" %}` rather than `extends`?
- Sharing the full page skeleton
- Reusing a small fragment that only some pages need *
- Importing Python modules
- Setting the status code
WHY: `extends` gives every page the same layout. `include` drops one fragment into a spot, so it suits reusable pieces.
Q: Which expression, used in a template, tells you the name of the view handling the current request?
TYPE: request.endpoint
WHY: Comparing `request.endpoint` with a name lets the navigation add an `active` class to the link for the current page.

===NOTES===
## What you will be able to do after this lesson
You will be able to write an HTML form and explain what each attribute does, say exactly what the browser sends for GET and POST forms, read submitted values in Flask with `request.form`, handle missing fields and checkboxes correctly, explain why server-side validation is mandatory, re-display a form with errors and the user's earlier input, and apply the redirect-after-POST pattern so a page refresh never submits twice.

Until now your users could only *read* your site. Forms are how they send something back, so this lesson is where a site becomes an application.

## Part 1: What a form is
An HTML **form** is a group of fields plus a button that, when pressed, makes the browser build and send an HTTP request containing the field values. Two attributes of the `<form>` tag decide what request is built:
- `method` is `get` or `post`. It chooses the HTTP method from Lesson 3-1.
- `action` is the URL to send it to. If you leave it out, the form sends to the page it is on.

```html
<form method="post" action="{{ url_for('subscribe') }}">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>
  <button type="submit">Subscribe</button>
</form>
```
Read each piece:
- `<label for="email">` is linked to the field whose `id` is `email`. Clicking the label focuses the field, and screen readers announce it. The `for` value must match an `id`.
- `name="email"` is the most important attribute. **The `name` is the key under which the value reaches your Python code.** A field without a `name` is not sent at all, which is a very common bug.
- `type="email"` makes the browser show the right keyboard and do a basic format check. Other types: `text`, `password`, `number`, `checkbox`, `radio`, `date`, `file`.
- `required` asks the browser to block an empty submit.
- A `<button type="submit">` sends the form.

## Part 2: What actually travels, GET versus POST
With `method="get"`, the browser puts the fields in the URL: `/search?email=ada%40example.com`. Everything is visible in the address bar, appears in history and can be bookmarked. Use GET for searches and filters, where repeating the request is harmless.

With `method="post"`, the browser puts the fields in the **body** of the request:
```
POST /subscribe HTTP/1.1
Content-Type: application/x-www-form-urlencoded

email=ada%40example.com
```
The data is not in the URL, so it is not bookmarked or shown in history, and the request is allowed to change something on the server. Use POST whenever the submission creates, changes or deletes data, or carries anything private such as a password. Note that POST is **not encrypted** by itself. Protection in transit comes from HTTPS (Week 11).

The odd-looking `%40` is **URL encoding**: characters with special meaning are written as `%` and a hex code, here `@` is `%40`. Flask decodes it for you.

## Part 3: Reading the data in Flask
```python
from flask import Flask, render_template, request

app = Flask(__name__)

@app.route("/subscribe", methods=["GET", "POST"])
def subscribe():
    if request.method == "POST":
        email = request.form.get("email", "").strip()
        return f"Subscribed {email}", 201
    return render_template("subscribe.html")
```
- `methods=["GET", "POST"]` is required (Lesson 3-3), otherwise submitting gives 405.
- `request.form` is a dictionary-like object holding every submitted field **as a string**, even for `type="number"`.
- `.get("email", "")` returns `""` if the field is missing. `request.form["email"]` raises an error instead, which Flask turns into **400 Bad Request**. Prefer `.get` plus your own validation, so you control the message.
- `.strip()` removes spaces at both ends, because users paste text with stray spaces.
- One function handles both methods. GET shows the empty form, POST processes it. This is the standard shape of a Flask form view.

**Fields that need special care:**
- A **checkbox** is only sent when ticked, with the value `on` unless you set `value=`. So `agree = "agree" in request.form` is `True` or `False`.
- Several checkboxes sharing one `name` arrive as a list: `request.form.getlist("topics")`.
- **Radio buttons** and `<select>` send the chosen `value`. `<textarea name="message">` sends its text.
- A **number** arrives as a string. Convert it yourself and handle the error:
```python
try:
    age = int(request.form.get("age", ""))
except ValueError:
    age = None
```

## Part 4: Never trust the browser
Attributes such as `required`, `maxlength` and `type="email"` are conveniences for honest users. They are not security, because anyone can skip the page and send the request directly:
```powershell
curl.exe -X POST -d "email=not-an-email" http://127.0.0.1:5000/subscribe
```
No form was involved, so no browser check ran. Therefore **every rule must be checked again in Python**. Treat all form input as untrusted.

**Two routes to the same goal.** You want to be sure that an email is present and plausible.
- Route A: rely on `required` in the HTML. Outcome: honest users are guided, but a script or a determined user stores garbage.
- Route B: also validate in the view. Outcome: the data is clean whatever the source.
The right answer is both. HTML checks make the experience pleasant, Python checks make it correct.

## Part 5: Validation and showing errors
A clean pattern is to put the rules in one function that returns a dictionary of errors:
```python
def validate(form):
    errors = {}
    email = form.get("email", "").strip()
    if not email:
        errors["email"] = "Email is required."
    elif "@" not in email or "." not in email.split("@")[-1]:
        errors["email"] = "Enter a valid email address."
    return errors
```
Then the view decides what to do:
```python
if request.method == "POST":
    errors = validate(request.form)
    if errors:
        return render_template("subscribe.html", errors=errors, values=request.form), 400
    ...  # save, then redirect (Part 6)
```
- On failure the **same page is shown again** with the error messages and the user's earlier input, so nobody retypes everything.
- Status **400** says the request was invalid. Many sites use 200 here, but 400 (or 422) is more honest and easier to test.
- In the template, refill with `value="{{ values.email }}"` and print `{{ errors.email }}` when it exists. Autoescaping (Lesson 3-4) makes it safe to echo the input back.

Keep in mind that this email check is deliberately simple. Real address validation is hard, and the only true test is sending a message.

## Part 6: Redirect after POST
If a POST view returns a page directly and the user presses **refresh**, the browser asks "Confirm form resubmission" and, if confirmed, sends the POST again. That creates duplicate subscriptions, orders or comments.

The fix is the **Post/Redirect/Get (PRG)** pattern:
1. The browser POSTs the form.
2. If it is valid, the server does the work and answers with a **redirect**.
3. The browser makes a GET to the new page and shows it.
```python
return redirect(url_for("thanks"))
```
A refresh now repeats only the harmless GET. Use `303 See Other` (`redirect(url, 303)`) when you want to be explicit that the next request must be a GET; the default 302 also works in practice.

## Part 7: Testing forms without a browser
```python
client = app.test_client()
resp = client.post("/subscribe", data={"email": "ada@example.com"})
assert resp.status_code == 302                       # PRG redirect
resp = client.post("/subscribe", data={"email": ""})
assert resp.status_code == 400
assert "required" in resp.get_data(as_text=True)
resp = client.post("/subscribe", data={"email": "ada@example.com"}, follow_redirects=True)
assert resp.status_code == 200                       # the final page
```
`data=` builds a form body, and `follow_redirects=True` makes the client behave like a browser and follow the redirect.

## Part 8: What forms still lack
Two problems are left for later weeks. **CSRF** (cross-site request forgery) means another website can make your logged-in visitor's browser send a POST to your site, so real forms carry a secret token that attackers cannot guess; you will add it in Week 11. And **storage**: for now the data is lost when the request ends, which Lessons 4-2 and 4-5 start to fix.

## Recap
- A form builds a request from its fields. `method` picks GET or POST, and each field's `name` becomes its key.
- GET puts fields in the URL (searches), POST puts them in the body (changes and private data). Neither is encrypted without HTTPS.
- `request.form.get(...)` reads strings, checkboxes appear only when ticked, and numbers must be converted.
- HTML checks are conveniences. Always validate again in Python, because requests can be forged with a tool like curl.
- Re-render with errors and the old values on failure (status 400), and redirect after success so refresh is safe.

Q: Which attribute decides the key under which a form field's value reaches `request.form`?
- `id`
- `name` *
- `class`
- `for`
WHY: The browser sends `name=value` pairs. A field with no `name` is not sent at all.
Q: A search box should be bookmarkable and harmless to repeat. Which method fits?
- GET *
- POST
- PUT
- DELETE
WHY: GET puts the fields in the URL, which can be saved and repeated safely. Use POST when the request changes data or carries private values.
Q: Where does the browser put the fields of a `method="post"` form?
- In the URL query string
- In the body of the request *
- In a cookie
- In the `Host` header
WHY: POST data travels in the body, so it is not in the URL or history. It is still readable on the network unless HTTPS is used.
Q: What happens if the form posts to a route defined without `methods=["POST"]`?
- It works anyway
- 405 Method Not Allowed *
- 404 Not Found
- The page reloads silently
WHY: The path matches, but the route only allows GET, so Flask rejects the method.
Q: A checkbox called `agree` is left unticked. Which expression gives the right boolean in the view?
TYPE: "agree" in request.form
WHY: Unticked checkboxes are not sent at all, so the question is whether the key is present.
Q: What does `request.form["email"]` do if the field is missing?
- Returns `None`
- Returns an empty string
- Raises an error that Flask turns into 400 Bad Request *
- Creates the field
WHY: Square brackets demand the key. `.get` returns a default instead, which lets you write your own validation message.
Q: Why must you validate input in Python when the HTML already has `required`?
- Python is faster
- Browsers ignore HTML
- Anyone can send a request without using your form, so HTML checks can be skipped *
- `required` is deprecated
WHY: Tools like curl send requests directly. HTML rules are a convenience, and server-side checks are the real protection.
Q: A form has a number input for age. What type does `request.form.get("age")` return?
- `int`
- `float`
- `str`, which you must convert yourself *
- `bool`

Q: What problem does Post/Redirect/Get solve?
- Slow pages
- Duplicate submissions when the user refreshes after a POST *
- Missing cookies
- Large uploads
WHY: After the redirect the browser's last request is a GET, so refreshing repeats a harmless request.

===NOTES===
## What you will be able to do after this lesson
You will be able to build an upload form and explain why it needs `enctype="multipart/form-data"`, read an uploaded file in Flask, explain path traversal and how `secure_filename` defends against it, restrict file types and sizes, store files safely with unique names, serve them back, and test uploads without a browser.

File upload is one of the most dangerous features on the web when done carelessly, and one of the most common to build. This lesson teaches the safe way first.

## Part 1: How a file travels
A normal form body is a short line of `name=value` pairs. A file can be megabytes of arbitrary bytes, so a different encoding is needed. For uploads you set `enctype="multipart/form-data"`, which splits the body into **parts**, one per field, each with its own headers.
```html
<form method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
  <input type="file" name="document">
  <button type="submit">Upload</button>
</form>
```
- `enctype` is short for "encoding type". The default is `application/x-www-form-urlencoded`.
- **The classic mistake** is forgetting `enctype`. Then the browser sends only the file's *name* as text, and Flask reports that no file arrived.
- The method must be `post`, because a GET has no body.

## Part 2: Reading the file in Flask
Uploaded files do not appear in `request.form`. They are in `request.files`.
```python
from flask import Flask, request

app = Flask(__name__)

@app.route("/upload", methods=["GET", "POST"])
def upload():
    if request.method == "POST":
        file = request.files.get("document")
        if file is None or file.filename == "":
            return "Choose a file first", 400
        return f"Received {file.filename} ({file.mimetype})"
    return render_template("upload.html")
```
- `request.files` maps each field name to a `FileStorage` object, a wrapper around the uploaded bytes.
- `file.filename` is the name **chosen by the client**, and `file.mimetype` is the type the **client claims**. Neither is verified by anyone.
- If the user submits without choosing a file, the field still exists but `filename` is the empty string. That is why the check tests both `None` and `""`.
- `file.save(path)` writes the bytes to disk. `file.read()` returns them.

## Part 3: Why the client's filename is dangerous
Imagine this code:
```python
file.save("uploads/" + file.filename)   # DO NOT DO THIS
```
An attacker, using a tool and not your form, can send the filename `../app.py`. The path becomes `uploads/../app.py`, which is `app.py`, so your source code is **overwritten**. Using `..` to climb out of the intended folder is called **path traversal**, and it has caused serious breaches on real sites.

The fix is `secure_filename` from Werkzeug, the library underneath Flask:
```python
from werkzeug.utils import secure_filename

secure_filename("../../etc/passwd")      # 'etc_passwd'
secure_filename("my holiday photo.PNG")  # 'my_holiday_photo.PNG'
secure_filename("../")                   # ''
```
It removes path separators and unsafe characters and turns spaces into underscores. Notice the last line: it can return an **empty string**, so you must check the result before using it.

## Part 4: Limiting what you accept
**Allowlist the extension.** Decide which types you accept and refuse everything else. Use an allowlist (what is permitted), not a blocklist (what is forbidden), because you cannot predict every dangerous type.
```python
ALLOWED = {"png", "jpg", "jpeg", "txt", "pdf"}

def allowed(filename):
    return "." in filename and filename.rsplit(".", 1)[1].lower() in ALLOWED
```
`rsplit(".", 1)` splits at the **last** dot, so `archive.tar.gz` gives the extension `gz`, and `.lower()` makes `PNG` and `png` equal.

Be honest about the limit of this check: it trusts the name. A user can rename `virus.exe` to `cute.png`. Real defences add content checks (for images, trying to open the file with an image library) and serve uploads in a way the browser will not execute.

**Limit the size.** Without a limit, one user can fill your disk.
```python
app.config["MAX_CONTENT_LENGTH"] = 2 * 1024 * 1024   # 2 MB
```
`app.config` is Flask's settings dictionary. When a request is larger, Flask stops and answers **413 Request Entity Too Large**. Give it a friendly page:
```python
@app.errorhandler(413)
def too_large(error):
    return "File too large (maximum 2 MB)", 413
```

## Part 5: Two routes to storing a file
**Route A, keep the original name (after cleaning):** `file.save(folder / secure_filename(file.filename))`. Outcome: safe from traversal, but two users uploading `notes.txt` **overwrite each other**, and the name may leak personal information.

**Route B, generate your own name:**
```python
import uuid
from pathlib import Path

UPLOAD_DIR = Path(app.root_path) / "uploads"
UPLOAD_DIR.mkdir(exist_ok=True)

safe = secure_filename(file.filename)
stored = f"{uuid.uuid4().hex}_{safe}"
file.save(UPLOAD_DIR / stored)
```
Outcome: no collisions, and a hard-to-guess name. You keep the original name for display (in a database later) and use the generated one on disk.

Notes on the pieces: `app.root_path` is the folder of your app, so the path works from anywhere you run the server (the working-directory lesson from 2-5). `Path / name` joins paths with `pathlib`. `mkdir(exist_ok=True)` creates the folder only if it is missing. `uuid.uuid4().hex` is a random 32-character identifier.

**Where to store them:** not inside `static/`. Anything in `static` is served to everyone with no checks, so an uploaded `.html` file there would run on *your* domain. Keep uploads in their own folder and serve them deliberately.

## Part 6: Serving files back
```python
from flask import send_from_directory

@app.route("/files/<path:name>")
def files(name):
    return send_from_directory(UPLOAD_DIR, name)
```
`send_from_directory` joins the directory and the name and **refuses names that escape the directory** (it returns 404). That makes it safe for user-supplied names, unlike building the path yourself and calling `open`. The `path` converter (Lesson 3-3) allows subfolders in the name.

## Part 7: Testing uploads
```python
import io

client = app.test_client()
data = {"document": (io.BytesIO(b"hello"), "notes.txt")}
resp = client.post("/upload", data=data, content_type="multipart/form-data")
assert resp.status_code == 200
```
`io.BytesIO(b"hello")` is an in-memory fake file, so the test needs no file on disk. A tuple of `(file, filename)` is how the test client represents an upload.

## Part 8: Checklist before shipping an upload feature
- Form has `method="post"` and `enctype="multipart/form-data"`.
- The file exists and `filename` is not empty.
- The name passes `secure_filename` and the result is not empty.
- The extension is in your allowlist.
- `MAX_CONTENT_LENGTH` is set.
- Stored under a generated name, outside `static/`, and served with `send_from_directory`.

## Recap
- Files need `enctype="multipart/form-data"` and arrive in `request.files`, never in `request.form`.
- The filename and mimetype come from the client, so never trust them.
- `secure_filename` defeats path traversal and may return an empty string.
- Allowlist extensions, cap the size with `MAX_CONTENT_LENGTH`, and answer 413 gracefully.
- Store under a unique generated name outside `static/`, and serve with `send_from_directory`.

===QUIZ===
Q: Which form attribute is required so that a file's bytes are actually uploaded?
TYPE: enctype="multipart/form-data" | multipart/form-data | enctype
WHY: Without it the browser sends only the file's name as text. Multipart encoding splits the body into parts, one for each field including the file.
Q: Where do you read an uploaded file in Flask?
- `request.form`
- `request.args`
- `request.files` *
- `request.json`
WHY: Files and ordinary fields are kept apart. `request.files` holds `FileStorage` objects.
Q: A user submits the upload form without choosing a file. What is `file.filename`?
- `None`
- An empty string *
- `"file"`
- A 400 error is raised
WHY: The field exists but is empty, so you must check for `""` as well as `None`.
Q: What is path traversal?
- Slow disk access
- Using names like `../app.py` to make a program read or overwrite files outside the intended folder *
- Uploading a very large file
- Renaming a file twice
WHY: Joining a client-supplied name to a folder lets `..` climb out of that folder. It is prevented by cleaning names and using safe helpers.
Q: What does `secure_filename("../../etc/passwd")` return?
- `../../etc/passwd`
- `etc_passwd` *
- `passwd`
- It raises an error
WHY: Separators and unsafe characters are removed or replaced, so the name can no longer escape the folder.

===NOTES===
## What you will be able to do after this lesson
You will be able to explain what a CSS framework is and what trade-offs it brings, add Bootstrap to a Flask project in two different ways and compare the outcomes, use its grid, form and alert classes, make a page responsive and explain why the viewport tag is needed, organise your own CSS and images in `static/`, and fix the usual "my styles are not applied" problems.

You met `static/` in Lesson 3-5. This lesson makes Hub look like a real product without writing hundreds of lines of CSS.

## Part 1: What a CSS framework is
Writing good-looking, mobile-friendly CSS from nothing takes a lot of skill and time. A **CSS framework** is a ready-made stylesheet (and sometimes JavaScript) that gives you named classes for common needs: a button, a navigation bar, a card, a layout grid. You describe *what* an element is by adding classes to your HTML, and the framework supplies the appearance.

**Bootstrap** is the most widely used one. It gives you:
- A **grid** for layout that adapts to screen size.
- **Components** such as buttons, forms, alerts, cards and navbars.
- **Utility classes** for spacing, colour and alignment (`mt-3`, `text-center`).

The cost is that many sites built with it look alike, and you must learn its class names. For learning projects and internal tools, the speed is worth it. When you need a distinctive brand, you write your own CSS on top.

## Part 2: Adding Bootstrap, two routes
**Route A, the CDN.** A **CDN** (content delivery network) is a fast public server that hosts popular libraries. You link to it from `base.html`:
```html
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
...
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"><\/script>
```
Outcome: nothing to download and often cached by the visitor's browser already. But your site **depends on someone else's server**: without internet (or if the CDN is blocked) the styling disappears, and every page load contacts a third party. The version number in the URL pins the version, so an update cannot change your site unexpectedly. Always pin.

**Route B, download and serve it yourself.** Download the compiled CSS and JS files from the Bootstrap website, place them in `static/vendor/bootstrap/`, and link them with `url_for`:
```html
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
```
Outcome: works offline, no third-party requests, the exact version is frozen in your repository. The cost is that you manage updates and the files are in your project.

For this course Route A is fine to start with. For a production site you may prefer Route B. The code in your templates is identical either way, only the `href` changes.

Where the links go: the stylesheet in `<head>`, the script just before `</body>` so the page content loads first. Your own `style.css` link goes **after** Bootstrap's, because when two rules conflict the one that comes later wins.

## Part 3: The viewport tag and responsive design
**Responsive design** means one page that adapts to any screen width. Phones have a trick: by default they pretend to be about 980 pixels wide and shrink the page to fit, which makes everything tiny. This tag turns that off:
```html
<meta name="viewport" content="width=device-width, initial-scale=1">
```
It means "make the page as wide as the device, at normal zoom". **Without it, Bootstrap's responsive features do not work on phones.** Put it in the `<head>` of `base.html`.

## Part 4: The grid
Bootstrap layouts use three nested ideas: a **container** (centres and limits the width), **rows**, and **columns** that divide each row into **12 units**.
```html
<div class="container">
  <div class="row">
    <div class="col-12 col-md-8">Main content</div>
    <div class="col-12 col-md-4">Sidebar</div>
  </div>
</div>
```
- `col-12` means "12 of 12 units", so full width. This applies on every screen size.
- `col-md-8` means "8 units wide, from the `md` breakpoint (768 pixels) upward". The sidebar gets the remaining 4.
- The result: on a phone the two blocks stack, one above the other. On a tablet or laptop they sit side by side. No media queries needed from you.

The breakpoints are `sm` (576px), `md` (768px), `lg` (992px), `xl` (1200px) and `xxl` (1400px). A class without a breakpoint applies to all sizes.

## Part 5: Components you will use constantly
**Buttons:** `<button class="btn btn-primary">Save</button>`. Variants: `btn-secondary`, `btn-success`, `btn-danger`, `btn-outline-primary`.

**Navbar:** a responsive bar that collapses into a menu on phones.
```html
<nav class="navbar navbar-expand-md bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">Hub</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('lessons') }}">Lessons</a></li>
      </ul>
    </div>
  </div>
</nav>
```
`navbar-expand-md` means "show the full bar from `md` upward, collapse below". The toggler's `data-bs-*` attributes are how Bootstrap's JavaScript is told which element to show and hide, which is why the script tag is needed.

**Forms:** wrap each field in a `mb-3` block, label with `form-label`, and style the field with `form-control`.
```html
<div class="mb-3">
  <label for="email" class="form-label">Email</label>
  <input type="email" id="email" name="email"
         class="form-control {{ 'is-invalid' if errors.email }}"
         value="{{ values.email }}">
  {% if errors.email %}<div class="invalid-feedback">{{ errors.email }}</div>{% endif %}
</div>
```
`is-invalid` turns the border red and reveals the sibling `invalid-feedback` text. This connects Lesson 4-1's validation errors to a polished display. The inline `if` without an `else` prints nothing when false, which is valid Jinja.

**Alerts:** `<div class="alert alert-success">Saved</div>`, with variants `alert-danger`, `alert-warning`, `alert-info`. Lesson 4-4 uses these for flash messages.

**Spacing utilities:** `mt-3` (margin top), `mb-4` (margin bottom), `p-2` (padding), `py-5` (vertical padding), the numbers 0 to 5 being a scale. `text-center` and `d-flex` also appear everywhere.

## Part 6: Your own static assets
Bootstrap handles the common cases, but your own touches go in `static/`:
```
static/
  css/style.css
  img/logo.png
  js/app.js
```
```html
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<img src="{{ url_for('static', filename='img/logo.png') }}" alt="Hub logo" height="32">
```
Always write an `alt` attribute: it is what screen readers say and what shows if the image fails. Keep your CSS small by overriding only what you must; if you fight the framework constantly, you are probably using the wrong class.

## Part 7: When styles do not apply
Work through these in order:
- **Open the Network tab.** A 404 on the CSS or JS file means the path, folder name or filename is wrong. A CDN file that is blocked shows a failure there too.
- **Hard refresh with Ctrl+F5.** The browser cache may hold an old copy. To force fresh files during development you can add a version query: `style.css?v=2`.
- **Check the order of the links.** Your CSS must come after Bootstrap's to override it.
- **Check the class spelling.** A typo such as `btn-primay` fails silently, just like a mistyped Jinja variable.
- **Check the browser's element inspector.** Right-click, Inspect, and look at which rules are applied and which are crossed out.

## Recap
- A CSS framework gives you named classes for layout and components. Bootstrap is the common choice.
- Add it from a pinned CDN link (simple, third-party dependency) or serve it from `static/` (offline, self-contained). Templates only differ in the `href`.
- The viewport tag is required for responsive behaviour on phones.
- The grid has 12 units per row, and `col-md-8` means "from tablets up". `container`, `row` and `col-*` nest in that order.
- Use `btn`, `form-control`, `is-invalid`, `alert` and the spacing utilities, and put your own CSS after the framework's.

===NOTES===
## What you will be able to do after this lesson
You will be able to explain what a cookie is and how it travels, use Flask's `session` and say precisely how it is protected (and what it does not protect), configure a secret key without leaking it, show one-time flash messages after a redirect, set and read your own cookies, choose between a plain cookie, the signed session and server-side storage, and test sessions without a browser.

In Lesson 3-1 you learned that HTTP is **stateless**: the server forgets you after each response. Cookies are the workaround, and sessions are the safe, convenient version of that workaround.

## Part 1: Cookies, the mechanism
A **cookie** is a small piece of text that the server asks the browser to store and that the browser then sends back automatically on every later request to the same site.

1. The server's response contains a header: `Set-Cookie: theme=dark; Max-Age=2592000; Path=/`
2. The browser stores it.
3. Every following request to that site includes `Cookie: theme=dark`.

The attributes after the value control the cookie:
- `Max-Age` (or `Expires`) says how long to keep it. Without them it is a **session cookie** that disappears when the browser closes.
- `Path=/` says it applies to the whole site.
- `HttpOnly` hides it from JavaScript, which protects it from being stolen by an injected script.
- `Secure` sends it only over HTTPS.
- `SameSite=Lax` limits when it is sent on requests that come from other sites, which helps against CSRF (Lesson 4-1, Week 11).

**The key fact:** the cookie lives on the user's machine. They can read it, edit it, delete it, or send a forged one. Anything the server relies on must be protected, which is what the next part is about.

## Part 2: Flask's session
A **session** is data remembered about one visitor across requests. Flask's `session` object looks like a dictionary:
```python
from flask import Flask, session

app = Flask(__name__)
app.secret_key = "change-me-in-real-life"

@app.route("/visit")
def visit():
    session["visits"] = session.get("visits", 0) + 1
    return f"You have visited {session['visits']} times"
```
Behind the scenes, Flask converts the dictionary to text, **signs** it with the secret key, and stores the result in a cookie called `session`.

**Signed is not the same as encrypted.** A signature is a tamper-proof stamp computed from the content and the secret key. If a user edits the cookie, the signature no longer matches and Flask treats the session as empty. But anyone can still **read** the contents, because they are only encoded. So:
- Never store passwords, tokens or personal secrets in `session`.
- Do store small, non-secret facts: a user id, a theme, a shopping-cart list of ids.
- A cookie is limited to about 4 KB, so keep it small.

## Part 3: The secret key
`app.secret_key` is the key used to sign. Whoever knows it can forge any session, so it must be:
- **Long and random.** Generate one: `python -c "import secrets; print(secrets.token_hex(32))"`.
- **Kept out of your code and out of Git.** Read it from an environment variable:
```python
import os
app.secret_key = os.environ.get("SECRET_KEY", "dev-only-key")
```
The fallback is for local development only. In production you set a real value.
- **Stable.** If it changes, every existing session becomes invalid and everyone is logged out.

If you use `session` without any key, Flask raises `RuntimeError: The session is unavailable because no secret key was set.` That is the error message you will see in your first attempt.

## Part 4: Working with session data
```python
session["theme"] = "dark"        # set
theme = session.get("theme")     # read, None if missing
session.pop("theme", None)       # remove one key
session.clear()                  # remove everything (logging out)
```
Two details that surprise beginners:
- **Changes to nested data are not noticed.** `session["cart"].append(3)` modifies a list inside the session, and Flask does not detect it. Reassign instead (`session["cart"] = session["cart"] + [3]`) or set `session.modified = True`.
- **Lifetime.** By default the session ends when the browser closes. To make it last, set `session.permanent = True` and optionally `app.permanent_session_lifetime = timedelta(days=7)` (import `timedelta` from `datetime`).

## Part 5: Flash messages
A **flash message** is a short note shown once on the next page, such as "Saved!". It builds on the session and pairs perfectly with Post/Redirect/Get (Lesson 4-1): after a successful POST you cannot show a message on the redirect target directly, so you leave it in the session.
```python
from flask import flash, redirect, url_for

@app.route("/join", methods=["POST"])
def join():
    # ... validation passed ...
    flash("Welcome aboard!", "success")
    return redirect(url_for("home"))
```
`flash(message, category)` stores the message. The category is free text you choose; Bootstrap-friendly names are `success`, `danger`, `warning` and `info`. Show them in `base.html` so every page can display them:
```html
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}
```
`get_flashed_messages` returns the stored messages **and removes them**, so a refresh does not show them twice. `with_categories=true` yields `(category, message)` pairs. `{% with %}` just gives the result a local name. Flash requires a secret key because it uses the session.

## Part 6: Setting your own cookie
For harmless preferences you can use a plain cookie directly:
```python
from flask import make_response, request

@app.route("/theme/<name>")
def set_theme(name):
    resp = make_response(redirect(url_for("home")))
    resp.set_cookie("theme", name, max_age=60 * 60 * 24 * 30,
                    httponly=True, samesite="Lax")
    return resp

theme = request.cookies.get("theme", "light")
```
`make_response` turns a return value into a response object you can modify. A plain cookie is **unsigned**, so you must validate it on every read: a user could set `theme` to anything. Compare with a whitelist (`if theme not in {"light", "dark"}: theme = "light"`).

## Part 7: Three places to keep state, and when to use which
You want to remember something about a visitor.
- **Plain cookie.** Simple and visible. Outcome: fine for a preference like a theme, but the user can change it freely, so never trust it for anything important.
- **Flask session (signed cookie).** Tamper-evident and easy. Outcome: good for a user id or small flags. The user can still read it and it travels with every request, so keep it small and non-secret.
- **Server-side storage** (a database, with only an id in the cookie). Outcome: the data never leaves your server and can be large or secret. More work, and what real login systems use from Week 8.

A good rule: put in the cookie only what you would be comfortable showing the user, and put everything else on the server.

## Part 8: Seeing and testing sessions
In the browser, open developer tools, then **Application** (Chrome and Edge) or **Storage** (Firefox), then **Cookies**. You will see `session` with a long random-looking value, and flags such as HttpOnly. Delete it and the visitor is "new" again.

In tests, the test client keeps a cookie jar, so sessions persist across calls:
```python
client = app.test_client()
client.get("/visit")
resp = client.get("/visit")
assert b"2 times" in resp.data

with client.session_transaction() as sess:
    sess["visits"] = 10          # set up state without visiting
```
`session_transaction()` lets a test read and write the session directly.

## Recap
- A cookie is text the server asks the browser to store and return. The user controls it.
- Flask's `session` is a dictionary stored in a **signed** cookie: tamper-evident but readable, so no secrets, and about 4 KB at most.
- The secret key must be random, private, stable, and read from the environment.
- `flash(message, category)` plus `get_flashed_messages` shows a one-time note after a redirect.
- Plain cookies suit preferences (validate them), sessions suit small flags, and server-side storage suits sensitive or large data.

Q: Why do websites need cookies?
- To make pages load faster
- HTTP is stateless, so the browser must send something that lets the server recognise it again *
- To encrypt traffic
- To store the HTML
WHY: Each request is independent. A cookie returned with every request is how the server links them.
Q: Who can read and edit a cookie stored in the browser?
- Only the server
- Nobody
- The user, so the server must never trust it blindly *
- Only the browser vendor
WHY: Cookies live on the user's machine. Anything security-relevant has to be signed or kept on the server.
Q: What does Flask do to the `session` cookie?
- Encrypts it so nobody can read it
- Signs it so tampering is detected, but the contents are still readable *
- Stores it on the server only
- Nothing
WHY: A signature proves the content was not changed. It does not hide the content.
Q: Which of these must you never store in Flask's `session`?
- A theme name
- A user id
- A password or secret token *
- A small list of lesson ids
WHY: The session is readable by the user, so secrets there are exposed.
Q: What error appears if you use `session` with no secret key?
- `ImportError`
- `RuntimeError` saying the session is unavailable because no secret key was set *
- `KeyError`
- Nothing, it works
WHY: Without a key Flask cannot sign the cookie, so it refuses to create a session.
Q: What is the best way to supply the secret key in a real deployment?
- Hard-code it in `app.py` and commit it
- Put it in the URL
- Generate a long random value and read it from an environment variable *
- Use the word `secret`
WHY: A leaked key lets anyone forge sessions. Keeping it out of the code and Git keeps it private.
Q: You run `session["cart"].append(5)` but the cart does not change on the next request. Why?
- Lists are not allowed in sessions
- Flask does not notice changes inside nested objects, so you must reassign or set `session.modified = True` *
- Cookies cannot hold numbers
- `append` is deprecated
WHY: Flask saves the session only when it sees a top-level assignment. Mutating a list in place goes unnoticed.
Q: What happens to a flash message after it has been displayed?
- It stays forever
- It is removed, so a refresh does not show it again *
- It is emailed
- It moves to the database
WHY: `get_flashed_messages` consumes the messages, which makes them one-time notes.
Q: Which cookie attribute stops JavaScript from reading the cookie?
TYPE: HttpOnly
WHY: `HttpOnly` hides the cookie from scripts, which limits the damage of an injected script.
Q: Which function turns a return value into a response object so you can call `set_cookie` on it?
TYPE: make_response
WHY: `resp = make_response(redirect(...))` gives you something you can modify before returning it.

===NOTES===
## What you will be able to do after this lesson
You will be able to explain why code is split into modules and what each module should be responsible for, move settings into a configuration object and read secrets from the environment, protect secrets and generated files with `.gitignore`, store form data in a JSON file safely, and combine forms, validation, flash messages, sessions and Bootstrap into **Hub v1**, the second version of your project.

This is where "code that works" becomes "code you can keep growing". The same ideas return in Week 8 with blueprints and the application factory.

## Part 1: The problem with one big file
Hub v0 fits comfortably in one `app.py`. By now you have routes, validation, upload handling, sessions and storage, and a single file mixing all of them has real costs:
- **Finding things** takes longer every week.
- **Changing one thing breaks another**, because everything can touch everything.
- **Testing is awkward**, because validation logic is buried inside views that need a request.

The remedy is the idea you met in Week 1 with functions and again with classes: give each piece **one clear responsibility**. For a small Flask app the useful split is:
- **Routes (`app.py`)** receive requests, call other code, and return responses. They should be short.
- **Validation (`validation.py`)** takes input and returns errors. It knows nothing about Flask, so it is easy to test.
- **Storage (`storage.py`)** reads and writes data. Whether the data lives in a list, a JSON file or a database is hidden behind a few functions, so you can swap it later without touching the routes. In Week 5 it becomes SQL.
- **Templates and static files** handle presentation.
- **Configuration (`config.py`)** holds the settings.

## Part 2: Configuration
Settings such as the secret key, upload limits or debug mode should be in one place, not scattered as literals.
```python
# config.py
import os
from pathlib import Path

BASE_DIR = Path(__file__).resolve().parent

class Config:
    SECRET_KEY = os.environ.get("SECRET_KEY", "dev-only-key")
    MAX_CONTENT_LENGTH = 1 * 1024 * 1024
    DATA_FILE = BASE_DIR / "data" / "feedback.json"
```
```python
# app.py
app = Flask(__name__)
app.config.from_object("config.Config")
```
- `Path(__file__).resolve().parent` is the folder containing the file. Building paths from it, not from the current directory, avoids the "file not found" problem from Lesson 2-5.
- `app.config.from_object("config.Config")` copies every **UPPERCASE** attribute of the class into `app.config`. Lowercase names are ignored, which is why settings are written in capitals.
- `os.environ.get("SECRET_KEY", "dev-only-key")` reads an **environment variable**, a setting that lives outside your code. In PowerShell you set one for the current window with `$env:SECRET_KEY = "a-long-random-value"`.

**Why environment variables?** Code goes into Git and gets shared. A secret in code is a secret published. The fallback value `dev-only-key` is deliberately obvious, so you will never mistake it for a real key in production.

## Part 3: What must not be committed
Git remembers everything you commit, forever, even if you delete it later. A `.gitignore` file lists patterns Git must not track.
```
.venv/
__pycache__/
*.pyc
.env
uploads/
data/*.json
instance/
```
- `.venv/` can be rebuilt from `requirements.txt` (Lesson 1-1).
- `.env` and anything containing keys or passwords must never be public.
- `uploads/` and data files are generated and may contain other people's information.
- If you already committed a secret, deleting it is not enough. You must **change the secret**, because it is in the history.

## Part 4: Storing form data in a JSON file
Until a database arrives, a JSON file is a sensible store, and it reuses Lesson 2-5.
```python
# storage.py
import json
from pathlib import Path

def load(path: Path) -> list:
    if not path.exists():
        return []
    try:
        return json.loads(path.read_text(encoding="utf-8"))
    except json.JSONDecodeError:
        return []

def save(path: Path, entries: list) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    tmp = path.with_suffix(".tmp")
    tmp.write_text(json.dumps(entries, indent=2), encoding="utf-8")
    tmp.replace(path)
```
Study the choices:
- A missing file means "no entries yet", not an error, so `load` returns `[]`.
- A corrupted file also returns `[]`. That is forgiving, but it hides data loss, so in a real system you would log it.
- `mkdir(parents=True, exist_ok=True)` creates the folder if needed.
- `save` writes to a **temporary file and then replaces** the real one. If the program crashes halfway through writing, the original is untouched. Writing directly with mode `"w"` first erases the file, as you learned in Lesson 2-5.

**A limit to be honest about.** Two requests writing at the same moment can overwrite each other's changes, because each loads the old list and saves its own version. For a single-user learning project that is acceptable. It is one of the main reasons databases exist, and it is where Week 5 begins.

## Part 5: Putting the pieces together
```python
# validation.py
def validate_feedback(form):
    errors = {}
    if not 2 <= len(form.get("name", "").strip()) <= 40:
        errors["name"] = "Name must be 2 to 40 characters."
    email = form.get("email", "").strip()
    if "@" not in email or "." not in email.split("@")[-1]:
        errors["email"] = "Enter a valid email address."
    rating = form.get("rating", "")
    if not rating.isdigit() or not 1 <= int(rating) <= 5:
        errors["rating"] = "Choose a rating from 1 to 5."
    if not 10 <= len(form.get("message", "").strip()) <= 500:
        errors["message"] = "Message must be 10 to 500 characters."
    return errors
```
```python
# app.py (the feedback view)
@app.route("/feedback", methods=["GET", "POST"])
def feedback():
    if request.method == "POST":
        errors = validate_feedback(request.form)
        if errors:
            flash("Please fix the highlighted fields.", "danger")
            return render_template("feedback.html", errors=errors, values=request.form), 400
        entries = storage.load(app.config["DATA_FILE"])
        entries.append({
            "name": request.form["name"].strip(),
            "email": request.form["email"].strip(),
            "rating": int(request.form["rating"]),
            "message": request.form["message"].strip(),
        })
        storage.save(app.config["DATA_FILE"], entries)
        flash("Thanks for your feedback!", "success")
        return redirect(url_for("home"))
    return render_template("feedback.html", errors={}, values={})
```
Read it from top to bottom and notice that the view is almost a plain-English description: validate, on failure show errors, on success store, flash and redirect. All the detail lives in modules with names that say what they do. That readability is the point of the structure.

## Part 6: Testing with a temporary data file
Tests must never touch your real data. Point the config at a temporary folder:
```python
# test_app.py
import tempfile
from pathlib import Path
from app import app

def make_client():
    tmp = Path(tempfile.mkdtemp()) / "feedback.json"
    app.config.update(TESTING=True, DATA_FILE=tmp)
    return app.test_client(), tmp
```
`app.config.update(...)` overrides a setting for the test. `tempfile.mkdtemp()` creates a fresh empty directory. After a successful submit, the test can read the file and check what was saved. This is the first time you design code *so that it can be tested*, which is a large part of what separates beginners from professionals.

## Part 7: Project, Hub v1
Extend Hub v0 into Hub v1. Requirements:
- **Structure:** `app.py`, `config.py`, `validation.py`, `storage.py`, templates, static, tests, `.gitignore`.
- **Config:** the secret key from the environment, an upload/size limit, and the data file path in `Config`.
- **Feedback form:** name, email, rating (radio buttons 1 to 5) and message, validated by `validation.py`, with Bootstrap styling, error messages under each field and the earlier input preserved.
- **Flow:** success stores to JSON, flashes a message and redirects (PRG). Failure flashes a warning, re-renders and returns 400.
- **Session:** remember the visitor's name from their last submission and prefill the name field next time.
- **Admin view:** `/feedback/all` lists the entries, newest first, with the average rating (and a clear message when there are none).
- **Quality:** a test file covering each validation rule, the success path, the redirect, the session prefill and the empty admin list, using a temporary data file.

Build in this order: config and structure, validation with tests, storage with tests, the form and view, flash messages, the session prefill, the admin page. Run the tests after every step.

## Recap
- Give each module one responsibility: routes coordinate, validation checks, storage persists, templates present.
- Put settings in a `Config` class, load them with `app.config.from_object`, and read secrets from environment variables.
- Use `.gitignore` for the virtual environment, secrets, uploads and generated data. A committed secret must be replaced, not just deleted.
- Write JSON atomically with a temporary file, and remember that concurrent writes are the weakness databases fix.
- Design so tests can swap the data file, and keep views short enough to read like a description.

## What you will be able to do after this lesson
You will be able to explain what a database is and why a JSON file stops being enough, describe tables, rows, columns, types and primary keys, create a SQLite database from Python, create a table, insert rows and read them back, explain what `commit` does and what happens without it, and recognise the first errors beginners meet.

Your Hub v1 stores feedback in a JSON file. It works, but you saw its weakness in Lesson 4-5: two requests at the same time can erase each other's data, and finding "all five-star ratings" means loading everything into Python. A database solves both.

## Part 1: What a database is
A **database** is an organised collection of data managed by a program that stores it safely, lets many users read and write at once, and answers questions about it quickly. That program is a **database management system (DBMS)**. A **relational** database keeps data in **tables**, and the language you use to talk to it is **SQL** (Structured Query Language, often said "sequel").

Compare the two approaches for "give me all feedback with rating 5":
- **JSON file:** load the whole file, loop in Python, keep matches. Works for 100 entries, slow and memory-hungry for a million, and nothing prevents two writers colliding.
- **Database:** write `SELECT * FROM feedback WHERE rating = 5`. The database finds the rows itself, can use indexes to jump straight to them, and guarantees safe concurrent writes.

There are many database systems (PostgreSQL, MySQL, SQL Server, SQLite). SQL is largely the same across them, with small differences. This course starts with **SQLite** because it needs no server and no installation: the whole database is a single file, and Python includes a module for it called `sqlite3`. Everything you learn about SQL carries over to PostgreSQL later.

## Part 2: Tables, rows and columns
A table is like a spreadsheet with strict rules.
```
feedback
id | name  | email           | rating | message
---+-------+-----------------+--------+-----------------------
 1 | Ada   | ada@example.com |      5 | Clear and detailed
 2 | Bo    | bo@example.com  |      4 | Loved the projects
```
- A **column** has a name and a **type**. Every value in the column must fit it.
- A **row** (also called a record) is one entry, here one piece of feedback.
- The **primary key** is a column (here `id`) whose value is **unique for every row** and identifies it. You use it to say exactly which row you mean, such as "update feedback number 2". It is never reused for another row's identity and should not change.

SQLite's main types are:
- `INTEGER` for whole numbers.
- `REAL` for decimals.
- `TEXT` for strings.
- `BLOB` for raw bytes.
SQLite is **flexible** about types (it calls this type affinity): it will try to convert what you give it rather than refusing. Other databases are stricter, so write the correct types anyway. SQLite has **no boolean or date type**: store true and false as the integers `1` and `0`, and dates as text in the standard form `2026-10-13` or `2026-10-13 14:30:00`, which also sorts correctly.

## Part 3: Creating a database and a table
```python
import sqlite3

conn = sqlite3.connect("hub.db")
conn.execute("""
    CREATE TABLE IF NOT EXISTS feedback (
        id      INTEGER PRIMARY KEY,
        name    TEXT NOT NULL,
        email   TEXT NOT NULL,
        rating  INTEGER NOT NULL,
        message TEXT NOT NULL
    )
""")
conn.commit()
conn.close()
```
Take it line by line:
- `sqlite3.connect("hub.db")` opens the database file, **creating it if it does not exist**. It returns a **connection**, your open line to the database. The path is relative to the working directory, the same trap as in Lesson 2-5, so a typo creates a new empty database in the wrong place.
- `conn.execute(sql)` sends one SQL statement.
- `CREATE TABLE IF NOT EXISTS feedback (...)` defines the table. `IF NOT EXISTS` makes it safe to run twice, otherwise the second run raises `OperationalError: table feedback already exists`.
- `id INTEGER PRIMARY KEY` marks the key. In SQLite an `INTEGER PRIMARY KEY` is filled in **automatically** with the next number when you insert a row without giving one.
- `NOT NULL` is a **constraint**: the column may not be empty. `NULL` in SQL means "no value or unknown", which is different from `0` or an empty string. Lesson 5-3 covers constraints in depth.
- The triple-quoted string lets the SQL span several lines.
- `conn.close()` ends the connection.

SQL keywords are not case-sensitive, but writing them in capitals (`SELECT`, `FROM`) is the convention, and it makes your queries easier to read.

## Part 4: Inserting and reading rows
```python
conn = sqlite3.connect("hub.db")
conn.execute(
    "INSERT INTO feedback (name, email, rating, message) VALUES (?, ?, ?, ?)",
    ("Ada", "ada@example.com", 5, "Clear and detailed"),
)
conn.commit()

rows = conn.execute("SELECT id, name, rating FROM feedback").fetchall()
print(rows)    # [(1, 'Ada', 5)]
conn.close()
```
- `INSERT INTO table (columns) VALUES (values)` adds a row. We did not list `id`, so SQLite assigned it.
- The **`?` placeholders** are the safe way to put Python values into SQL. The values go in the second argument as a tuple, in order. **Never build SQL by gluing strings together** with an f-string. Lesson 5-2 shows exactly why: it lets an attacker rewrite your query.
- `conn.commit()` makes the change permanent. By default Python starts a **transaction** (a group of changes treated as one unit) when you change data, and nothing is saved until you commit. If you forget, the program ends, the change is thrown away, and the table looks empty on the next run. This is the number one beginner surprise.
- `SELECT columns FROM table` reads data. `execute` returns a **cursor**, an object that walks through the results. `.fetchall()` returns all rows as a list of tuples, `.fetchone()` returns the next single row (or `None` if there are none).

## Part 5: Nicer rows and a safer pattern
Tuples make you remember column positions. Ask for dictionary-style rows instead:
```python
conn = sqlite3.connect("hub.db")
conn.row_factory = sqlite3.Row
for row in conn.execute("SELECT * FROM feedback"):
    print(row["name"], row["rating"])
```
`row_factory = sqlite3.Row` makes each row accessible by column name, which is clearer and survives column reordering. (`SELECT *` means "all columns", fine for exploring but fragile in real code, because adding a column changes what you get.)

The connection can also be used as a context manager:
```python
with sqlite3.connect("hub.db") as conn:
    conn.execute("INSERT INTO feedback (name, email, rating, message) VALUES (?, ?, ?, ?)",
                 ("Bo", "bo@example.com", 4, "Loved the projects"))
```
Leaving the `with` block **commits** if nothing went wrong and **rolls back** (undoes) if an exception occurred. Be aware that it does **not close** the connection. You still call `conn.close()`, which Flask will do for you in Lesson 5-5.

## Part 6: Two routes to the same goal
You need to remember feedback between server restarts.
- **Route A, JSON file** (Lesson 4-5): no new tools, readable by eye, fine for a handful of entries. Outcome: every read loads everything, concurrent writes can lose data, and questions like "average rating per month" need hand-written loops.
- **Route B, SQLite:** one more concept to learn. Outcome: queries are one line, the database prevents corruption, constraints reject bad data, and the same SQL skills scale up to server databases.

For anything beyond a throwaway script, Route B is the sensible choice, and it is what the rest of this course builds on.

## Part 7: Looking inside the database
You will want to see your data. Options:
- From Python 3.12 onward, `python -m sqlite3 hub.db` opens an interactive shell where you type SQL and see results (`.tables` lists tables, `.schema` shows definitions, `.quit` exits).
- The free program **DB Browser for SQLite** shows tables as spreadsheets.
- A tiny Python script that prints `SELECT *` also works.
Never open the database file in a text editor. It is a binary format, and saving it from there can corrupt it.

## Part 8: Errors you will meet
- **`sqlite3.OperationalError: no such table: feedback`:** you are connected to a different file than you think (check the path), or you never created the table.
- **`sqlite3.OperationalError: table feedback already exists`:** use `CREATE TABLE IF NOT EXISTS`.
- **`sqlite3.IntegrityError: NOT NULL constraint failed: feedback.name`:** you tried to insert a row without a required value. This is the database protecting you.
- **`sqlite3.ProgrammingError: Incorrect number of bindings supplied`:** the number of `?` marks and the number of values do not match.
- **Data missing after a restart:** you forgot `commit()`.

## Recap
- A database stores data safely, answers questions quickly and handles concurrent access. SQL is the language, SQLite is a file-based database that needs no server.
- A table has typed columns and rows. A primary key uniquely identifies each row, and `INTEGER PRIMARY KEY` auto-numbers in SQLite.
- `connect` opens (or creates) the file, `execute` runs SQL, `fetchall` and `fetchone` read results, and `commit` makes changes permanent.
- Always use `?` placeholders for values, never string formatting.
- `row_factory = sqlite3.Row` gives name-based access, and `with conn:` commits or rolls back but does not close.

Q: Why is a database better than a JSON file for growing data?
- JSON cannot store text

- A server process

WHY: SQLite is file-based, so there is nothing to install or run. The same SQL carries over to server databases.
Q: What makes a primary key different from other columns?
- It is always text
- Its value uniquely identifies each row *
- It can be empty
- It is hidden

- With the `BOOLEAN` type

- As the words yes and no only

- A duplicate row

===NOTES===
## What you will be able to do after this lesson
You will be able to ask a database precise questions with `SELECT`, filter rows with `WHERE` and combine conditions, search text with `LIKE`, match lists and ranges with `IN` and `BETWEEN`, handle `NULL` correctly, sort and limit results, page through results, name computed columns, and explain SQL injection well enough to demonstrate the attack and defend against it.

`SELECT` is the SQL you will write most often in your career. Learning to think in it is the main skill of this week.

## Part 1: Practice data
The examples use this `feedback` table. Create it in a scratch database and fill it so you can try every query.
```python
import sqlite3
conn = sqlite3.connect("play.db")
conn.executescript("""
DROP TABLE IF EXISTS feedback;
CREATE TABLE feedback (
    id INTEGER PRIMARY KEY, name TEXT NOT NULL, email TEXT NOT NULL,
    rating INTEGER NOT NULL, message TEXT, created TEXT NOT NULL
);
INSERT INTO feedback (name, email, rating, message, created) VALUES
 ('Ada',  'ada@example.com',  5, 'Clear and detailed',    '2026-10-01'),
 ('Bo',   'bo@example.com',   4, 'Loved the projects',    '2026-10-02'),
 ('Cy',   'cy@example.org',   3, NULL,                    '2026-10-03'),
 ('Dee',  'dee@example.com',  5, 'Great pace',            '2026-10-04'),
 ('Eli',  'eli@example.org',  2, 'Too fast in week 3',    '2026-10-05');
""")
conn.commit()
```
`executescript` runs several statements separated by semicolons (it does not take placeholders, so use it only for fixed scripts like this). Notice Cy's `message` is `NULL`, which matters later.

## Part 2: The shape of a SELECT
```sql
SELECT name, rating
FROM feedback
WHERE rating >= 4
ORDER BY rating DESC, name
LIMIT 10;
```
You can read it as a sentence: "get these columns, from this table, keeping only rows matching this, in this order, at most this many". The clauses must appear in exactly that order.

**The order the database actually works in** is different, and understanding it explains many errors: `FROM` (pick the table), then `WHERE` (filter rows), then `GROUP BY` and `HAVING` (Lesson 5-4), then `SELECT` (choose columns), then `ORDER BY`, then `LIMIT`. For instance, `WHERE` runs *before* `SELECT`, so you cannot use a column alias you invented in `SELECT` inside `WHERE`, but you can in `ORDER BY`.

## Part 3: Choosing columns
- `SELECT *` returns every column. Handy for exploring, fragile in application code, because adding a column changes the result.
- `SELECT name, rating` returns just those, in that order.
- `SELECT DISTINCT rating` removes duplicate values, here giving 5, 4, 3, 2.
- **Aliases** rename output columns with `AS`: `SELECT name AS visitor, rating * 2 AS score FROM feedback`. You can compute with `+ - * /` and join text with `||`: `SELECT name || ' <' || email || '>' AS contact FROM feedback`.

Beware integer division: in SQLite, `5 / 2` is `2` because both are integers. Write `5 / 2.0` or `CAST(5 AS REAL) / 2` to get `2.5`.

## Part 4: Filtering with WHERE
`WHERE` keeps only rows for which the condition is true.
- Comparisons: `=`, `<>` (or `!=`), `<`, `<=`, `>`, `>=`. Note that SQL uses a **single** `=` for equality.
- Combine with `AND`, `OR`, `NOT`. `AND` binds tighter than `OR`, so use parentheses to say what you mean:
```sql
SELECT * FROM feedback WHERE rating = 5 OR rating = 4 AND email LIKE '%.org';
-- means: rating 5, OR (rating 4 AND .org email). Probably not what you wanted.
SELECT * FROM feedback WHERE (rating = 5 OR rating = 4) AND email LIKE '%.org';
```
- **Ranges and lists:** `rating BETWEEN 3 AND 4` is the same as `rating >= 3 AND rating <= 4` (both ends included). `name IN ('Ada', 'Bo')` replaces a chain of `OR`s. `NOT IN` is the opposite.
- **Text patterns with `LIKE`:** `%` means "any number of characters" and `_` means "exactly one". `name LIKE 'A%'` finds names starting with A, `email LIKE '%@example.com'` finds that domain, `name LIKE '_o'` finds two-letter names ending in `o`. In SQLite, `LIKE` ignores case for ordinary English letters. String comparison with `=` is case-sensitive.
- Text values use **single quotes**: `'Ada'`. Double quotes are for identifiers like column names, and using them for text works in SQLite by accident but fails elsewhere.

## Part 5: NULL, the value that is not a value
`NULL` means "unknown or missing". It is not zero and not an empty string. Its rules surprise everyone at first:
- Any comparison with `NULL` gives neither true nor false but *unknown*, and `WHERE` keeps only true rows. So `WHERE message = NULL` returns **nothing**, even for Cy, and `WHERE message <> 'x'` also skips Cy.
- To test for it, use `IS NULL` and `IS NOT NULL`:
```sql
SELECT name FROM feedback WHERE message IS NULL;      -- Cy
SELECT name FROM feedback WHERE message IS NOT NULL;  -- everyone else
```
- `COALESCE(message, '(no message)')` replaces `NULL` with a fallback, useful for display.

**Two routes to the same goal.** You want all rows except those where the message is exactly `Great pace`.
- Route A: `WHERE message <> 'Great pace'`. Outcome: Cy disappears too, because `NULL <> 'Great pace'` is unknown.
- Route B: `WHERE message IS NULL OR message <> 'Great pace'`. Outcome: Cy is correctly kept.
This silent loss of rows is one of the most common SQL bugs.

## Part 6: Sorting, limiting and paging
- `ORDER BY rating` sorts ascending, `ORDER BY rating DESC` descending. Several keys break ties: `ORDER BY rating DESC, name ASC`. Without `ORDER BY`, the order of rows is **not guaranteed**, even if it looks stable today.
- In SQLite, `NULL` sorts as the smallest value, so it comes first in ascending order.
- `LIMIT 3` returns at most three rows. `LIMIT 3 OFFSET 3` skips the first three and returns the next three, which is how **pagination** works: page `p` of size `n` is `LIMIT n OFFSET (p - 1) * n`. Always pair `LIMIT` with `ORDER BY`, or "the first three" is arbitrary.

## Part 7: Getting Python values into SQL safely
Suppose the rating comes from a user. Compare two routes.
- **Route A, glue the text together:**
```python
rating = request.args.get("rating", "")
sql = f"SELECT * FROM feedback WHERE rating = {rating}"   # DANGEROUS
rows = conn.execute(sql).fetchall()
```
- **Route B, placeholders:**
```python
rows = conn.execute("SELECT * FROM feedback WHERE rating = ?", (rating,)).fetchall()
```
With Route A, an attacker visiting `?rating=0 OR 1=1` makes the query `WHERE rating = 0 OR 1=1`, which is true for every row, so they read **all** the data. Worse, input such as `1; DROP TABLE feedback` or a `UNION SELECT` of another table can destroy or steal data. This is **SQL injection**, and it has caused many of the largest data breaches in history. With Route B the value is sent separately from the SQL text, so `0 OR 1=1` is just a strange value that matches nothing.

Two points to remember. The tuple needs a trailing comma when it has one item: `(rating,)`, because `(rating)` is just parentheses. And placeholders work for **values**, not for table or column names. If a column name must vary (for example a sort column), choose it from a fixed allowlist in Python, never from user input:
```python
SORTABLE = {"rating", "created", "name"}
col = request.args.get("sort", "created")
if col not in SORTABLE:
    col = "created"
rows = conn.execute(f"SELECT * FROM feedback ORDER BY {col}").fetchall()
```
This f-string is acceptable only because `col` is guaranteed to be one of three known words.

## Part 8: Reading results in Python
```python
conn.row_factory = sqlite3.Row
rows = conn.execute(
    "SELECT name, rating FROM feedback WHERE rating >= ? ORDER BY rating DESC",
    (4,),
).fetchall()
for r in rows:
    print(r["name"], r["rating"])
```
Use `fetchone()` when you expect at most one row (looking up by id) and check for `None`, and `fetchall()` for lists. Looping directly over the cursor works too and avoids building a big list.

## Recap
- A SELECT reads as: columns, FROM table, WHERE filter, ORDER BY, LIMIT, in that fixed order. The database executes FROM, WHERE, SELECT, ORDER BY, LIMIT.
- `WHERE` takes comparisons, `AND`/`OR`/`NOT` (use parentheses), `BETWEEN`, `IN` and `LIKE` with `%` and `_`.
- `NULL` is unknown: use `IS NULL`, and remember `<>` silently drops NULL rows.
- Use `ORDER BY` whenever order matters, and `LIMIT`/`OFFSET` to page.
- Never build SQL from user text. Use `?` placeholders for values and an allowlist for column names.

    "message IS NULL",

]:

print(conn.execute("SELECT name, COALESCE(message, '(no message)') FROM feedback").fetchall())
```
### Search function | independent
Write `search_feedback(conn, text=None, min_rating=None, sort="created")` that builds a query using only the filters provided: text is matched against the `message` with `LIKE` (use `%` around it), `min_rating` filters ratings. Values must go through placeholders. `sort` must be one of `created`, `rating` or `name`, falling back to `created`. Return a list of dictionaries. Test all combinations, including `None`, an unknown sort value, and the text `%` itself.
HINT: Build a list of condition strings and a list of parameters side by side, then join the conditions with `" AND "`. Only the column name goes into the f-string, after the allowlist check.
EXPECT: `search_feedback(conn, text="fast", min_rating=2)` returns Eli. An unknown sort silently uses `created`.
SOL:

def search_feedback(conn, text=None, min_rating=None, sort="created"):
    conditions, params = [], []
    if text:
        conditions.append("message LIKE ?")
        params.append(f"%{text}%")
    if min_rating is not None:
        conditions.append("rating >= ?")
        params.append(min_rating)
    if sort not in {"created", "rating", "name"}:
        sort = "created"
    sql = "SELECT * FROM feedback"
    if conditions:
        sql += " WHERE " + " AND ".join(conditions)
    sql += f" ORDER BY {sort}"
    conn.row_factory = sqlite3.Row
    return [dict(r) for r in conn.execute(sql, params)]
```

def safe_by_rating(conn, rating):

SOL:

@app.route("/api/feedback")
def api_feedback():
    page = max(request.args.get("page", 1, type=int), 1)
    per_page = min(max(request.args.get("per_page", 5, type=int), 1), 20)
    min_rating = request.args.get("min_rating", type=int)
    sort = request.args.get("sort", "created")
    direction = "DESC" if sort.startswith("-") else "ASC"
    column = sort.lstrip("-")
    if column not in {"created", "rating", "name"}:
        column, direction = "created", "ASC"

    where, params = "", []
    if min_rating is not None:
        where, params = "WHERE rating >= ?", [min_rating]

    conn = get_db()
    total = conn.execute(f"SELECT COUNT(*) FROM feedback {where}", params).fetchone()[0]
    rows = conn.execute(
        f"SELECT * FROM feedback {where} ORDER BY {column} {direction} LIMIT ? OFFSET ?",
        params + [per_page, (page - 1) * per_page],
    ).fetchall()

            "per_page": per_page, "total": total}

Q: In which order must the clauses of a SELECT be written?
- WHERE, SELECT, FROM, ORDER BY
- SELECT, FROM, WHERE, ORDER BY, LIMIT *
- FROM, SELECT, LIMIT, WHERE
- ORDER BY, SELECT, FROM
WHY: The written order is fixed. The database executes them in a different order (FROM, WHERE, SELECT, ORDER BY, LIMIT).
Q: What does `WHERE message = NULL` return?
- Every row where the message is empty
- Rows where the message is NULL
- No rows at all *
- An error
WHY: Comparing anything with NULL yields unknown, which `WHERE` does not keep. Use `IS NULL`.
Q: Which expression correctly finds rows with a missing message?
TYPE: message IS NULL
WHY: `IS NULL` is the only test that can be true for a missing value.
Q: What is the problem with `WHERE message <> 'Great pace'` when some messages are NULL?
- Nothing
- Rows with a NULL message are silently left out *
- It raises an error
- It matches everything
WHY: `NULL <> 'x'` is unknown, so those rows are not returned. Add `OR message IS NULL` if you want them.
Q: What does `name LIKE '_o'` match?
- Any name ending in `o`
- Names of exactly two letters ending in `o` *
- Names containing `_o`
- Names starting with `o`
WHY: `_` matches exactly one character and `%` matches any number of characters.
Q: What does `rating BETWEEN 3 AND 4` include?
- Only 3 and 4 excluded ends
- 3 and 4, both ends included *
- Only values strictly between them
- Only 3
WHY: `BETWEEN` is inclusive on both ends. It equals `rating >= 3 AND rating <= 4`.
Q: How do you get page 3 of results with 10 rows per page?
- `LIMIT 10 OFFSET 3`
- `LIMIT 10 OFFSET 20` *
- `LIMIT 30`
- `OFFSET 10 LIMIT 3`
WHY: The offset is `(page - 1) * per_page`, which is 20 here. Pair it with `ORDER BY` so the pages are consistent.
Q: What makes `f"... WHERE rating = {rating}"` dangerous?
- It is slower
- User input can change the meaning of the query, which is SQL injection *
- F-strings do not work in SQL
- It only works for text
WHY: The user's text becomes part of the SQL code. Placeholders keep values separate from code.
Q: Why does a placeholder call need `(rating,)` rather than `(rating)`?
- It is only style
- `(rating)` is just parentheses, while the comma makes a one-item tuple *
- Tuples need two items
- The comma marks a placeholder
WHY: The parameters must be a sequence. Without the comma Python sees a plain string in parentheses.
Q: A user chooses the sort column. How do you build `ORDER BY` safely?
- Use a `?` placeholder for the column name
- Check the name against a fixed allowlist and only then put it in the SQL text *
- Escape quotes
- It is always safe
WHY: Placeholders work for values, not for identifiers. An allowlist guarantees only known words reach the query.
