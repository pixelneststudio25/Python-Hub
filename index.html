### Index audit for Hub | challenge
Take the Hub v3 schema (users, lessons, feedback, tags, lesson_tags, progress) and fill it with generated data: 50 lessons, 5 000 users, 200 000 feedback rows, and progress rows. Write the six queries your site runs most (feedback for a lesson newest first, a user's progress, lessons per tag, per-lesson statistics, feedback by a user, feedback with rating at least 4 in the last 30 days). Record the plan and timing of each **before** adding any extra index, then add the minimum set of indexes you can justify, and record plans and timings again. Produce a table of query, plan before, time before, plan after, time after. Remove one index at a time to prove each one is pulling its weight, and delete any that do not.
HINT: Use `INSERT ... executemany` in one transaction and `random.seed(1)` for repeatable data. Foreign keys that are not the first column of a primary key are the first candidates.
EXPECT: A small set of indexes (for example `feedback (lesson_id, created)`, `feedback (user_id)`, `lesson_tags (tag_id)`, `progress (lesson_id)`), each justified by a plan change and a timing improvement, and no unused ones.
SOL:
```python
random.seed(1)
SCHEMA_INDEXES = """
CREATE INDEX IF NOT EXISTS idx_feedback_lesson_created ON feedback (lesson_id, created);
CREATE INDEX IF NOT EXISTS idx_feedback_user ON feedback (user_id);
CREATE INDEX IF NOT EXISTS idx_lesson_tags_tag ON lesson_tags (tag_id);
CREATE INDEX IF NOT EXISTS idx_progress_lesson ON progress (lesson_id);
"""

def benchmark(conn, queries):
    report = []
    for name, sql, params in queries:
        plan = [r[3] for r in conn.execute("EXPLAIN QUERY PLAN " + sql, params)]
        start = time.perf_counter()
        for _ in range(20):
            conn.execute(sql, params).fetchall()
        report.append((name, plan, (time.perf_counter() - start) / 20))
    return report

before = benchmark(conn, QUERIES)
conn.executescript(SCHEMA_INDEXES)
after = benchmark(conn, QUERIES)
for (n, p1, t1), (_, p2, t2) in zip(before, after):
    print(f"{n:28} {t1:.5f}s -> {t2:.5f}s  {p1} -> {p2}")
```
===QUIZ===
Q: What does a full table scan do?
- Jumps straight to the matching row
- Reads every row and tests the condition on each *
- Reads only the primary key
- Deletes duplicates
WHY: Without a usable index the database has nothing to jump with, so cost grows with table size.
Q: What is an index?
- A copy of the whole table
- A separate sorted structure that lets the database find rows without scanning *
- A kind of constraint that rejects data
- A backup file
WHY: SQLite uses a B-tree that stores column values with pointers to rows, like the index of a book.
Q: Which statement lists how SQLite will run a query?
TYPE: EXPLAIN QUERY PLAN
WHY: Put it before any SELECT and read the `SCAN` or `SEARCH` lines it returns.
Q: Which indexes does SQLite create for you automatically?
- On every column
- On foreign key columns
- On the primary key and on UNIQUE constraints *
- None
WHY: It needs them to find rows by id and to check uniqueness. Foreign key columns are not indexed unless you do it.
Q: What is the main cost of adding indexes?
- Queries get less accurate
- Writes get slower and storage grows *
- Foreign keys stop working
- Transactions become impossible
WHY: Every insert, update and delete must also maintain each index.
Q: A composite index is on `(lesson_id, created)`. Which query can use it?
- `WHERE created > '2026-01-01'` only
- `WHERE lesson_id = 5 ORDER BY created` *
- `WHERE rating = 5`
- None of them
WHY: The leftmost-prefix rule: the first column must be used. It also gives the sort order for free.
Q: Why can `WHERE lower(email) = ?` not use a plain index on `email`?
- `lower` is not allowed in WHERE
- The index stores raw email values, not their lowercase form *
- SQLite ignores text columns
- Indexes only work for numbers
WHY: Applying a function to the column hides the stored values from the index. Use an expression index or store lowercase.
Q: `EXPLAIN QUERY PLAN` shows `SCAN feedback` for a query on a table with ten million rows. What does it suggest?
- The query is perfectly fine
- The query reads the whole table and probably needs an index or a rewrite *
- The table is empty
- The index is corrupt
WHY: A scan on a big table is the classic sign of a missing or unusable index.
Q: Why should you insert many rows inside one transaction when timing or loading data?
- It makes the data smaller
- Committing once is much faster than committing after every row *
- Python requires it
- It avoids creating indexes
WHY: Each commit forces a durable write to disk. Batching avoids paying that cost per row.
Q: Which command removes an index without losing any data?
TYPE: DROP INDEX
WHY: Dropping an index only loses the speed-up, never the table's rows.

===NOTES===
## What you will be able to do after this lesson
You will be able to turn a written description of an application into a table design (entities, relationships, keys, types and constraints), review a schema against a checklist, explain why `CREATE TABLE IF NOT EXISTS` is not enough once real data exists, change a live schema with `ALTER TABLE` and know its limits, rebuild a table when `ALTER` cannot do the job, write a small migration runner using `PRAGMA user_version`, back up a database safely before changing it, and test migrations. These skills combine into **Hub v3**, the project that closes Week 6.

## Part 1: From description to tables
Schema design is mostly careful reading. Take this description of the next Hub:

> Visitors can register with a name and a unique email. Lessons belong to a week and have a unique title. Lessons carry tags (a lesson may have several, a tag labels several lessons). Registered users can leave feedback on a lesson with a rating from 1 to 5 and a message, and can mark lessons as completed, with a score.

A reliable method:
1. **Underline the nouns.** Visitors/users, lessons, weeks, tags, feedback, completion. Each *thing with its own facts* is a table candidate. A **week** here is only a number describing a lesson, so it is a column, not a table. Ask of each noun: "does it have several attributes of its own, or is it one value?"
2. **Find the relationships (the verbs).** Users *leave* feedback, feedback is *about* a lesson, lessons *have* tags, users *complete* lessons.
3. **Decide the cardinality** of each: user to feedback is one-to-many, lesson to feedback is one-to-many, lesson to tag is many-to-many (junction), user to lesson completion is many-to-many with extra data (junction with columns).
4. **Choose keys, types and constraints** for every column.
5. **Decide delete behaviour** for every foreign key (Lesson 6-1).
6. **Add indexes** for the queries you know you will run (Lesson 6-4).

The result for this description:
```sql
CREATE TABLE users (
    id      INTEGER PRIMARY KEY,
    name    TEXT NOT NULL,
    email   TEXT NOT NULL UNIQUE,
    created TEXT NOT NULL DEFAULT (datetime('now'))
);
CREATE TABLE lessons (
    id    INTEGER PRIMARY KEY,
    title TEXT NOT NULL UNIQUE,
    week  INTEGER NOT NULL CHECK (week BETWEEN 1 AND 12)
);
CREATE TABLE tags (id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE);
CREATE TABLE lesson_tags (
    lesson_id INTEGER NOT NULL REFERENCES lessons (id) ON DELETE CASCADE,
    tag_id    INTEGER NOT NULL REFERENCES tags (id) ON DELETE CASCADE,
    PRIMARY KEY (lesson_id, tag_id)
);
CREATE TABLE feedback (
    id        INTEGER PRIMARY KEY,
    user_id   INTEGER REFERENCES users (id) ON DELETE SET NULL,
    lesson_id INTEGER NOT NULL REFERENCES lessons (id) ON DELETE CASCADE,
    rating    INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5),
    message   TEXT NOT NULL,
    created   TEXT NOT NULL DEFAULT (datetime('now'))
);
CREATE TABLE progress (
    user_id      INTEGER NOT NULL REFERENCES users (id) ON DELETE CASCADE,
    lesson_id    INTEGER NOT NULL REFERENCES lessons (id) ON DELETE CASCADE,
    completed_at TEXT NOT NULL DEFAULT (datetime('now')),
    score        INTEGER CHECK (score BETWEEN 0 AND 100),
    PRIMARY KEY (user_id, lesson_id)
);
CREATE INDEX idx_feedback_lesson_created ON feedback (lesson_id, created);
CREATE INDEX idx_feedback_user ON feedback (user_id);
CREATE INDEX idx_lesson_tags_tag ON lesson_tags (tag_id);
CREATE INDEX idx_progress_lesson ON progress (lesson_id);
```

## Part 2: A schema review checklist
Run every table through these questions before you write any application code:
- Does it have a **primary key**?
- Is every fact stored **once**? Is any column a list in disguise, or a copy of data from another table?
- Does every foreign key have a deliberate `ON DELETE` rule and an **index**?
- Is every column that must always have a value `NOT NULL`?
- Are **uniqueness rules** enforced by `UNIQUE` (emails, titles, pairs)?
- Do `CHECK` constraints guard ranges and allowed values?
- Are **dates** stored as ISO text in UTC? Are **booleans** `0`/`1` with `CHECK (x IN (0, 1))`?
- Are **money amounts** stored as integers of the smallest unit (cents or kobo), never as decimals that suffer rounding errors?
- Are names consistent: plural table names, `<thing>_id` for keys, snake_case?
Fixing a design mistake on paper takes a minute. Fixing it after a year of data takes weeks.

## Part 3: The problem with changing a schema later
Your `schema.sql` uses `CREATE TABLE IF NOT EXISTS`. That statement does nothing if the table already exists, even if your new version of the definition is different. So:
- You add a column to `schema.sql`. Fresh databases get it. Your **existing** database and your **deployed** one do not, and the code that expects the column crashes with `no such column`.
- Deleting the database to start over destroys real data. Fine on your laptop on day one, impossible once people use the site.

The professional answer is a **migration**: a small, numbered script that moves a database from version N to N+1, applied once, in order, on every copy of the database. The state of the schema is then defined by "all migrations applied so far", and any database, new or old, can be brought to the latest version.

## Part 4: Changing tables with ALTER TABLE
SQLite's `ALTER TABLE` can do a few things directly:
```sql
ALTER TABLE users ADD COLUMN bio TEXT;
ALTER TABLE users ADD COLUMN role TEXT NOT NULL DEFAULT 'student';
ALTER TABLE users RENAME COLUMN bio TO about;
ALTER TABLE users RENAME TO members;
ALTER TABLE users DROP COLUMN about;
```
Know the limits, because each one produces a real error you will meet:
- **`ADD COLUMN` with `NOT NULL` needs a `DEFAULT`**, because existing rows need a value. Without it: `Cannot add a NOT NULL column with default value NULL`.
- **The default must be a constant.** `DEFAULT (datetime('now'))` is refused on `ADD COLUMN` with `Cannot add a column with non-constant default`. Add the column as nullable, then fill it with `UPDATE`.
- **You cannot add a column that is `PRIMARY KEY` or `UNIQUE`** through `ADD COLUMN`. Create the column, then a `CREATE UNIQUE INDEX`.
- **`DROP COLUMN` fails** if the column is a primary key, is `UNIQUE`, is indexed, or is used in a constraint or foreign key. (It also needs SQLite 3.35 or newer.)
- You **cannot change a column's type or constraints** at all, nor add or remove a `CHECK` on an existing column.

## Part 5: The table rebuild recipe
For everything `ALTER` cannot do, SQLite's documented method is to build the new table, copy the data, and swap:
```sql
BEGIN;
CREATE TABLE feedback_new (
    id        INTEGER PRIMARY KEY,
    user_id   INTEGER REFERENCES users (id) ON DELETE SET NULL,
    lesson_id INTEGER NOT NULL REFERENCES lessons (id) ON DELETE CASCADE,
    rating    INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5),
    message   TEXT NOT NULL CHECK (length(message) <= 500),   -- the change
    created   TEXT NOT NULL DEFAULT (datetime('now'))
);
INSERT INTO feedback_new SELECT id, user_id, lesson_id, rating, message, created FROM feedback;
DROP TABLE feedback;
ALTER TABLE feedback_new RENAME TO feedback;
CREATE INDEX idx_feedback_lesson_created ON feedback (lesson_id, created);
CREATE INDEX idx_feedback_user ON feedback (user_id);
COMMIT;
```
Study the steps: build the new definition under a temporary name, copy **every column explicitly** in the same order, drop the old table, rename the new one, and **recreate the indexes** (they were dropped with the old table). The whole thing sits in one transaction so a failure leaves the original intact. Because other tables reference `feedback` and `DROP TABLE` interacts with foreign keys, run the rebuild with foreign keys temporarily **off** and check afterwards (see the runner below).

If existing data violates the new rule (say a message longer than 500 characters), the `INSERT ... SELECT` fails and the migration aborts, which is exactly what you want: you decide what to do with the offending rows before retrying.

## Part 6: A migration runner
SQLite keeps a free integer slot in the database file called **`user_version`**, which defaults to `0`. We use it to remember how many migrations have been applied.
```
migrations/
  001_init.sql
  002_tags.sql
  003_progress.sql
```
```python
# migrate.py
import sqlite3
from pathlib import Path

def migrate(db: sqlite3.Connection, folder: Path) -> int:
    current = db.execute("PRAGMA user_version").fetchone()[0]
    scripts = sorted(folder.glob("*.sql"))
    db.execute("PRAGMA foreign_keys = OFF")
    try:
        for path in scripts:
            number = int(path.name.split("_")[0])
            if number <= current:
                continue
            script = path.read_text(encoding="utf-8")
            try:
                db.executescript(f"BEGIN;\n{script}\nPRAGMA user_version = {number};\nCOMMIT;")
            except sqlite3.Error:
                db.rollback()
                raise
            current = number
        problems = db.execute("PRAGMA foreign_key_check").fetchall()
        if problems:
            raise RuntimeError(f"foreign key violations after migration: {problems}")
    finally:
        db.execute("PRAGMA foreign_keys = ON")
    return current
```
How it works:
- It reads the current version, then walks the scripts in filename order, **skipping those already applied**. Running it twice does nothing the second time.
- Each script runs inside its own `BEGIN ... COMMIT` together with the version update, so a script and its version bump succeed or fail **together**. On an error the transaction is rolled back and the exception is raised, leaving the database at the last good version.
- `PRAGMA user_version = N` cannot take a `?` placeholder, so the number goes into the text. That is safe here because it comes from `int(...)` of a filename you control, never from user input.
- Foreign keys are off during migrations, which table rebuilds require, then checked with `PRAGMA foreign_key_check` (it lists any violating rows) and switched back on.
- The numbering `001_`, `002_` keeps the order unambiguous. The golden rule: **never edit a migration that has been applied anywhere**. If it was wrong, write a new migration that corrects it.

## Part 7: Backups
A migration can destroy data if it is wrong, so back up first. Do not just copy the file while a program may be writing to it. Use SQLite's backup API:
```python
def backup(src_path, dst_path):
    src = sqlite3.connect(src_path)
    dst = sqlite3.connect(dst_path)
    with dst:
        src.backup(dst)
    dst.close(); src.close()
```
It produces a consistent copy even if the database is in use. A sensible habit is a `flask --app app migrate` command that makes a timestamped backup before applying anything, and keeps the last few copies.

## Part 8: Wiring it into Flask, and testing it
Replace `init-db` and `schema.sql` with the migrations folder:
```python
@click.command("migrate")
def migrate_command():
    version = migrate(get_db(), Path(current_app.root_path) / "migrations")
    click.echo(f"Database at version {version}.")
```
Migrations deserve tests, because a broken one hurts most when it matters most:
```python
def test_fresh_database_reaches_latest(tmp_path):
    db = connect(tmp_path / "t.db")
    assert migrate(db, MIGRATIONS) == 3

def test_upgrade_keeps_data(tmp_path):
    db = connect(tmp_path / "t.db")
    migrate_to(db, 1)              # apply only the first migration
    db.execute("INSERT INTO users (name, email) VALUES ('Ada', 'a@b.co')")
    db.commit()
    migrate(db, MIGRATIONS)        # then upgrade to the latest
    assert db.execute("SELECT name FROM users").fetchone()[0] == "Ada"

def test_second_run_changes_nothing(tmp_path):
    db = connect(tmp_path / "t.db")
    assert migrate(db, MIGRATIONS) == migrate(db, MIGRATIONS)
```
These three tests prove that a new install works, that an upgrade preserves data, and that the runner is repeatable. In tests, also let your app fixture build its database by calling `migrate`, so the application is always tested against the real schema.

## Part 9: Project, Hub v3
Build the third version of Hub on the schema from Part 1. Requirements:
- **Migrations:** `001_init.sql` (users, lessons, feedback), `002_tags.sql` (tags and junction), `003_progress.sql` (progress and all indexes), run by `flask --app app migrate`, with a timestamped backup first. A seed command adds lessons, tags and sample users.
- **Lessons list:** every lesson with its tags (as badges) and its response count and average (one query with joins), plus filtering by `?tags=sql,web` requiring all the tags.
- **Lesson page:** feedback listed newest first with the reviewer's name (`Anonymous` when `user_id` is `NULL`), a tag editor that replaces tags in one transaction, and a "mark complete" form.
- **Progress:** a page for a user listing completed lessons with scores and a completion percentage. Completing twice updates the score (upsert).
- **A stand-in identity:** `/dev/login/<int:user_id>` stores `session["user_id"]`, **only available when the app is in debug or test mode** and returning 404 otherwise. It is scaffolding to be replaced by real authentication in Week 8. Views that need a user redirect with a flash message when there is none.
- **Quality:** migration tests as in Part 8, route tests for every page, a query test for each join with hand-calculated expectations, and an `EXPLAIN QUERY PLAN` check that the main list queries use an index.

Build in this order: migrations and runner, seed data, lesson list with joins, lesson page, tags, progress, tests. Commit after each step.

## Recap
- Design from the description: nouns become tables, verbs become relationships, and each relationship gets a cardinality, keys, constraints and delete rules.
- `IF NOT EXISTS` cannot evolve an existing database. Numbered migrations tracked with `PRAGMA user_version` can.
- `ALTER TABLE` adds, renames and drops columns with strict limits. Everything else uses the rebuild recipe inside a transaction, with indexes recreated.
- Never edit an applied migration, back up before migrating with the backup API, and test fresh install, upgrade and repeat runs.

        return redirect(url_for("lessons"))
    score = request.form.get("score", type=int)
    db = get_db()
    with db:
        db.execute("""INSERT INTO progress (user_id, lesson_id, score) VALUES (?, ?, ?)
                      ON CONFLICT (user_id, lesson_id)
                      DO UPDATE SET score = excluded.score, completed_at = datetime('now')""",
                   (user_id, lesson_id, score))
    flash("Marked complete.", "success")
    return redirect(url_for("lesson", lesson_id=lesson_id))

===QUIZ===
Q: In schema design, what should you do with the nouns in a description of the application?
- Make each one a column
- Treat each thing that has its own facts as a table candidate *
- Ignore them and look at the verbs only
- Put them all in one table
WHY: Things with several attributes of their own become tables. A single value, like a week number, is just a column.
Q: Why is `CREATE TABLE IF NOT EXISTS` not enough once a real database exists?
- It deletes the data
- It does nothing when the table exists, so schema changes never reach existing databases *
- It is not valid SQL
- It rebuilds the table
WHY: Existing databases keep their old shape. Migrations carry every copy of the database forward.
Q: What is a migration?
- A copy of the database
- A small numbered script that moves a database from one schema version to the next *
- A type of index
- A foreign key rule
WHY: Applied once and in order, migrations define the schema as the sum of changes so far.
Q: Which pragma value stores the number of migrations applied in the SQLite file?
TYPE: user_version | PRAGMA user_version
WHY: It is a free integer slot in the database header, perfect for tracking the schema version.
Q: Why does `ALTER TABLE users ADD COLUMN role TEXT NOT NULL` fail?
- `role` is a reserved word
- Existing rows would have NULL, so a NOT NULL column needs a DEFAULT *
- ALTER cannot add columns
- The table has no primary key
WHY: Existing rows need a value for the new column. Add `DEFAULT 'student'`.
Q: Which change can `ALTER TABLE` not do in SQLite?
- Add a nullable column
- Rename a column
- Add a CHECK constraint to an existing column *
- Rename a table
WHY: Changing constraints needs the rebuild recipe: new table, copy, drop, rename, recreate indexes.
Q: In the rebuild recipe, what must you remember to do after renaming the new table?
- Reboot the computer
- Recreate the indexes, because they were dropped with the old table *
- Delete the data
- Run VACUUM only
WHY: Indexes belong to the table that was dropped, so the new table starts without them.
Q: What is the golden rule about migrations that have already been applied?
- Edit them freely
- Never edit them. Write a new migration to correct a mistake *
- Delete them after a week
- Merge them all into one
WHY: Other databases have already run the old version, so changing it would make copies diverge.
Q: Why is it better to back up with SQLite's backup API than to copy the file?
- It is shorter
- It produces a consistent copy even if the database is in use *
- Copying is forbidden
- It compresses the file
WHY: A plain file copy during a write can capture a half-written state.
Q: Why is the stand-in `/dev/login/<id>` route restricted to debug or test mode?
- It is slower otherwise
- Anyone could log in as any user in production, so it must be unavailable there *
- Flask forbids sessions in production
- It needs a template
WHY: It has no password check at all. It is scaffolding until real authentication arrives in Week 8.

s:'A subclass <b>inherits</b> methods from a parent class and can override them; <code>super()</code> calls the parent’s version. <b>Dunder methods</b> such as <code>__repr__</code> and <code>__eq__</code> let your objects work with Python’s built-in behavior. A <code>@property</code> makes a method read like an attribute, so you can add validation without changing how callers use it.',

{id:'2-4',w:2,t:'Exceptions, modules and imports',v:'nv24',nv:1,
s:'Exceptions are how Python reports problems. <code>try/except</code> catches them so your program can recover, and <code>raise</code> creates them. A <b>module</b> is a <code>.py</code> file you can <code>import</code>; a <b>package</b> is a folder of modules.',
d:'<p>Catch the narrowest exception you can (<code>except ValueError</code>, not a bare <code>except</code>). A bare except hides real bugs. Read tracebacks from the bottom: the last line is the error and the lines above show how the program got there.</p><p>Wrap code in <code>if __name__ == "__main__":</code> so it runs only when the file is executed directly, not when imported. Flask’s <code>app.run()</code> usually lives there.</p>',

{id:'2-5',w:2,t:'Files, JSON and a CLI quiz app',v:'-51jxlQaxyA',more:'9N6a-VLBa2I',e:1,vt:['JSON file handling: video 1','JSON file handling: video 2'],
s:'Use <code>with open(...)</code> so files close automatically. JSON is a text format for structured data: <code>json.load</code> reads a file into dicts and lists, and <code>json.dump</code> writes them back. Combine this with classes and functions to build a small command-line quiz app.',
d:'<p>Pass <code>encoding="utf-8"</code> when opening text files, and check a file exists with <code>pathlib.Path</code>. JSON keys are always strings, and Python’s <code>None</code> becomes <code>null</code>.</p><p>JSON is also the language of web APIs. You will use exactly these ideas when Flask sends and receives data in later weeks.</p>',
tm:[['Context manager','The with statement guarantees cleanup, such as closing a file, even after an error.'],['JSON','A text format for structured data built from objects, lists, strings and numbers.'],['Serialization','Turning Python objects into text that can be stored or sent.'],['pathlib','A module that treats file paths as objects.']],
c:'import json\nfrom pathlib import Path\n\npath = Path("questions.json")\n\ndata = [{"q": "2 + 2?", "options": ["3", "4"], "answer": 1}]\nwith open(path, "w", encoding="utf-8") as f:\n    json.dump(data, f, indent=2)\n\nwith open(path, encoding="utf-8") as f:\n    questions = json.load(f)\n\nfor item in questions:\n    print(item["q"], item["options"])',
tk:[['Write <code>load_questions(path)</code> that returns a list from a JSON file, or an empty list if the file does not exist.','Check <code>Path.exists()</code> or catch <code>FileNotFoundError</code>.','import json\nfrom pathlib import Path\n\ndef load_questions(path):\n    p = Path(path)\n    if not p.exists():\n        return []\n    with open(p, encoding="utf-8") as f:\n        return json.load(f)'],['Project: build a command-line quiz that loads questions from JSON, asks them one by one, scores the player, and saves the high score to a file.','Break it into small functions: load, ask, score, save.','def ask(item):\n    for i, opt in enumerate(item["options"]):\n        print(i, opt)\n    return int(input("Answer: ")) == item["answer"]\n\ndef run(questions):\n    score = sum(ask(q) for q in questions)\n    print(f"{score}/{len(questions)}")\n    return score']],

{id:'3-1',w:3,t:'How the web works: HTTP',v:'eesqK59rhGA',
s:'The web is a conversation between a <b>client</b> (your browser) and a <b>server</b>. The client sends an HTTP <b>request</b> (method, URL, headers, optional body) and the server sends back a <b>response</b> (status code, headers, body). Flask is the Python program on the server that decides which response to send.',
d:'<p>Common methods: <code>GET</code> reads, <code>POST</code> submits or creates, <code>PUT</code> and <code>PATCH</code> update, <code>DELETE</code> removes. Status codes group by first digit: 2xx success, 3xx redirect, 4xx client error (404 not found), 5xx server error.</p><p>HTTP is <em>stateless</em>: every request stands alone, which is why cookies and sessions exist. Analogy: a sensor message must carry everything the controller needs, because the controller keeps no memory of the last one.</p>',
tm:[['HTTP request','A message from a client asking a server for something: method, URL, headers and optional body.'],['HTTP response','The server’s reply: status code, headers and body.'],['Status code','A three-digit number summarizing the result, such as 200 or 404.'],['Stateless','Each request is independent; the server keeps no memory of earlier ones by default.']],
c:'GET /lessons/1 HTTP/1.1\nHost: pythonhub.example\nAccept: text/html\n\nHTTP/1.1 200 OK\nContent-Type: text/html\n\n<h1>Lesson 1</h1>',
tk:[['Open your browser’s developer tools (Network tab), load any website, and find one request. Write down its method, status code and one response header.','Press F12, open Network, refresh the page and click a row.','Example answer:\nMethod: GET\nStatus: 200\nHeader: Content-Type: text/html'],['Use the <code>requests</code> library to fetch <code>https://example.com</code> and print the status code and the first 100 characters of the body.','Install it inside your venv with <code>pip install requests</code>.','import requests\n\nr = requests.get("https://example.com")\nprint(r.status_code)\nprint(r.text[:100])']],
q:[['Which status code means "not found"?',['200','404','500'],1],['What does it mean that HTTP is stateless?',['Each request is independent of earlier ones','The server never responds','Requests are always encrypted'],0],['Which method is normally used to submit a form that creates data?',['GET','POST','HEAD'],1]]},
{id:'3-2',w:3,t:'Your first Flask project',v:'o3bCVqF9gI0',
s:'A Flask app is a Python object created with <code>Flask(__name__)</code>. You register <b>view functions</b> on URLs with <code>@app.route</code>, and whatever a view returns becomes the response. Running the app starts a development server that reloads when you save.',
d:'<p>Debug mode reloads on every save and shows an interactive traceback, but <b>never</b> enable it on a public server. Install Flask inside your venv, and never name your own file <code>flask.py</code>, because it would shadow the library.</p><p>The decorator <code>@app.route</code> is the same decorator pattern from Week 1. It registers your function; it does not change how it behaves.</p>',
tm:[['Flask app','The object that receives requests and routes them to your functions.'],['View function','A function that handles a URL and returns a response.'],['Development server','A small built-in server for testing on your own machine.'],['Debug mode','Auto-reload plus a detailed error page; for development only.']],
c:'from flask import Flask\n\napp = Flask(__name__)\n\n@app.route("/")\ndef home():\n    return "Hello from PythonHub"\n\nif __name__ == "__main__":\n    app.run(debug=True)',
tk:[['Create a project folder with a venv, install Flask, and run an app that returns your name on the home page. Open it at <code>http://127.0.0.1:5000</code>.','Activate the venv first, then <code>pip install flask</code>.','from flask import Flask\n\napp = Flask(__name__)\n\n@app.route("/")\ndef home():\n    return "Your name here"\n\nif __name__ == "__main__":\n    app.run(debug=True)'],['Add an <code>/about</code> route that returns a short sentence, then edit the sentence and watch the page reload.','Debug mode must be on for auto-reload.','@app.route("/about")\ndef about():\n    return "Built while learning Flask."']],
q:[['What does <code>@app.route("/")</code> do?',['Connects a URL to a view function','Starts the server','Creates a database'],0],['What does a view function return?',['The response sent to the browser','The port number','The Flask version'],0],['Where is it unsafe to enable debug mode?',['On a public server','On your own laptop','In tests'],0]]},
{id:'3-3',w:3,t:'Routes and URLs',v:'Jl9XzSPXSe4',
s:'Routes can capture parts of the URL: <code>/lesson/&lt;int:lesson_id&gt;</code> passes an integer to your function. <code>methods=[...]</code> controls which HTTP methods a route accepts, <code>url_for</code> builds URLs from function names so links never break, and <code>redirect</code> and <code>abort</code> send the user elsewhere or return an error.',
d:'<p>Prefer <code>url_for("lesson", lesson_id=3)</code> to hard-coding <code>"/lesson/3"</code>: if you change the URL later, every link updates. Converters also validate for free: <code>&lt;int:id&gt;</code> returns a 404 for <code>/lesson/abc</code>.</p><p>Two routes cannot share a function name, because <code>url_for</code> uses the function name to identify the route.</p>',
tm:[['Dynamic route','A route with a variable part, such as /user/<name>.'],['URL converter','A prefix like int: that validates and converts a captured value.'],['url_for','Builds a URL from a view function’s name.'],['Redirect','A response telling the browser to go to a different URL.']],
c:'from flask import Flask, redirect, url_for, abort\n\napp = Flask(__name__)\nLESSONS = {1: "Setup", 2: "Functions"}\n\n@app.route("/lesson/<int:lesson_id>")\ndef lesson(lesson_id):\n    if lesson_id not in LESSONS:\n        abort(404)\n    return f"Lesson {lesson_id}: {LESSONS[lesson_id]}"\n\n@app.route("/start")\ndef start():\n    return redirect(url_for("lesson", lesson_id=1))',
tk:[['Add <code>/hello/&lt;name&gt;</code> that returns a greeting using the name from the URL.','The converter name must match the function parameter.','@app.route("/hello/<name>")\ndef hello(name):\n    return f"Hello, {name}!"'],['Make <code>/double/&lt;int:n&gt;</code> return twice the number, then visit <code>/double/abc</code> and see what happens.','Return a string; a view cannot return a raw int.','@app.route("/double/<int:n>")\ndef double(n):\n    return str(n * 2)\n# /double/abc gives a 404']],
q:[['What does <code>&lt;int:id&gt;</code> in a route do?',['Captures part of the URL as an integer','Defines a database column','Sets the HTTP method'],0],['Why prefer <code>url_for</code> to hard-coded paths?',['Links update automatically if the route changes','It is faster','It encrypts URLs'],0],['Which function stops the request with a 404 error?',['abort(404)','redirect(404)','return 404()'],0]]},
{id:'3-4',w:3,t:'Templates and Jinja',v:'w6Ui_DVxluc',
s:'Templates are HTML files with placeholders. <code>render_template("page.html", name=value)</code> loads a file from the <code>templates/</code> folder and fills it using <b>Jinja</b>: <code>{{ value }}</code> prints a value, and <code>{% ... %}</code> runs logic such as loops and conditions.',
d:'<p>Jinja escapes HTML automatically, which protects you from cross-site scripting. Only use <code>|safe</code> when you are certain the content is trusted.</p><p>Keep logic in Python and presentation in templates: if a template gets complicated, compute the value in the view instead. The folder must be named exactly <code>templates</code> and sit next to your app file.</p>',
tm:[['Template','An HTML file with placeholders that Flask fills in.'],['Jinja','The templating language Flask uses.'],['Context variable','A value you pass from the view to the template.'],['Autoescaping','Jinja turning special characters into safe text so injected HTML cannot run.']],
c:'# app.py\nfrom flask import Flask, render_template\napp = Flask(__name__)\n\n@app.route("/lessons")\ndef lessons():\n    items = ["Setup", "Functions", "Classes"]\n    return render_template("lessons.html", title="Lessons", items=items)\n\n# templates/lessons.html\n# <h1>{{ title }}</h1>\n# <ul>\n#   {% for item in items %}\n#     <li>{{ item }}</li>\n#   {% endfor %}\n# </ul>',
tk:[['Create <code>templates/hello.html</code> that shows a name passed from the view, and an <code>/hi/&lt;name&gt;</code> route that renders it.','<code>render_template("hello.html", name=name)</code>','# app.py\n@app.route("/hi/<name>")\ndef hi(name):\n    return render_template("hello.html", name=name)\n\n# templates/hello.html\n# <h1>Hello, {{ name }}!</h1>'],['Render a list as a bullet list, and show "No lessons yet" when the list is empty.','A Jinja for loop can have an else branch.','<ul>\n  {% for item in items %}\n    <li>{{ item }}</li>\n  {% else %}\n    <li>No lessons yet</li>\n  {% endfor %}\n</ul>']],
q:[['Which syntax prints a variable in Jinja?',['{{ value }}','{% value %}','&lt;&lt; value &gt;&gt;'],0],['Where does Flask look for templates by default?',['A folder named templates next to your app','The static folder','Any folder on the computer'],0],['Why does Jinja autoescape variables?',['To stop injected HTML or scripts from running','To make pages load faster','To format numbers'],0]]},
{id:'3-5',w:3,t:'Template inheritance and Hub v0',v:'nv35',nv:1,
s:'Template inheritance lets every page share one layout. A <b>base template</b> defines the common HTML with holes called <b>blocks</b>, and child templates <code>{% extends "base.html" %}</code> and fill them. Static files (CSS, images, JavaScript) live in <code>static/</code> and are linked with <code>url_for("static", filename=...)</code>.',
d:'<p>This is the class inheritance idea from Week 2 applied to pages: the child reuses the parent and overrides specific parts. The navigation and footer live in one file, so a site-wide change is a one-file change.</p><p>Project: build "Hub v0", a small Flask site with Home, Lessons and About pages sharing one base template and one stylesheet.</p>',
tm:[['Base template','A layout shared by many pages.'],['Block','A named section in the base that child templates can fill.'],['extends','Makes a template reuse a base template.'],['Static folder','Where CSS, images and scripts live, served as-is.']],
c:'# templates/base.html\n# <!doctype html>\n# <title>{% block title %}PythonHub{% endblock %}</title>\n# <link rel="stylesheet" href="{{ url_for(\'static\', filename=\'style.css\') }}">\n# <nav><a href="{{ url_for(\'home\') }}">Home</a></nav>\n# {% block content %}{% endblock %}\n\n# templates/home.html\n# {% extends "base.html" %}\n# {% block content %}<h1>Welcome</h1>{% endblock %}',
tk:[['Create <code>base.html</code> and two child pages (home and about) that extend it, each with its own title.','Blocks in the child must use the same names as in the base.','{% extends "base.html" %}\n{% block title %}About{% endblock %}\n{% block content %}\n  <h1>About</h1>\n{% endblock %}'],['Project: build Hub v0 with Home, Lessons (looping over a Python list) and About pages, a shared navigation bar and one stylesheet in static/.','Start with the base template, then add one route and one page at a time.','Checklist:\n- base.html with navigation and blocks\n- style.css inside static/\n- three routes using render_template\n- links built with url_for']],
q:[['What does <code>{% extends "base.html" %}</code> do?',['Makes the page reuse the base layout','Imports a Python module','Includes a CSS file'],0],['Where do CSS and image files go in Flask?',['The static folder','The templates folder','The venv folder'],0],['What is a block?',['A named section a child template can fill in','A Python loop','A database table'],0]]},
{"id": "4-1", "w": 4, "t": "HTML forms and request.form", "v": "nP23R37lMxc", "s": "A form turns field values into a request. The <code>method</code> picks GET or POST, each field’s <code>name</code> becomes its key, and Flask reads the values from <code>request.form</code>. Always validate again in Python, and redirect after a successful POST.", "tm": [["Form", "A group of fields plus a button that makes the browser send a request."], ["request.form", "The submitted POST fields, always as strings."], ["Server-side validation", "Checking input in Python, because HTML checks can be bypassed."], ["Post/Redirect/Get", "Answering a successful POST with a redirect so a refresh never resubmits."]], "d": "", "c": "", "tk": [], "q": []},
{"id": "4-2", "w": 4, "t": "File uploads", "v": "nP23R37lMxc", "s": "Uploads need <code>enctype=\"multipart/form-data\"</code> and arrive in <code>request.files</code>. The filename comes from the client, so clean it with <code>secure_filename</code>, allowlist extensions, cap the size, store under a generated name and serve with <code>send_from_directory</code>.", "tm": [["multipart/form-data", "The form encoding that can carry file bytes."], ["secure_filename", "Werkzeug helper that removes path tricks from a client filename."], ["Path traversal", "Using ../ in a name to escape the intended folder."], ["MAX_CONTENT_LENGTH", "Config limit; larger requests get 413."]], "d": "", "c": "", "tk": [], "q": []},
{"id": "4-3", "w": 4, "t": "Static files and Bootstrap", "v": "9At5sg-jPpU", "s": "Bootstrap is a CSS framework: you add class names and it supplies layout and components. Load it from a pinned CDN or serve it from <code>static/</code>, add the viewport tag, and use the 12-unit grid, form classes and alerts.", "tm": [["CSS framework", "A ready-made stylesheet with named classes."], ["CDN", "A public server hosting popular libraries."], ["Viewport tag", "The meta tag that makes pages use the real device width."], ["Grid", "Rows split into 12 units with breakpoint classes like col-md-6."]], "d": "", "c": "", "tk": [], "q": []},
{"id": "4-4", "w": 4, "t": "Sessions, cookies and flash messages", "v": "8jOgqA7nlLo", "s": "A cookie is text the browser stores and returns. Flask’s <code>session</code> is a signed (not encrypted) cookie that needs a secret key. <code>flash</code> uses it to show one-time messages after a redirect.", "tm": [["Cookie", "Small text stored by the browser and sent back with each request."], ["Session", "Data remembered about one visitor across requests."], ["Secret key", "The private value Flask uses to sign the session cookie."], ["Flash message", "A one-time note stored in the session and shown on the next page."]], "d": "", "c": "", "tk": [], "q": []},
{"id": "4-5", "w": 4, "t": "Project structure, config and Hub v1", "v": "nv45", "nv": 1, "s": "Split code so each module has one job: routes coordinate, validation checks, storage persists. Keep settings in a config class, secrets in environment variables, and generated files out of Git. Hub v1 combines forms, flash, sessions and Bootstrap.", "tm": [["Separation of concerns", "Each module has one clear responsibility."], ["Config class", "One place for settings, loaded with app.config.from_object."], ["Environment variable", "A setting stored outside the code, such as a secret key."], [".gitignore", "A list of files Git must not track."]], "d": "", "c": "", "tk": [], "q": []},
{"id": "5-1", "t": "Relational databases and SQLite", "s": "A database stores data safely and answers questions without loading everything. Tables have typed columns and rows, a primary key identifies each row, and Python’s <code>sqlite3</code> module connects, executes SQL, reads results and commits changes.", "tm": [["Table", "Rows and typed columns, like a strict spreadsheet."], ["Primary key", "A column whose value uniquely identifies each row."], ["Commit", "Makes the changes of a transaction permanent."], ["Placeholder", "A ? that safely carries a Python value into SQL."]], "w": 5, "v": "nv51", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "5-2", "t": "SELECT in depth and SQL injection", "s": "SELECT chooses columns, WHERE filters rows, ORDER BY sorts and LIMIT pages. NULL means unknown, so use IS NULL. Never build SQL from user text: use <code>?</code> placeholders for values and an allowlist for column names.", "tm": [["WHERE", "Keeps only the rows for which a condition is true."], ["NULL", "A missing or unknown value; compare with IS NULL."], ["LIKE", "Text pattern match using % and _."], ["SQL injection", "An attack where user text changes the meaning of a query."]], "w": 5, "v": "nv52", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "5-3", "t": "Changing data, constraints and transactions", "s": "INSERT, UPDATE and DELETE change data, and a missing WHERE changes every row. Constraints (NOT NULL, UNIQUE, CHECK, DEFAULT) are rules the database enforces, and a transaction makes several changes happen all together or not at all.", "tm": [["Constraint", "A rule the database enforces on every write."], ["Transaction", "A group of statements that succeed or fail as one unit."], ["Rollback", "Undoes everything since the transaction began."], ["ACID", "Atomic, Consistent, Isolated, Durable."]], "w": 5, "v": "nv53", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "5-4", "t": "Aggregates and GROUP BY", "s": "COUNT, SUM, AVG, MIN and MAX summarise many rows into one value and ignore NULL. GROUP BY gives one result row per group, WHERE filters rows before grouping, and HAVING filters groups after.", "tm": [["Aggregate", "A function that turns many values into one."], ["GROUP BY", "Splits rows into groups with one result row each."], ["HAVING", "Filters groups after the aggregates are computed."], ["CASE WHEN", "SQL’s if-else, useful inside SUM for conditional counts."]], "w": 5, "v": "nv54", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "5-5", "t": "SQLite in Flask and Hub v2", "s": "Open one SQLite connection per request, store it on <code>g</code> and close it in a teardown function. Keep the schema in <code>schema.sql</code>, create it with a custom <code>flask init-db</code> command, and test against a temporary database.", "tm": [["g", "A per-request object for storing things like the connection."], ["Teardown", "A function Flask calls when the request ends."], ["App context", "The environment that makes g and current_app available."], ["init-db", "A custom Flask command that creates the tables."]], "w": 5, "v": "nv55", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "6-1", "t": "Relationships and foreign keys", "s": "Splitting data into related tables stores each fact once. A foreign key holds another table’s primary key and guarantees no orphan rows, but SQLite only enforces it after <code>PRAGMA foreign_keys = ON</code>. <code>ON DELETE</code> decides what happens to children.", "tm": [["Foreign key", "A column holding the primary key of a row in another table."], ["Referential integrity", "No row may point at a parent that does not exist."], ["ON DELETE CASCADE", "Deleting the parent deletes its children."], ["Normalisation", "Storing each fact once, in the table it belongs to."]], "w": 6, "v": "nv61", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "6-2", "t": "Joins", "s": "A join matches rows across tables with an ON condition. INNER JOIN keeps only matches, LEFT JOIN keeps every left row with NULLs where nothing matches. Use COUNT(right.id) for zero counts and put right-table conditions in ON.", "tm": [["INNER JOIN", "Keeps only rows that match on both sides."], ["LEFT JOIN", "Keeps all left rows, filling NULL when there is no match."], ["Alias", "A short name for a table, used to qualify columns."], ["N+1 problem", "One query for a list plus one per row, instead of a join."]], "w": 6, "v": "nv62", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "6-3", "t": "Many-to-many relationships", "s": "A many-to-many relationship needs a junction table with two foreign keys and a composite primary key. Query through it with two joins, collapse with GROUP_CONCAT, and use HAVING COUNT(DISTINCT) for “has both” and NOT EXISTS for “has none”.", "tm": [["Junction table", "A table whose rows record which rows of two tables are linked."], ["Composite primary key", "A key made of several columns, unique as a pair."], ["Upsert", "Insert, or update if the key already exists."], ["EXISTS", "True when a subquery returns at least one row."]], "w": 6, "v": "nv63", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "6-4", "t": "Indexes and query plans", "s": "An index is a sorted B-tree that lets the database jump to rows instead of scanning the table. EXPLAIN QUERY PLAN shows SCAN or SEARCH. Indexes speed reads and slow writes, composite indexes follow the leftmost-prefix rule, and functions on a column defeat them.", "tm": [["Index", "A sorted structure that speeds up finding rows."], ["Full table scan", "Reading every row to test the condition."], ["EXPLAIN QUERY PLAN", "Shows how SQLite will run a query."], ["Leftmost prefix", "A composite index helps only if its first column is used."]], "w": 6, "v": "nv64", "nv": 1, "d": "", "c": "", "tk": [], "q": []},
{"id": "6-5", "t": "Schema design, migrations and Hub v3", "s": "Design from the description: nouns become tables and verbs become relationships. Evolve a live database with numbered migrations tracked in <code>PRAGMA user_version</code>, use the table-rebuild recipe when ALTER cannot do the job, back up first, and test migrations.", "tm": [["Migration", "A numbered script that moves a database to the next schema version."], ["user_version", "A SQLite integer used to record the schema version."], ["Table rebuild", "Create new, copy, drop old, rename, recreate indexes."], ["Backup API", "Makes a consistent copy of a database in use."]], "w": 6, "v": "nv65", "nv": 1, "d": "", "c": "", "tk": [], "q": []}
];
const K='pythonhub-v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({done:{},quiz:{},score:{},watched:{},time:{},log:{},days:{},theme:'dark',last:null},S||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};S.miss=S.miss||{};S.bk=S.bk||{};S.fc=S.fc||{};S.fcT=S.fcT||{};
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>ds(new Date()),nd=()=>Object.keys(S.done).length;
function streak(){let n=0,m=0,d=new Date();for(let i=0;i<400;i++){if(S.days[ds(d)]){n++;m=0}else if(++m>=2)break;d.setDate(d.getDate()-1)}return n}
function weekSecs(){const d=new Date(),k=(d.getDay()+6)%7;let t=0;for(let i=0;i<=k;i++){t+=S.log[ds(d)]||0;d.setDate(d.getDate()-1)}return t}
function ring(p,z){const c=2*Math.PI*26;return `<svg width="${z}" height="${z}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--ln)" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="var(--ac)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 32 32)" style="filter:drop-shadow(0 0 4px var(--ac))"/><text x="32" y="37" text-anchor="middle" fill="var(--tx)" font-size="14" font-weight="600">${Math.round(p*100)}%</text></svg>`}
const stat=(k,v)=>`<div class="card"><div class="mu">${k}</div><div class="big">${v}</div></div>`;
function home(){const nx=L.find(l=>!S.done[l.id]),cur=L.find(l=>l.id===S.last&&!S.done[l.id])||nx,sk=streak();
return `<section class="hero2"><div><div class="mu">${S.last?'Welcome back':'Welcome to PythonHub'}</div><h1>${cur?(S.last?'Pick up where you left off':'Start your first lesson'):'Week 1 is complete'}</h1>${cur?`<p class="lead">${cur.t}</p><a class="btn" href="#/l/${cur.id}">${S.last?'Continue learning':'Start learning'}</a>`:'<p class="lead">Week 2 is on its way.</p>'}</div><div class="rg">${ring(nd()/60,150)}<span class="mu">${nd()} of 60 lessons</span></div></section>
<div class="grid">${stat('Streak',sk+(sk==1?' day':' days'))}${stat('This week',(weekSecs()/3600).toFixed(1)+' / 5 h')}${stat('Lessons done',nd()+' / 60')}${stat('Videos watched',Object.keys(S.watched).length)}</div><h2>Your path</h2>${road()}`}
const road=()=>{const cw=(L.find(l=>!S.done[l.id])||{w:2}).w;return `<ol class="path">${W.map((t,i)=>{const ls=L.filter(l=>l.w==i+1),dn=ls.filter(l=>S.done[l.id]).length,st=ls.length&&dn==5?'done':i+1==cw?'now':'';return `<li class="${st}${ls.length?'':' soon'}"><span class="nd"></span><div class="mu">Week ${i+1}</div><h3>${t}</h3>${ls.length?`<div class="ls">${ls.map(l=>`<a href="#/l/${l.id}" class="${S.done[l.id]?'dn':''}">${S.done[l.id]?'✓':'○'} ${l.t}</a>`).join('')}</div>`:'<p class="mu">Coming soon</p>'}</li>`}).join('')}</ol>`};
function hl(c){const re=/(#.*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(def|return|import|from|class|if|elif|else|for|in|while|with|as|nonlocal|global|lambda|None|True|False|print|try|except|raise|pass)\b|(@\w+)|\b(\d+\.?\d*)\b/g;let o='',i=0,m;
while(m=re.exec(c)){o+=esc(c.slice(i,m.index));const k=m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'d':'n';o+=`<span class="t-${k}">${esc(m[0])}</span>`;i=re.lastIndex}return o+esc(c.slice(i))}

else if(t=='rnext'){const x=missed()[0];delete S.miss[x.key];if(!rv.ok)S.miss[x.key]=1;rv={k:null,ok:0};save();paint()}
else if(t=='bk'){const id=cur().id;S.bk[id]=!S.bk[id];if(!S.bk[id])delete S.bk[id];save();a.classList.toggle('on',!!S.bk[id]);a.querySelector('span').textContent=S.bk[id]?'Saved':'Save lesson'}
else if(t=='pv'){play(vids(cur())[+a.dataset.i])}
else if(t=='tsub'){const l=cur(),q=l.q[qs.i],v=nm($('#ta').value);if(!v)return;qs.good=q[2].split('|').some(x=>nm(x)==v);qs.k=0;const key=l.id+'|'+qs.i;if(qs.good){qs.ok++;delete S.miss[key]}else S.miss[key]=1;save();$('#tp').innerHTML=quizHtml(l)}
else if(t=='jump')document.getElementById(a.dataset.t).scrollIntoView({behavior:'smooth',block:'start'})
else if(t=='watched'){vids(cur()).forEach(x=>S.watched[x]=1);save();status()}});
document.addEventListener('change',e=>{if(e.target.id=='im'){const f=e.target.files[0];f&&f.text().then(x=>{try{Object.assign(S,JSON.parse(x));save();route();toast('Progress imported')}catch(err){alert('That file is not a valid PythonHub export.')}})}});
let tick=0;setInterval(()=>{if(curId&&!document.hidden){S.time[curId]=(S.time[curId]||0)+1;S.log[today()]=(S.log[today()]||0)+1;if(++tick%15==0)save()}},1000);
loadRich();window.addEventListener('hashchange',route);document.documentElement.dataset.theme=S.theme;chrome();route();
const ys=document.createElement('script');ys.src='https://www.youtube.com/iframe_api';document.head.appendChild(ys);
</script>
