===NOTES===
## What you will be able to do after this lesson
You will be able to write a subclass that reuses and extends a parent, call the parent's code with `super()`, decide between inheritance and composition, define `__repr__`, `__str__`, `__eq__` and operator methods so your objects behave like built-in types, and use `@property` to add validation and computed values without changing how callers use your class.

## Part 1: Inheritance
**Inheritance** lets a new class start from an existing one. The new class, the **subclass** (or child), gets all the attributes and methods of the **parent** (or base class), and can add or change things.
```python
class Robot:
    def __init__(self, name):
        self.name = name
        self.battery = 100

    def describe(self):
        return f"{self.name} (battery {self.battery}%)"

class Drone(Robot):
    def __init__(self, name):
        super().__init__(name)
        self.altitude = 0

    def ascend(self, meters):
        self.altitude += meters

d = Drone("Sky")
d.ascend(30)
print(d.describe())      # Sky (battery 100%)   <- inherited
print(d.altitude)        # 30
```
Read the new parts:
- `class Drone(Robot):` the parent in parentheses means "a Drone **is a** Robot".
- `super().__init__(name)` calls the parent's `__init__` so the robot part of the object gets set up. `super()` means "the parent class, seen from here".
- If you skip that line, `name` and `battery` are never created, and `d.describe()` fails with `AttributeError: 'Drone' object has no attribute 'name'`.
- Use `isinstance(d, Robot)` to ask whether an object belongs to a class **or any of its subclasses**; here it is `True`. `type(d) == Robot` is `False`, because `type` demands the exact class.

## Part 2: Overriding and extending
A subclass can **override** a method by defining one with the same name. Using `super()` you can keep the parent's behaviour and add to it:
```python
class Drone(Robot):
    def describe(self):
        return super().describe() + f", altitude {self.altitude}m"
```
Two routes exist, with different outcomes. If you do not call `super()`, the child's method completely **replaces** the parent's. If you do, the child **extends** it, which also means that later changes to the parent's version reach the child automatically. Prefer extending unless the behaviour genuinely differs.

## Part 3: Inheritance or composition?
Inheritance models **"is-a"**: a Drone is a Robot. **Composition** models **"has-a"**: a Robot *has a* Battery. For has-a relationships, store the other object as an attribute:
```python
class Robot:
    def __init__(self, name, battery):
        self.name = name
        self.battery = battery      # a Battery object from Lesson 2-1
```
Choose inheritance only when the child can honestly stand in for the parent everywhere. Overusing it creates tangled hierarchies where a change in the parent breaks distant children. A good habit is to try composition first.

## Part 4: Dunder methods
Python calls certain specially named methods for you in certain situations. They begin and end with two underscores, so they are called **dunder** (double-underscore) or magic methods. You rarely call them yourself. You define them so that built-in operations work on your objects.

### `__repr__` and `__str__`: how an object is displayed
```python
class Robot:
    def __init__(self, name):
        self.name = name

    def __repr__(self):
        return f"Robot({self.name!r})"

    def __str__(self):
        return f"Robot named {self.name}"

r = Robot("Rover")
print(r)          # Robot named Rover   (print uses __str__)
print([r])        # [Robot('Rover')]    (containers use __repr__)
```
`__repr__` is for **developers**: unambiguous, ideally looking like the code that would recreate the object. `__str__` is for **users**: friendly. If you define only one, define `__repr__`, because `print` falls back to it when `__str__` is missing. The `!r` inside the f-string means "use the repr of this value", which adds the quotes around a string.

### `__eq__`: what "equal" means
```python
    def __eq__(self, other):
        return isinstance(other, Robot) and self.name == other.name
```
This replaces the default identity comparison from Lesson 2-1. A side effect to know: once you define `__eq__` without `__hash__`, Python sets `__hash__` to `None`, so your objects can no longer be dictionary keys or set members and you get `TypeError: unhashable type`. For objects you intend to compare by value, that is often acceptable, and you can add a `__hash__` later if needed.

### Operators and built-ins
```python
class Vector2:
    def __init__(self, x, y):
        self.x, self.y = x, y

    def __add__(self, other):
        return Vector2(self.x + other.x, self.y + other.y)

    def __len__(self):
        return 2

print(Vector2(1, 2) + Vector2(3, 4))      # uses __add__
print(len(Vector2(1, 2)))                 # 2, uses __len__
```
`a + b` is translated to `a.__add__(b)`. Likewise `len(x)` calls `x.__len__()`, and `a == b` calls `a.__eq__(b)`. The purpose of all of these is one idea: your objects can look and behave like built-in types.

## Part 5: Properties
Suppose `battery` must stay between 0 and 100. With a plain attribute anyone can write `r.battery = 500`. A **property** lets you run code on read and write while callers still write plain `r.battery`:
```python
class Robot:
    def __init__(self, name):
        self.name = name
        self._battery = 100

    @property
    def battery(self):                 # runs on: r.battery
        return self._battery

    @battery.setter
    def battery(self, value):          # runs on: r.battery = value
        if not 0 <= value <= 100:
            raise ValueError("battery must be 0-100")
        self._battery = value
```
The leading underscore in `_battery` is a convention meaning "internal, do not touch from outside". The property named `battery` is the public door. The big benefit: you can begin with a simple attribute and add rules later **without changing any code that uses it**, because the syntax for callers stays the same.

A property with no setter is **read-only**, which suits computed values:
```python
    @property
    def percent_label(self):
        return f"{self._battery}%"
```
The most common mistake is writing `self.battery = value` inside the setter. That calls the setter again, which calls it again, and you get `RecursionError: maximum recursion depth exceeded`. Always store the data under a different name, such as `self._battery`.

## Part 6: How this connects to Flask
Flask code leans on this lesson constantly. Database models inherit from a base class (`class User(db.Model)`), forms inherit from `FlaskForm`, and almost every model defines a `__repr__` so debugging output is readable. Later you will use a property to store a password so that reading is blocked and writing automatically hashes it.

## Recap
- A subclass inherits from its parent, and `super()` calls the parent's code. Always call `super().__init__(...)` when you define your own `__init__`.
- Overriding replaces; calling `super()` inside extends.
- Use inheritance for "is-a" and composition for "has-a".
- Dunder methods let objects work with `print`, `==`, `+` and `len`. Define `__repr__` first.
- `@property` and `@name.setter` add validation behind plain attribute syntax. Never assign to the same name inside its own setter.
===TASKS===

===NOTES===
## What you will be able to do after this lesson
You will be able to read a traceback and say what went wrong and where, handle errors with `try`, `except`, `else` and `finally`, raise your own exceptions (including your own exception classes), choose between checking first and handling afterwards, split code across files with `import`, and explain the `if __name__ == "__main__"` line you have been seeing.

## Part 1: What an exception is
When Python cannot continue, it stops and raises an **exception**: an object describing the problem. If nothing handles it, the program ends and Python prints a **traceback**:
```python
def ratio(a, b):
    return a / b

print(ratio(1, 0))
```
```
Traceback (most recent call last):
  File "demo.py", line 4, in <module>
    print(ratio(1, 0))
  File "demo.py", line 2, in ratio
    return a / b
ZeroDivisionError: division by zero
```
Read it from the **bottom**. The last line has the exception type (`ZeroDivisionError`) and a message. The lines above are the chain of calls that led there, oldest first, each with a file, line number and the code. The last code line is where it happened (`return a / b`), and the one above it shows who called it. Most debugging is just reading this carefully.

## Part 2: Handling exceptions
```python
def read_speed(text):
    try:
        speed = float(text)
    except ValueError:
        print("Not a number, using 0")
        return 0.0
    else:
        return speed
    finally:
        print("done")
```
Each block has a role:
- `try:` holds the code that might fail. Keep it small, so you know which line caused a problem.
- `except ValueError:` runs **only if** a `ValueError` is raised in the try block. The program then continues normally.
- `else:` runs only if the try block raised **nothing**.
- `finally:` runs **always**, whether or not there was an error, even when the block returns. It is for cleanup, such as closing a connection.

Prediction practice: `read_speed("5")` prints `done` and returns `5.0`. `read_speed("x")` prints the message, then `done`, and returns `0.0`.

Useful variations:
```python
except (ValueError, TypeError):      # one handler for several types
    ...
except ValueError as e:              # keep the exception object
    print(type(e).__name__, e)       # ValueError could not convert string to float: 'x'
```
**Be specific.** A bare `except:` (or `except Exception:` used lazily) catches every error, including your own typos, and even Ctrl+C in the bare case. The program then carries on in a broken state and the real bug is hidden. Catch only what you expect and know how to handle.

## Part 3: Raising your own exceptions
Use `raise` to signal that something is wrong:
```python
def drive(self, km):
    if km < 0:
        raise ValueError("distance cannot be negative")
```
For problems specific to your program, define your own exception class. It is just a class that inherits from `Exception`, which you now understand:
```python
class LowBattery(Exception):
    pass

def drive(self, km):
    if self.battery < km * 2:
        raise LowBattery(f"need {km * 2}%, have {self.battery}%")
```
Callers can now catch exactly this case with `except LowBattery:`. A bare `raise` inside an `except` block re-raises the current exception, which is useful when you want to log it and still let it propagate.

## Part 4: The built-in exceptions you will meet
- `ValueError`: right type, wrong value, like `int("abc")`.
- `TypeError`: wrong type or wrong number of arguments, like `"a" + 1`.
- `KeyError`: a dictionary key is missing, like `d["missing"]`.
- `IndexError`: a list index is out of range.
- `AttributeError`: the object has no such attribute.
- `FileNotFoundError`: the path does not exist (more in the next lesson).
- `ModuleNotFoundError`: `import` could not find the module.

## Part 5: Look first, or handle afterwards?
Two styles exist, with different outcomes:
```python
# LBYL: "look before you leap"
if "speed" in config:
    speed = config["speed"]
else:
    speed = 1

# EAFP: "easier to ask forgiveness than permission"
try:
    speed = config["speed"]
except KeyError:
    speed = 1
```
Python favours EAFP when failure is rare and the check would be awkward. Checking first can also be wrong if something changes between the check and the action, such as a file deleted by another program. Use LBYL when the check is simple and the failure is common.

## Part 6: Modules and imports
Every `.py` file is a **module**. Another file can use its contents with `import`:
```python
# helpers.py
def clamp(v, lo, hi):
    return max(lo, min(v, hi))

# main.py
import helpers
print(helpers.clamp(150, 0, 100))      # 100

from helpers import clamp              # import one name directly
import helpers as h                    # shorter alias
```
What happens at `import`: Python searches for the module (the current folder first, then installed packages), **runs the file once from top to bottom**, and stores the result so later imports reuse it. Because the file runs on import, any print statement or loop at the top of a module runs when imported.

That is the purpose of this guard:
```python
if __name__ == "__main__":
    main()
```
Python sets `__name__` to the string `"__main__"` only when the file is executed directly (`python main.py`). When the file is imported, `__name__` is the module name instead, so the guarded code is skipped. It lets one file be both a reusable module and a runnable script.

A **package** is a folder of modules, usually containing an `__init__.py` file, imported as `from mypackage import tools`.

Two traps to know: naming your file the same as a library (`random.py`, `json.py`) makes `import random` load **your** file instead, because the current folder is searched first. And two modules importing each other creates a circular import error, which you fix by moving shared code to a third module.

## Part 7: How this connects to Flask
Flask projects are packages of modules: routes in one file, models in another. `from flask import Flask` is exactly the import form above, and the `__name__` you pass to `Flask(__name__)` is the module-name variable from the guard. You will also register your own error pages with `@app.errorhandler(404)` and use `abort(404)` to raise HTTP errors, which are exceptions under the hood.

## Recap
- Read tracebacks from the bottom; the last line says what, the lines above say where.
- `try` holds risky code, `except` handles named errors, `else` runs on success, `finally` always runs.
- Catch specific exceptions; never use a bare `except`.
- Define your own exceptions by inheriting from `Exception`.
- `import` runs a module once; the `__main__` guard separates running from importing.
===TASKS===

HINT: Put only the division inside `try`.
EXPECT: `2.0` and `None`.
SOL:

print(safe_ratio(1, 0))   # None

    pass

        self.battery = 100

            raise LowBattery(f"need {km * 2}%, have {self.battery}%")
        self.battery -= km * 2

    r.drive(100)

### Fix the three bugs | debugging
(a) A `try` block wrapping twenty lines ends with a bare `except: pass`, and a typo in one line never shows. (b) You created `random.py` in your project and now `import random` behaves strangely. (c) A module has `print("loading")` and `run()` at the top level, and importing it starts the program. Explain each cause and the fix.

SOL:
(a) A bare except hides every error. Keep `try` small, catch the specific exception, and let others propagate.
(b) The current folder is searched first, so your file shadows the standard library. Rename it.
(c) Top-level code runs on import. Move the call into `if __name__ == "__main__": run()`.
### Two-file project | challenge
Create `geometry.py` with `area(w, h)` that raises `ValueError` for negative values, and `main.py` that imports it, asks the user for two numbers, catches `ValueError` for both bad text and negatives, and prints a friendly message. Guard the entry point.
HINT: `float("x")` and your own `raise` both produce `ValueError`, so one `except` can cover both.
EXPECT: Valid numbers print the area; text or negatives print a message and the program ends normally.
SOL:

    if w < 0 or h < 0:
        raise ValueError("sides must not be negative")

# main.py

def main():
    try:
        w = float(input("Width: "))
        h = float(input("Height: "))
        print(area(w, h))
    except ValueError as e:

if __name__ == "__main__":

Q: What does this print?

- `try`

- `try` then `finally`

Q: Which exception is raised when you read a dictionary key that does not exist?

WHY: `d["missing"]` raises `KeyError`. Use `d.get("missing")` if you want `None` instead.
Q: What does this print?

except ValueError:

- `a`, `c` *

Q: Why is a bare `except:` considered bad practice?

Q: What does this print?

    result = 10 / 0

Q: You save a file called `random.py` in your project and then run `import random`. What most likely happens?

Q: What does EAFP mean in Python style?

Q: Which variable equals `"__main__"` when a file is run directly with `python file.py`?

===NOTES===
## What you will be able to do after this lesson
You will be able to build file paths that work from any folder, read and write text files safely with `with open(...)`, explain what each file mode does to existing data, convert Python data to JSON and back, diagnose the typical file and JSON errors, and combine functions, classes, exceptions and files into a complete command-line quiz app, which is this week's assignment.

## Part 1: Paths, and why "file not found" happens so often
A **path** says where a file is. An **absolute path** starts from the root of the drive (`C:\Users\you\hub\questions.json`). A **relative path** (`questions.json`) is interpreted from the **current working directory**, the folder your terminal is in when you run the program, which is not necessarily the folder holding your script. That mismatch is the cause of most `FileNotFoundError` messages.

The `pathlib` module makes paths safe and readable:
```python
from pathlib import Path

BASE = Path(__file__).parent          # the folder that contains this script
QUESTIONS = BASE / "questions.json"   # the / operator joins path parts

print(QUESTIONS.exists())             # True or False
```
`__file__` is the location of the current script, `.parent` is its folder, and `/` joins pieces using the right separator for your system. On Windows, avoid writing `"C:\new\test.txt"` as a plain string, because `\n` and `\t` become newline and tab characters. Using `Path` and forward slashes sidesteps the problem.

## Part 2: Reading and writing text files
```python
with open("notes.txt", "w", encoding="utf-8") as f:
    f.write("first line\n")
    f.write("second line\n")

with open("notes.txt", encoding="utf-8") as f:
    text = f.read()            # whole file as one string
```
Read the call piece by piece:
- `open(path, mode, encoding=...)` returns a **file object**.
- `with ... as f:` is a **context manager**. When the block ends, even if an error occurs, Python closes the file for you. Without it, a forgotten `close()` can lose data or lock the file.
- `encoding="utf-8"` states how characters are stored as bytes. Always specify it, because a different default on another machine can corrupt non-English text.

The **mode** decides what happens to existing content, and getting this wrong destroys data:
- `"r"` read (the default). Raises `FileNotFoundError` if the file does not exist.
- `"w"` write. **Creates the file or erases it** if it exists. Opening the wrong file with `"w"` wipes it instantly.
- `"a"` append. Adds to the end and keeps what is there.
- `"x"` create new. Raises `FileExistsError` if it already exists, which protects against accidental overwrite.

Reading options: `f.read()` returns everything, `f.readline()` returns one line, and iterating `for line in f:` handles one line at a time without loading the whole file, which is best for large files.

## Part 3: JSON
**JSON** (JavaScript Object Notation) is a text format for structured data, and it is the language of web APIs. It looks like Python dictionaries and lists, with strict rules:
```
{"name": "Rover", "battery": 80, "online": true, "tags": ["a", "b"], "owner": null}
```
- Keys and strings need **double** quotes. Single quotes are invalid.
- No trailing commas, no comments.
- `true`, `false` and `null` are lowercase.

Python maps to JSON like this: `dict` to object, `list` and `tuple` to array, `str` to string, `int` and `float` to number, `True`/`False` to `true`/`false`, and `None` to `null`.

There are four functions, and the names tell you what they do. The `s` stands for **string**:
```python
import json

text = json.dumps({"a": True, "b": None})    # Python -> JSON string:  '{"a": true, "b": null}'
data = json.loads(text)                      # JSON string -> Python

with open("data.json", "w", encoding="utf-8") as f:
    json.dump(data, f, indent=2)             # Python -> file (pretty-printed)

with open("data.json", encoding="utf-8") as f:
    data = json.load(f)                      # file -> Python
```
Two errors to recognise:
- `json.JSONDecodeError`: the text is not valid JSON (single quotes, a trailing comma, a cut-off file).
- `TypeError: Object of type set is not JSON serializable`: JSON has no set, date or custom-object type. Convert first (`list(my_set)`) or pass `default=str` to `dump`.

## Part 4: A small persistence pattern
Real programs wrap loading and saving in two functions that handle the awkward cases once:
```python
def load_json(path, default):
    if not path.exists():
        return default
    try:
        with open(path, encoding="utf-8") as f:
            return json.load(f)
    except json.JSONDecodeError:
        return default

def save_json(path, data):
    with open(path, "w", encoding="utf-8") as f:
        json.dump(data, f, indent=2)
```
Notice the design decision: a missing or corrupt file returns a sensible default instead of crashing, because for a high-score file that is the friendlier behaviour. For a file that must exist, you would let the exception propagate instead. Choosing which is a judgement about the situation.

## Part 5: This week's assignment, a command-line quiz app
You now have every tool for this project. The requirements:
- `questions.json` holds a list of questions, each with `question`, `options` (a list) and `answer` (the index of the correct option).
- The program loads them, asks each in turn, accepts a number from the user, and re-asks if the input is invalid.
- It prints the final score, and saves the best score in `scores.json`, announcing a new high score.
- Functions each do one job, errors are handled with specific exceptions, the file paths use `pathlib`, and the entry point is guarded.

A suggested design is `load_json`, `save_json`, `ask(item)`, `run()`. A sample data file to start from:
```
[
  {"question": "Which keyword defines a function?", "options": ["func", "def", "lambda"], "answer": 1},
  {"question": "What type is *args?", "options": ["list", "tuple", "dict"], "answer": 1}
]
```
Stretch goals: shuffle the questions with `random.shuffle`, add a timer using the decorator from Week 1, or turn the quiz into a `Quiz` class.

## Part 6: How this connects to Flask
In Week 9 your API will accept and return JSON constantly: `request.get_json()` reads it and `jsonify(...)` produces it, using exactly the rules above. And the `load_json`/`save_json` pair is a first, simple version of storing data, which Week 5 will upgrade to a proper database.

## Recap
- Build paths with `pathlib`, relative to `Path(__file__).parent`, to avoid working-directory surprises.
- Use `with open(..., encoding="utf-8")`. `"w"` erases, `"a"` appends, `"x"` refuses to overwrite.
- JSON needs double quotes and has no sets or dates. `dump`/`load` work with files, `dumps`/`loads` with strings.
- Handle missing and corrupt files deliberately, with specific exceptions.

===NOTES===
## What you will be able to do after this lesson
You will be able to take any web address apart and say what each piece means, describe what a browser and a server say to each other during one page visit, choose the right HTTP method for an action and explain why, read status codes by family and by common number, explain why HTTP being stateless is the reason cookies exist, and inspect real requests in your browser and in Python.

## Part 1: Clients, servers, and a URL
The web is a conversation. A **client** (usually your browser) asks for something, and a **server** (a program on another computer, which will soon be your Flask app) answers. Every exchange has the same two halves: a **request** from the client and a **response** from the server. The rules for how they are written are called **HTTP** (HyperText Transfer Protocol).

First, the address. Take this URL and break it up:
```
https://hub.example:8000/lessons/3?page=2&sort=asc#intro
```
- `https` is the **scheme**, the protocol. HTTPS is HTTP with encryption added.
- `hub.example` is the **host**, which DNS translates into a numeric IP address.
- `:8000` is the **port**, a numbered door on that machine. If omitted, HTTP uses 80 and HTTPS uses 443.
- `/lessons/3` is the **path**, which says which resource you want. Flask routes on this.
- `?page=2&sort=asc` is the **query string**, extra named values after a `?`, separated by `&`.
- `#intro` is the **fragment**. It is used only by the browser to scroll to a section and is **never sent to the server**.

## Part 2: What a request and a response look like
Underneath, both are plain text. A request:
```
GET /lessons/3?page=2 HTTP/1.1
Host: hub.example
Accept: text/html
Cookie: session=abc123
```
The first line is the **request line**: the **method** (what to do), the path with its query, and the HTTP version. The following lines are **headers**: labelled pieces of metadata. `Host` names the site, `Accept` says which formats the client understands, and `Cookie` returns data the server stored earlier. Some requests also carry a **body** after a blank line, such as the data from a submitted form.

The server's response has the same shape:
```
HTTP/1.1 200 OK
Content-Type: text/html; charset=utf-8
Set-Cookie: session=abc123

<h1>Lesson 3</h1>
```
The first line is the **status line**, with a numeric **status code** and a short reason. The headers describe the content (`Content-Type` tells the browser how to display it). After the blank line comes the **body**, the actual page. In Flask, the string your view returns becomes the body, and Flask fills in the status and headers for you.

## Part 3: Methods, and why the choice matters
The **method** states the intent of a request:
- `GET`: fetch something. It must not change anything on the server.
- `POST`: send data to be processed, such as submitting a form or creating an account.
- `PUT` / `PATCH`: replace or partially update an existing item.
- `DELETE`: remove an item.

The rule that matters most: **GET must be safe.** Browsers, search engines and link-preview tools freely request GET URLs, sometimes in advance, without you clicking. If a link like `/delete-account` used GET, a crawler or a prefetching browser could trigger it. State-changing actions use POST (or the other methods), which a browser only sends when a form or script deliberately does it.

A second practical difference: a GET form puts its data in the URL (`?email=a@b.com`), where it lands in history, bookmarks and server logs. A POST form puts it in the body. That is why a password form must never use GET.

## Part 4: Status codes
The first digit tells you the family:
- **2xx success:** `200 OK`, `201 Created`.
- **3xx redirection:** `301` (moved permanently), `302` (moved temporarily). The response includes a `Location` header, and the browser goes there.
- **4xx client error, the request was wrong:** `400 Bad Request`, `401 Unauthorized` (you are not identified, so log in), `403 Forbidden` (we know who you are, but you may not), `404 Not Found`, `405 Method Not Allowed` (that URL exists but not for this method).
- **5xx server error, our code failed:** `500 Internal Server Error`.

The split between 4xx and 5xx is a debugging compass. A 404 means check the URL and your routes. A 500 means a bug, probably an unhandled exception in your Python, and the Flask terminal shows its traceback.

## Part 5: Stateless, and the cookie workaround
**HTTP is stateless**: the server treats every request as a stranger. It does not remember that you logged in one second ago. Websites solve this with a **cookie**: the server includes a `Set-Cookie` header in a response, the browser stores it, and then sends it back in a `Cookie` header on every later request to that site. The cookie carries an identifier, so the server can recognise you. Logins, shopping carts and "remember me" are all built on this, and you will implement it in Week 4.

## Part 6: Seeing it for yourself
Open any website, press **F12**, choose the **Network** tab, refresh, and click a request. You will see the method, status code and headers exactly as described. From Python you can do the same with the `requests` library:
```python
import requests

r = requests.get("https://example.com")
print(r.status_code)                 # 200
print(r.headers["Content-Type"])     # text/html
print(r.text[:60])                   # the start of the body
```
In PowerShell, `curl.exe -i https://example.com` prints the raw status line and headers. (Use `curl.exe`, because plain `curl` is an alias for a different PowerShell command.)

## Part 7: How this connects to Flask
Everything in this lesson appears in your Flask code. `@app.route("/lessons")` matches the **path**. A view's return value becomes the **body**, and `return "Not found", 404` sets the **status**. In views you will read the method with `request.method` and the query string with `request.args`, and `redirect()` produces a 3xx response. Flask is a tool for writing HTTP responses, so now you know exactly what it is writing.

## Recap
- URL = scheme, host, port, path, query, fragment. The fragment never reaches the server.
- A request has a method, path, headers and an optional body; a response has a status, headers and a body.
- GET reads and must be safe; POST and the others change things.
- 2xx success, 3xx redirect, 4xx client error, 5xx server error.
- HTTP is stateless, so cookies carry identity between requests.

### Diagnose three situations | debugging
(a) A login form sends the password as part of the URL. (b) A request returns `405 Method Not Allowed` on a page that opens fine in the browser. (c) One page shows `404` and another `500`. For each, say what it tells you and where you would look first.

### Parse a raw response | challenge
Write `parse_response(raw)` that takes a raw HTTP response string (lines separated by `\r\n`) and returns a tuple `(status_code, headers, body)`, where headers is a dictionary with lowercase names.
HINT: Split the head from the body at the first blank line using `partition("\r\n\r\n")`, and split the status line on spaces with at most two splits.
EXPECT: The asserts pass.
SOL:
```python
def parse_response(raw):
    head, _, body = raw.partition("\r\n\r\n")
    lines = head.split("\r\n")
    version, code, reason = lines[0].split(" ", 2)
    headers = {}
    for line in lines[1:]:
        name, _, value = line.partition(":")
        headers[name.strip().lower()] = value.strip()
    return int(code), headers, body

raw = "HTTP/1.1 200 OK\r\nContent-Type: text/html\r\n\r\n<h1>Hi</h1>"
assert parse_response(raw) == (200, {"content-type": "text/html"}, "<h1>Hi</h1>")
```
===QUIZ===
Q: In the URL `https://hub.example:8000/lessons?page=2#intro`, which parts are sent to the server in the request?
- Everything, including `#intro`
- The path and query string, but not the fragment `#intro` *
- Only the host name
- Only the path
WHY: The fragment is used by the browser alone, for example to scroll to a heading. The path and query travel in the request line.
Q: Which status code means the requested page was not found?
TYPE: 404
WHY: 404 is a client error: the URL did not match anything. A 500 would mean the server itself failed.
Q: What is the difference between `401` and `403`?
- 401 means a server crash and 403 means a missing page
- 401 means you are not identified (log in), while 403 means you are identified but not allowed *
- They are identical
- 403 means the page moved
WHY: The two codes describe different problems. 401 asks for credentials, and 403 refuses even though the server knows who you are.
Q: Why should an action such as deleting an account not be triggered by a GET request?
- GET requests are slower
- GET is expected to be safe, and browsers and crawlers may request GET URLs without a deliberate click *
- GET cannot carry a URL
- Browsers block GET requests that contain the word delete
WHY: Prefetching, link previews and crawlers all issue GET requests freely, so a destructive GET can fire by accident.
Q: In the request line `POST /login HTTP/1.1`, what is `/login`?

- The path of the requested resource *
- The HTTP version
- A header
WHY: The request line has three parts in order: method, path (with query), version.
Q: Which response header tells the browser to store a cookie?
TYPE: Set-Cookie
WHY: The browser saves the cookie and sends it back in a `Cookie` header on later requests to the same site.
Q: What does it mean that HTTP is stateless, and what follows from it?
- The server cannot send data
- Each request is independent, so identity must be sent again on every request, usually in a cookie *
- Requests are not encrypted
- The server remembers every visitor automatically
WHY: With no built-in memory, a site recognises you only because the browser sends an identifying cookie each time.
Q: What does a `302` status with a `Location` header make the browser do?

- 500 *

Q: What is the default port of Flask's development server?

===NOTES===
## What you will be able to do after this lesson
You will be able to set up a Flask project from nothing, explain every line of a minimal app, run it in two different ways and say how they differ, explain what debug mode does and why it must never be switched on in production, return text, HTML, tuples and dictionaries from views, test your app from Python without opening a browser, and diagnose the four setup errors that stop most beginners.

## Part 1: Setting up
Everything from Lesson 1-1 pays off now. In PowerShell:
```powershell
mkdir hub-v0
cd hub-v0
python -m venv .venv
Set-ExecutionPolicy -Scope Process -ExecutionPolicy RemoteSigned
.venv\Scripts\Activate.ps1
python -m pip install flask
python -m pip freeze > requirements.txt
```
Then create a file called `app.py` in that folder. A warning that saves hours: **never name your file `flask.py`.** Python searches the current folder first, so your file would shadow the real library and you would get an import error.

## Part 2: The smallest Flask app
```python
from flask import Flask

app = Flask(__name__)

@app.route("/")
def home():
    return "Hello from PythonHub"

if __name__ == "__main__":
    app.run(debug=True)
```
Take it line by line:
- `from flask import Flask` imports the class that represents a web application.
- `app = Flask(__name__)` creates an **instance** of that class (Lesson 2-1). `__name__` is the module-name variable from Lesson 2-4. Flask uses it to know where your file lives, so it can find the `templates` and `static` folders next to it.
- `@app.route("/")` is a **decorator with an argument** (Lesson 1-5). It registers the function below as the handler for the path `/`. Without it, the function exists but no URL leads to it.
- `def home():` is the **view function**. Its name is also the route's identity, which is why `url_for("home")` will work later. Names must be unique.
- `return "Hello from PythonHub"` sends the response body. Flask adds the status `200 OK` and a `text/html` content type automatically.
- The guard `if __name__ == "__main__":` runs `app.run` only when you execute the file directly, which is the same guard you learned last week.

## Part 3: Running it, two routes
**Route A, run the file:** `python app.py`. The `app.run(debug=True)` line starts the server.

**Route B, use the Flask command:** `flask --app app run --debug`. Here `--app app` means "the module named `app`", which is your `app.py`. With this route you do not need the `app.run` line at all, and it is the form recommended in current documentation. Older tutorials set an environment variable instead (`$env:FLASK_APP="app.py"`), and both work.

Either way you will see something like:
```
* Running on http://127.0.0.1:5000
```
`127.0.0.1` is the address that always means "this computer" (also called `localhost`), and `5000` is the port. Open that address in your browser to see your page. Stop the server with **Ctrl+C**. If port 5000 is busy you get "Address already in use", and you can pick another with `--port 5001`.

## Part 4: Debug mode
`debug=True` (or `--debug`) switches on two helpers:
- The **reloader** restarts the server every time you save a file, so you see changes at once.
- The **debugger** shows an interactive traceback page in the browser when a view raises an exception.

The debugger is powerful enough to execute Python code on your machine. That is perfect on your laptop and **dangerous on a public server**, because anyone who could reach it could run code. Never deploy with debug on. In Week 11 you will run a proper production server instead.

## Part 5: What happens when you visit a page
1. Your browser sends `GET /` to `127.0.0.1:5000`.
2. Flask's server receives the request and looks for a route matching the path.
3. It finds `home` and calls it.
4. Flask turns the returned value into a response and sends it back.

Visit `/missing` and Flask finds no matching route, so it answers with **404 Not Found** automatically. Raise an exception inside a view and you get a **500**, with the traceback in your terminal.

## Part 6: What a view can return
```python
@app.route("/html")
def html():
    return "<h1>Big title</h1><p>The browser renders this.</p>"

@app.route("/created")
def created():
    return "Made it", 201               # a tuple: (body, status code)

@app.route("/api/status")
def status():
    return {"status": "ok", "lessons": 60}   # a dict becomes JSON
```
A string is sent as HTML, so tags render. A tuple lets you set the status code. A dictionary is converted to JSON with the right `Content-Type`, which is how you will build APIs in Week 9. Returning nothing at all (`None`) is an error, so every path through a view must return something. This is the same print-versus-return lesson from Week 1: printing in a view shows text in your terminal, not in the browser.

## Part 7: Testing without a browser
Flask gives you a **test client**, a fake browser that calls your app directly:
```python
client = app.test_client()
resp = client.get("/api/status")
print(resp.status_code)        # 200
print(resp.get_json())         # {'status': 'ok', 'lessons': 60}
```
This is how professionals test: repeatable, fast, and with no server running. You will use it with `assert` all through the course.

## Part 8: The four errors that stop beginners
- **`ModuleNotFoundError: No module named 'flask'`:** the virtual environment is not active, or Flask is not installed in it. Activate `.venv` and run `python -m pip install flask`.
- **`Address already in use`:** another program, often an earlier copy of your own server, holds the port. Close it or use `--port 5001`.
- **`ImportError: cannot import name 'Flask' from partially initialized module 'flask'`:** you named your file `flask.py`. Rename it.
- **`Error: Could not locate a Flask application`:** `flask run` could not find your app. Add `--app app` so it knows which module to load.

## Recap
- A Flask app is an instance of `Flask`, created with `Flask(__name__)`.
- `@app.route(path)` registers a view function for a URL path, and the view's return value becomes the response.
- Run it with `python app.py` or `flask --app app run --debug`. The address is `http://127.0.0.1:5000`.
- Debug mode gives auto-reload and an interactive debugger, and must never be used in production.
- Strings return HTML, tuples set the status code, dictionaries become JSON, and the test client lets you check all of it with code.

===NOTES===
## What you will be able to do after this lesson
You will be able to explain how Flask decides which function handles a request, capture values from the URL and validate them with converters, accept more than one HTTP method on a route and say what happens when a method is not allowed, read query strings, build links with `url_for`, send redirects and errors on purpose, and list every route in your app with one command. You will also be able to predict, before running anything, what a given URL will return.

This lesson is the vocabulary of every Flask app you will ever write. Pages, forms, APIs and logins are all just routes.

## Part 1: What a route is
A **route** is a rule that maps a URL path to a Python function. The function is called a **view** (or handler). Flask keeps all your rules in one structure called the **URL map**.

When a request arrives, Flask takes the **path** (the part after the host and before any `?`, as you saw in Lesson 3-1) and compares it with the rules in the URL map. Three outcomes are possible:
- A rule matches and allows the request's method: Flask calls the view and sends what it returns.
- No rule matches the path: Flask answers **404 Not Found** without calling any of your code.
- A rule matches the path but not the method: Flask answers **405 Method Not Allowed**.

```python
@app.route("/")
def home():
    return "Home"

@app.route("/about")
def about():
    return "About"
```
These are **static routes**: the path is fixed text. They work, but you cannot build a site with 60 lessons by writing 60 functions. That is why routes can contain variable parts.

## Part 2: Dynamic routes
A **dynamic route** contains a variable part written in angle brackets. Flask captures whatever text sits in that position and passes it to your function as an argument.
```python
@app.route("/hello/<name>")
def hello(name):
    return f"Hello, {name}!"
```
Read the syntax carefully:
- `<name>` means "capture this segment of the path and call it `name`".
- The word inside the brackets must **exactly match the parameter name** in `def hello(name)`. Flask calls `hello(name="Ada")`, passing it by keyword. If your function said `def hello(username)`, Flask would raise `TypeError: hello() got an unexpected keyword argument 'name'` and the browser would show a 500 error.

What the rule matches:
- `/hello/Ada` calls `hello("Ada")` and returns `Hello, Ada!`.
- `/hello/` is a **404**, because the variable part cannot be empty.
- `/hello/Ada/Lovelace` is a **404**, because the default converter stops at a slash, so the extra segment has no rule to match.

## Part 3: Converters, and why they matter
A **converter** tells Flask what kind of text is allowed in a variable part and what Python type to deliver. The syntax is `<converter:name>`.
- `string` is the default. It accepts any text without a slash and gives you a `str`.
- `int` accepts digits only and gives you an `int`. It does not match `-5` or `abc`.
- `float` accepts numbers with a decimal point, such as `3.5`. The plain `3` does not match.
- `path` is like `string` but also accepts slashes, which is useful for file paths.
- `uuid` accepts a UUID and gives you a `uuid.UUID`.

**Two routes to the same goal.** Suppose you want `/lesson/3` to show lesson 3.

Route A, let Flask validate:
```python
@app.route("/lesson/<int:lesson_id>")
def lesson(lesson_id):
    return f"Lesson {lesson_id}"        # lesson_id is already an int
```
Route B, validate yourself:
```python
@app.route("/lesson/<lesson_id>")
def lesson(lesson_id):
    return f"Lesson {int(lesson_id)}"   # you convert it
```
The outcomes differ for bad input:
- `/lesson/abc` with Route A: **404**, and your function never runs. With Route B: `int("abc")` raises `ValueError`, so the user sees a **500** server error, which wrongly says "the server is broken" when the real problem is bad input.
- `/lesson/-1` with Route A: **404**. With Route B: `int("-1")` succeeds, so your function must decide what to do with a negative lesson.

Route A is shorter and gives the correct status code for free, so prefer converters whenever the type is known. Route B is only worth it when you want a custom message for bad input.

## Part 4: Trailing slashes
URLs `/lessons` and `/lessons/` look almost identical but Flask treats them differently, following an old convention from file systems where a trailing slash means "directory".
- Rule defined **with** a slash, `@app.route("/lessons/")`: visiting `/lessons` makes Flask send a redirect (status 308) to `/lessons/`. Both work.
- Rule defined **without** a slash, `@app.route("/lessons")`: visiting `/lessons/` is a **404**.

The reason is that a page should have exactly one canonical URL. This course uses the no-slash style for pages. Whatever you choose, use it everywhere in the project.

## Part 5: HTTP methods
In Lesson 3-1 you learned that GET reads and POST sends data. By default a route accepts **GET** only (Flask also answers `HEAD` and `OPTIONS` for you automatically). To accept more, list them in the `methods` argument:
```python
from flask import request

@app.route("/subscribe", methods=["GET", "POST"])
def subscribe():
    if request.method == "POST":
        return "Thanks for subscribing", 201
    return "Send a POST request to subscribe"
```
`request` is a Flask object that represents the current request, and `request.method` is the method as an uppercase string. If someone sends `PUT /subscribe`, Flask answers **405 Method Not Allowed** and adds an `Allow: GET, HEAD, OPTIONS, POST` header listing what is allowed.

**Two routes to the same goal.** Since Flask 2.0 you can split the logic by method:
```python
@app.get("/subscribe")
def subscribe_form():
    return "Send a POST request to subscribe"

@app.post("/subscribe")
def subscribe_save():
    return "Thanks for subscribing", 201
```
The behaviour is identical. The single function with an `if` is simplest when the two cases share most of their code, such as a form page that shows itself on GET and processes itself on POST (Week 4). Separate functions read better when the two cases share almost nothing. Note that the two functions need different names, because each name is an endpoint (Part 8).

## Part 6: Query strings
In `/search?q=flask&page=2`, the path is `/search` and everything after `?` is the **query string**. Flask does not use the query string when matching routes, so you read it separately:
```python
@app.route("/search")
def search():
    q = request.args.get("q", "")
    page = request.args.get("page", 1, type=int)
    return f"Searching for {q!r}, page {page}"
```
- `request.args` is a dictionary-like object of the query parameters.
- `.get("q", "")` returns the default `""` if `q` is missing. `request.args["q"]` would instead raise a **400 Bad Request** when it is missing.
- `type=int` converts the text to an integer, and silently falls back to the default if the text is not a number, so `?page=abc` gives `1` instead of crashing.

A useful rule: the **path** says *which* thing you want (`/lesson/3`), the **query string** says *how* you want to see it (`?sort=title`, `?page=2`, `?q=flask`).

## Part 7: url_for, links that never break
`url_for` builds a URL from the **endpoint** name. By default the endpoint is the name of the view function.
```python
from flask import url_for

url_for("lesson", lesson_id=3)          # '/lesson/3'
url_for("search", q="flask")            # '/search?q=flask'
url_for("static", filename="style.css") # '/static/style.css'
```
Arguments that match a variable in the rule fill that variable. Extra arguments are added as a query string. Special characters are escaped for you.

**Two routes to the same goal.** You need a link to lesson 3.
- Route A, hard-code it: `<a href="/lesson/3">`.
- Route B, build it: `<a href="{{ url_for('lesson', lesson_id=3) }}">`.

Both work today. Next month you rename the route to `/lessons/<int:lesson_id>`. With Route A every link is now a 404 and you must find them all by hand. With Route B you changed one line and every link followed. Use `url_for` always.

Two more facts. `_external=True` produces a full URL with the host (`http://127.0.0.1:5000/lesson/3`), which you need in emails. And `url_for` only works while Flask is handling a request, so to try it in a script use a fake request:
```python
with app.test_request_context():
    print(url_for("lesson", lesson_id=3))
```
Calling it with no context raises a `RuntimeError` about the application context.

## Part 8: Redirects, errors and endpoints
A **redirect** is a response whose status is 3xx and whose `Location` header names another URL. The browser then makes a new GET request to that URL.
```python
from flask import redirect, url_for, abort

@app.route("/start")
def start():
    return redirect(url_for("lesson", lesson_id=1))   # 302 by default
```
`redirect(location, code=302)` takes a code. Use 301 for a permanent move (browsers cache it, so be sure), 302 for a temporary one, 303 to send the browser to a page after a POST, and 307 or 308 when the browser must repeat the **same method**. Remember that `redirect` only *builds* a response, so you must `return` it. If you forget, the view returns `None`, which is an error.

`abort(code)` stops the view immediately and produces that error:
```python
LESSONS = {1: "Setup", 2: "Functions"}

@app.route("/lesson/<int:lesson_id>")
def lesson(lesson_id):
    if lesson_id not in LESSONS:
        abort(404)
    return f"Lesson {lesson_id}: {LESSONS[lesson_id]}"
```
Here the converter checks that the *type* is right and `abort(404)` checks that the *thing exists*. They solve different problems.

A custom error page uses an error handler:
```python
@app.errorhandler(404)
def not_found(error):
    return "Nothing here", 404
```
Always return the status code as the second item. If you leave it out, the page says "not found" but the status is 200, and browsers and search engines will believe the page exists.

**Endpoints must be unique.** The endpoint name is the function name, so two functions named `home` raise `AssertionError: View function mapping is overwriting an existing endpoint function: home`. You can stack two routes on one function so that two URLs reach one view:
```python
@app.route("/")
@app.route("/home")
def home():
    return "Home"
```
Do not rely on which of the two URLs `url_for("home")` returns. If one is just an alias, make it redirect to the real one instead.

## Part 9: See every route at once
When something returns an unexpected 404 or 405, look at the URL map:
```powershell
flask --app app routes
```
```
Endpoint  Methods  Rule
--------  -------  -----------------------------
home      GET      /
lesson    GET      /lesson/<int:lesson_id>
search    GET      /search
static    GET      /static/<path:filename>
```
Flask even added a `static` route for you, which Lesson 3-5 uses. This table answers most "why 404?" and "why 405?" questions in seconds.

## Part 10: The mistakes everyone makes
- **A mismatch between `<name>` and the parameter name** gives `TypeError ... unexpected keyword argument`.
- **Forgetting `methods=["POST"]`** gives 405 as soon as a form is submitted.
- **Returning `redirect(...)` without `return`** gives a `TypeError` saying the view returned `None`.
- **Hard-coding URLs** works until the first rename.
- **Using `abort(404)` for a bad type** when a converter would do it in one word.

## Recap
- A route maps a path to a view. No path match gives 404, no method match gives 405.
- `<converter:name>` captures part of the path, validates it and converts it, and the name must match the function parameter.
- Routes accept GET only unless you list `methods`. `request.method` and `request.args` tell you what arrived.
- `url_for(endpoint, **values)` builds URLs, adds extras as a query string, and keeps links alive when routes change.
- `redirect` sends the browser elsewhere, `abort` raises an error, and `flask --app app routes` shows every rule.

Build the routing layer of Hub v0 (no templates yet). Use a list of lesson dictionaries such as `{"id": 1, "title": "Setup"}`. Required: `/` returns a welcome line; `/lessons` lists all lesson titles, one per line, and accepts a `?q=` query that filters titles containing the text (case-insensitive); `/lesson/<int:lesson_id>` shows one lesson or aborts with 404; `/lesson/<int:lesson_id>/next` redirects to the following lesson, or back to `/lessons` after the last one; a custom 404 handler returns `Page not found` with the status code 404. Add a `test_app.py` that checks every route, the filter, both redirect cases and the custom 404 body.
HINT: Build the text for `/lessons` with `"\n".join(...)`, and remember the list index is one less than the id if ids start at 1. Use `flask --app app routes` to confirm the URL map matches the spec.

SOL:
```python
from flask import Flask, abort, redirect, request, url_for

app = Flask(__name__)
LESSONS = [
    {"id": 1, "title": "Setup"},
    {"id": 2, "title": "Functions"},
    {"id": 3, "title": "Classes"},
]

def find(lesson_id):
    for item in LESSONS:
        if item["id"] == lesson_id:
            return item
    return None

@app.route("/")
def home():
    return "Welcome to Hub v0"

@app.route("/lessons")
def lessons():
    q = request.args.get("q", "").lower()
    titles = [i["title"] for i in LESSONS if q in i["title"].lower()]
    return "\n".join(titles), 200, {"Content-Type": "text/plain"}

@app.route("/lesson/<int:lesson_id>")
def lesson(lesson_id):
    item = find(lesson_id)
    if item is None:
        abort(404)
    return item["title"]

@app.route("/lesson/<int:lesson_id>/next")
def next_lesson(lesson_id):
    if find(lesson_id + 1) is None:
        return redirect(url_for("lessons"))
    return redirect(url_for("lesson", lesson_id=lesson_id + 1))

@app.errorhandler(404)
def not_found(error):
    return "Page not found", 404
```

Q: What does Flask do when a request path matches no route at all?
- Calls the closest route
- Answers 404 Not Found without running any of your views *
- Answers 500 Internal Server Error
- Redirects to `/`
WHY: Matching happens before your code runs. If there is no rule for the path, Flask produces the 404 itself.
Q: A route is `@app.route("/hello/<name>")`. Which function definition works?
- `def hello(username):`
- `def hello():`
- `def hello(name):` *
- `def hello(<name>):`
WHY: Flask passes captured values by keyword, so the parameter name must be the same as the name in the angle brackets.
Q: What status code results from visiting `/lesson/abc` when the rule is `/lesson/<int:lesson_id>`?
- 200
- 400
- 404 *
- 500
WHY: The `int` converter refuses to match `abc`, so no rule matches the path and Flask answers 404 before your function runs.
Q: Which converter would you use for a value that may contain slashes, such as `docs/guides/intro.txt`?
TYPE: path
WHY: `string` stops at a slash, while `path` accepts slashes as part of the value.
Q: A route is defined as `@app.route("/lessons/")` with a trailing slash. What happens when you visit `/lessons`?
- 404
- Flask redirects to `/lessons/` *
- A 405 error
- Nothing, it shows an empty page
WHY: With a trailing slash in the rule, Flask redirects the slash-less URL to the canonical one. The reverse (rule without slash, visit with slash) is a 404.
Q: A form submits a POST to a route defined as `@app.route("/save")`. What does the user see?
- 200 and the page
- 404
- 405 Method Not Allowed *
- 500
WHY: The path matches but the route only allows GET by default, so the method check fails. Add `methods=["POST"]`.
Q: For the URL `/search?q=flask&page=2`, how do you read `page` as an integer with a default of 1?
- `request.args.get("page", 1, type=int)` *
- `request.form["page"]`
- `request.method.page`
- `url_for("page")`
WHY: `request.args` holds query-string values. `type=int` converts, and the default is used if the value is missing or not a number.
Q: You rename a route from `/lesson/<int:id>` to `/lessons/<int:id>`. Which links keep working without edits?
- Links written as `/lesson/3`
- Links built with `url_for("lesson", id=3)` *
- Neither kind
- Both kinds
WHY: `url_for` looks the URL up from the endpoint each time, so it follows the rule. A hard-coded string keeps pointing at the old path.
Q: What is the error when two view functions share the same name?
- `NameError`
- `AssertionError` saying a view function mapping is overwriting an existing endpoint *
- `ValueError`
- Nothing, the last one wins silently
WHY: The function name is the endpoint, and endpoints must be unique so that `url_for` can identify a route.
Q: Which command prints every route, with its methods and endpoint, for `app.py`?
TYPE: flask --app app routes
WHY: It reads the URL map directly, which makes it the fastest way to debug an unexpected 404 or 405.

===NOTES===
## What you will be able to do after this lesson
You will be able to explain why web apps use templates, render an HTML file from a view and pass data into it, read and write the three kinds of Jinja syntax, loop and branch inside a template, use filters, explain exactly what autoescaping does and why it protects your users, and diagnose the errors that appear when a template is missing or a variable is undefined.

Until now your views returned short strings. Real pages are hundreds of lines of HTML. This lesson is how that HTML gets into your app without turning your Python into a mess.

## Part 1: Why templates exist
You could build a page inside a view:
```python
@app.route("/lessons")
def lessons():
    html = "<h1>Lessons</h1><ul>"
    for title in ["Setup", "Functions"]:
        html += "<li>" + title + "</li>"
    return html + "</ul>"
```
This works for ten lines and becomes unmanageable at fifty. Quotes clash, a designer cannot edit the page without touching Python, and the code mixes two different jobs. The standard answer is the separation of concerns:
- The **view** (Python) decides *what* data to show.
- The **template** (HTML with placeholders) decides *how* it looks.

A **template** is an HTML file that contains placeholders and small instructions. Flask fills them in using **Jinja**, a template engine (a program that merges a template with data to produce final text). The result is ordinary HTML, and the browser never knows a template was involved.

## Part 2: render_template
```python
from flask import Flask, render_template

app = Flask(__name__)

@app.route("/lessons")
def lessons():
    items = ["Setup", "Functions", "Classes"]
    return render_template("lessons.html", title="Lessons", items=items)
```
- `render_template("lessons.html", ...)` loads the file, fills it and returns the finished HTML as a string, which the view returns like any other.
- The first argument is the file name **relative to the `templates` folder**. Flask looks for a folder named exactly `templates` **next to your app file** (this is one of the reasons you pass `__name__` to `Flask`).
- The remaining keyword arguments, `title=` and `items=`, are the **context**: the variables the template can use. The name on the left is what the template sees, and the value on the right is what you pass.

Your project now looks like this:
```
hub-v0/
  app.py
  templates/
    lessons.html
```
and `templates/lessons.html` contains:
```html
<!doctype html>
<html>
  <head><title>{{ title }}</title></head>
  <body>
    <h1>{{ title }}</h1>
    <ul>
      {% for item in items %}
        <li>{{ item }}</li>
      {% endfor %}
    </ul>
  </body>
</html>
```

## Part 3: The three kinds of Jinja syntax
Jinja has exactly three kinds of marker, and each has one job.
- `{{ ... }}` is an **expression**. It evaluates what is inside and **prints** the result into the page: `{{ title }}`, `{{ 3 + 4 }}`, `{{ user.name }}`.
- `{% ... %}` is a **statement**. It controls the template but prints nothing itself: loops, conditions, `extends`, `block`, `include`. Statements that open something need a matching end tag, such as `{% endfor %}`.
- `{# ... #}` is a **comment**. It never reaches the browser, unlike an HTML comment, which anyone can read with "View source".

A frequent beginner error is writing `{{ for item in items }}`. A loop is a statement, so it needs `{% %}`, and the error is `TemplateSyntaxError`.

## Part 4: Using variables
Jinja variables can be anything Python can pass: strings, numbers, lists, dictionaries, objects.
```python
user = {"name": "Ada", "lessons": [1, 2, 3]}
return render_template("profile.html", user=user)
```
```html
<p>{{ user.name }} has finished {{ user.lessons|length }} lessons.</p>
<p>First: {{ user.lessons[0] }}. Same name, bracket style: {{ user["name"] }}</p>
```
`user.name` and `user["name"]` both work, because Jinja tries attribute access first and then item access.

**What if a variable does not exist?** Jinja does *not* crash. A missing variable is **undefined** and prints as an empty string. That is forgiving but dangerous, because a typo such as `{{ titel }}` silently produces a blank heading. If you try to go *deeper* into something undefined, such as `{{ user.address.city }}` when `address` is missing, you do get an `UndefinedError`. Two habits protect you:
- Test with the test client and check the text really appears.
- Use `{{ title|default("Untitled") }}` when a value is genuinely optional.

## Part 5: Logic in templates
**Loops.** Inside a `for`, Jinja gives you a special `loop` object:
```html
{% for item in items %}
  <li class="{{ 'first' if loop.first else '' }}">{{ loop.index }}. {{ item }}</li>
{% else %}
  <li>No lessons yet</li>
{% endfor %}
```
- `loop.index` counts from 1 (`loop.index0` from 0), `loop.first` and `loop.last` are `True` once, and `loop.length` is the total.
- The `{% else %}` branch of a `for` runs only when the list was empty. It is the clean way to show "nothing here" messages.

**Conditions.**
```html
{% if lessons %}
  <p>{{ lessons|length }} lessons</p>
{% elif loading %}
  <p>Loading...</p>
{% else %}
  <p>Nothing yet</p>
{% endif %}
```
An empty list, an empty string, `0`, `None` and undefined are all treated as false, exactly as in Python.

**Inline if.** `{{ "Done" if lesson.done else "To do" }}` is the one-line form, useful inside an HTML attribute.

## Part 6: Filters
A **filter** transforms a value. You apply it with a pipe `|`, and filters chain left to right.
- `{{ name|upper }}` gives `ADA`, `{{ name|title }}` capitalises each word.
- `{{ items|length }}` gives the number of items.
- `{{ items|join(", ") }}` gives `Setup, Functions, Classes`.
- `{{ nickname|default("Guest") }}` gives `Guest` when `nickname` is undefined.
- `{{ 3.14159|round(2) }}` gives `3.14`.
- `{{ name|trim|title }}` chains two filters.

Filters take arguments in parentheses, as you saw with `join` and `round`. Keep filters for display tweaks. If you find yourself chaining five of them, do the work in the view instead (Part 8).

## Part 7: Autoescaping, the most important idea in this lesson
Imagine a page that greets the user by a name they typed, and someone types `<script>stealCookies()<\/script>` as their name. If Flask pasted that text into the HTML as it is, the browser would run it. Injecting code into a page like this is called **cross-site scripting (XSS)**, and it is one of the most common web attacks.

Jinja prevents it with **autoescaping**: it replaces the special characters `<`, `>`, `&`, `'` and `"` in every printed value with harmless codes (`&lt;`, `&gt;`, `&amp;` and so on). The browser then *shows* the text instead of *running* it.
```python
from flask import render_template_string
print(render_template_string("<p>{{ x }}</p>", x="<b>hi</b>"))
# <p>&lt;b&gt;hi&lt;/b&gt;</p>
```
The page would display the literal characters `<b>hi</b>`, not bold text. That is the safe default and it needs no work from you.

The `|safe` filter switches this protection off for one value:
```html
{{ comment|safe }}     <!-- dangerous if comment came from a user -->
```
Use it only on HTML you wrote yourself. Anything a visitor can influence must never be marked safe.

**One more related danger.** `render_template_string` builds a template from a string. Never put user text inside that string, because the user could then write Jinja code. Pass user text as a *variable* instead, as in the example above.

## Part 8: Two routes to the same goal, and when logic belongs where
You want to show only the finished lessons.

Route A, filter in the template:
```html
{% for l in lessons if l.done %}<li>{{ l.title }}</li>{% endfor %}
```
Route B, filter in the view:
```python
done = [l for l in LESSONS if l["done"]]
return render_template("lessons.html", lessons=done)
```
Both give the same page. Route A is fine for a tiny presentational condition. Route B is better as soon as the rule is real logic, because Python is easier to test than a template: with the test client you can verify the result, and you can reuse the rule elsewhere. The guideline is: **templates decide how to show data, views decide which data**.

## Part 9: Links inside templates
Everything from Lesson 3-3 is available. `url_for` works in templates:
```html
<a href="{{ url_for('lesson', lesson_id=l.id) }}">{{ l.title }}</a>
```
Note the single quotes inside the double-quoted attribute. This is how every navigation link in Hub v0 will be written.

## Part 10: When templates go wrong
- **`jinja2.exceptions.TemplateNotFound: lessons.html`** means Flask could not find the file. Check, in this order: the folder is called exactly `templates` (not `template`), it is next to the app file, and the file name matches the string, including the extension.
- **A blank where text should be** means an undefined variable. Compare the name in `render_template(..., title=...)` with the name in `{{ title }}`.
- **`TemplateSyntaxError`** means a typo: a missing `{% endfor %}` or `{% endif %}`, or a statement written with `{{ }}`. The error names the line.
- **Changes to the template not appearing.** In debug mode Flask reloads templates, so first check you saved the right file in the right folder.

To check output without a browser:
```python
resp = app.test_client().get("/lessons")
text = resp.get_data(as_text=True)
assert "<h1>Lessons</h1>" in text
```

## Recap
- A template is HTML with placeholders. The view chooses the data and `render_template("file.html", name=value)` merges them.
- Templates live in a folder named `templates` next to the app file.
- `{{ }}` prints, `{% %}` controls, `{# #}` comments. Loops need `{% endfor %}` and conditions need `{% endif %}`.
- Filters (`|upper`, `|length`, `|join`, `|default`) transform values. Missing variables print as empty text.
- Autoescaping turns user text into harmless characters and stops XSS. Use `|safe` only on HTML you wrote.

===QUIZ===
Q: What is the main reason to move HTML out of views and into templates?
- Templates run faster than Python
- It separates what data to show (Python) from how it looks (HTML) *
- Browsers refuse HTML returned from views
- Flask cannot return strings
WHY: Views returning strings work, but mixing two jobs makes both harder to change and test. Templates give each job its own file.
Q: Where does Flask look for `lessons.html` when you call `render_template("lessons.html")`?
- Anywhere on the computer
- In the `static` folder
- In a folder named `templates` next to your app file *
- In the virtual environment
WHY: The folder name and location are conventions Flask relies on. A misspelled folder gives `TemplateNotFound`.
Q: Which Jinja marker prints a value into the page?
TYPE: {{ }}
WHY: Double curly braces hold an expression whose result is printed. `{% %}` holds statements, which print nothing themselves.
Q: What is wrong with this template line?
```html
{{ for item in items }}
```
- Nothing
- A loop is a statement and needs `{% for item in items %}` *
- `items` must be a tuple
- It needs a semicolon
WHY: Only expressions go inside `{{ }}`. Control structures use `{% %}` and are closed with `{% endfor %}`, otherwise Jinja raises `TemplateSyntaxError`.
Q: A template contains `<h1>{{ titel }}</h1>` but the view passes `title="Lessons"`. What does the page show?
- A 500 error
- An empty heading, because the undefined variable prints as nothing *
- The text `titel`
- `Lessons`
WHY: Jinja treats an unknown name as undefined and prints an empty string. Only going deeper, such as `{{ titel.x }}`, raises an error. This is why you test your pages.
Q: When does the `{% else %}` branch of a Jinja `for` loop run?
- After every item
- Only when the sequence was empty *
- Only on the last item
- Never
WHY: It is the loop's "nothing to show" case, which is much neater than an extra `if` before the loop.
Q: What does autoescaping do to the value `<b>hi</b>` when it is printed with `{{ x }}`?
- Makes the text bold
- Removes the tags
- Converts the characters to `&lt;b&gt;hi&lt;/b&gt;` so the browser shows them as text *
- Raises an error
WHY: Escaping neutralises characters that HTML treats as code, which stops user-supplied text from running as markup or script.
Q: When is it acceptable to use the `|safe` filter?
- On any text a user typed
- On HTML you wrote yourself and trust *
- Whenever the page looks wrong
- On every variable
WHY: `|safe` removes protection against cross-site scripting, so it must never be applied to anything a visitor can influence.
Q: What is the difference between `render_template` and `render_template_string`, and which one must never receive user text as its template argument?
- They are identical
- `render_template_string` builds a template from a string, and user text must be passed as a variable, never inside that string *
- `render_template` is for JSON only
- Only `render_template` is insecure
WHY: If user text becomes part of the template source, the user can write Jinja code. Passing it as a variable keeps it as data and keeps it escaped.
Q: Which filter would show a list as `a, b, c`?
TYPE: join
WHY: `{{ items|join(", ") }}` joins the items with the separator you give it.

## What you will be able to do after this lesson
You will be able to explain the problem that template inheritance solves, build a base template with blocks and extend it from child pages, add default and inherited block content, serve and link CSS and images from the `static` folder, split repeated fragments into included files, highlight the current page in a navigation bar, recognise the silent mistakes that break inheritance, and combine everything from this week into **Hub v0**, your first complete Flask site.

## Part 1: The problem, repeated HTML
Every page on a site shares the same skeleton: the `<head>`, the navigation bar, the footer. Imagine Hub v0 with five pages and no inheritance. Each file would repeat 40 identical lines. When you add a link to the navigation you must edit five files, and the day you forget one, your site is inconsistent. Programmers call this breaking the **DRY principle** (Don't Repeat Yourself): every piece of knowledge should live in exactly one place.

You have met this idea twice. In Week 1, a function lets you write logic once and call it many times. In Lesson 2-1, a child class reuses its parent and overrides only what differs. **Template inheritance is the same idea for pages**: one parent layout, many children that fill in what is different.

## Part 2: Base templates and blocks
A **base template** holds the shared layout. In it, a **block** marks a hole that children are allowed to fill.
```html
<!-- templates/base.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}PythonHub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('lessons') }}">Lessons</a>
    <a href="{{ url_for('about') }}">About</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>PythonHub, Hub v0</footer>
</body>
</html>
```
A **child template** declares its parent with `extends` and fills blocks:
```html
<!-- templates/about.html -->
{% extends "base.html" %}
{% block title %}About, PythonHub{% endblock %}
{% block content %}
  <h1>About</h1>
  <p>A small site built while learning Flask.</p>
{% endblock %}
```
Understand each piece:
- `{% block name %}...{% endblock %}` in the base defines a hole called `name`. Whatever sits between the tags in the base is the **default**, used if a child does not fill the block. That is why pages without their own title show `PythonHub`.
- `{% extends "base.html" %}` says "start from that file". It must be the **first tag** in the child.
- When Flask renders `about.html`, it takes the base, replaces each block with the child's version, and ignores the rest of the child.

The view does not change at all: `return render_template("about.html")`. Flask handles inheritance behind the scenes.

**Adding to a block instead of replacing it.** Inside a child block, `{{ super() }}` prints the parent's version of that block, then you add more. Use it for blocks such as `head` where children usually add to the parent's content.
```html
{% block title %}{{ super() }}: About{% endblock %}   <!-- PythonHub: About -->
```

## Part 3: Static files
**Static files** are files the server sends as they are, without any processing: CSS, images, JavaScript, fonts. They are the opposite of templates, which Flask must fill in first.

Flask serves a folder called `static`, next to your app file, at the URL `/static/...`. A file `static/style.css` is available at `/static/style.css`. (You saw this route in the output of `flask --app app routes`.)
```
hub-v0/
  app.py
  templates/
    base.html
    home.html
  static/
    style.css
```
Link it with `url_for`, as in the base template above:
```html
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
```
- `'static'` is the endpoint name of that built-in route.
- `filename=` fills the `<path:filename>` part of `/static/<path:filename>`. Files in subfolders work too: `filename='img/logo.png'`.

**Why not just write `href="/static/style.css"`?** It works, until the day the app runs under a prefix such as `/hub/`, when the hard-coded link breaks and `url_for` still works. It is the same argument as in Lesson 3-3.

**If your CSS change does not show up**, the browser has likely cached the old file. Press Ctrl+F5 to force a fresh download. If the page has no styling at all, open the Network tab: a `404` on `style.css` means the folder is misnamed or the file is in the wrong place.

## Part 4: Three ways to share HTML, and when to use which
You want the navigation bar to appear on every page.
- **Route A, copy and paste it into each page.** Works immediately, but every change must be repeated in every file. This is the DRY violation from Part 1.
- **Route B, put it in a partial and include it.** Move the nav into `templates/_nav.html` and write `{% include "_nav.html" %}` wherever it is needed. One source, but each page must remember to include it, and pages still repeat the rest of the skeleton.
- **Route C, put it in the base template.** Every child inherits it automatically.

The rule of thumb: use **extends** for the layout every page shares, and **include** for a reusable fragment that only *some* pages need, such as a lesson card, a form snippet, or a nav that is itself long enough to deserve its own file (`{% include %}` can sit inside the base template too). The leading underscore in `_nav.html` is only a naming convention that says "I am a fragment, not a full page".

## Part 5: Highlighting the current page
Flask exposes the current request to templates as `request`, and `request.endpoint` is the name of the view that is handling it. That lets the navigation mark where you are:
```html
<a href="{{ url_for('lessons') }}"
   class="{{ 'active' if request.endpoint == 'lessons' else '' }}">Lessons</a>
```
Then style `.active` in your CSS. The detail page `lesson` will not highlight `Lessons`, because the endpoint is different. That is a design choice you can refine, for example with `request.endpoint in ('lessons', 'lesson')`.

## Part 6: The silent mistakes
Inheritance rarely crashes. It usually **silently does the wrong thing**, which makes it worth memorising.
- **Content outside any block in a child is ignored.** If `about.html` extends `base.html` and you write `<h1>About</h1>` *outside* a block, it simply does not appear. No error.
- **A block name that does not match** (child says `{% block contnt %}`, base has `content`) means the child's content never lands anywhere, again silently.
- **`extends` not first** raises an error, because Jinja must know about the parent before anything else.
- **Forgetting `{% endblock %}`** raises `TemplateSyntaxError`.
- **Passing data to a block.** Children receive the same variables as always from `render_template`. There is nothing special to pass to the base.

When a page looks wrong, check these in order: is the content inside a block, do the block names match, is `extends` the first line.

## Part 7: Project, Hub v0
Hub v0 is the site you will extend through the next weeks. It must have:
- **Pages:** Home, Lessons (a list), a lesson detail page, About, and a custom 404 page.
- **One base template** with the navigation and footer, and a title block.
- **One stylesheet** in `static/` linked from the base.
- **Data in one place:** a Python list of dictionaries, kept in its own module `data.py` so views stay small.
- **Behaviour:** the Lessons page has a `?q=` filter, the active nav link is highlighted, and unknown lesson ids return your 404 page with status 404.
- **Tests:** a `test_app.py` that checks every page.

The structure:
```
hub-v0/
  app.py
  data.py
  test_app.py
  templates/
    base.html
    home.html
    lessons.html
    lesson.html
    about.html
    404.html
  static/
    style.css
```
A sensible order to build in: base template and Home first, then About (proof that inheritance works), then the stylesheet, then the data and the Lessons and detail pages, then the 404 and tests. After each step, reload and look. Building in small steps means that when something breaks, you know exactly which step broke it.

## Part 8: Reading the result
When all of this works, notice what you built from the pieces of the last three lessons. The URL map (3-3) decides which view runs. The view picks data and calls `render_template` (3-4). The template inherits a shared layout (this lesson) and pulls its style from `static`. Every part has one job, and you can change any one of them without touching the others. That separation is what makes a project that can grow to 60 lessons, forms and a database.

## Recap
- Template inheritance applies DRY to pages: a base template defines blocks, and children use `{% extends %}` and fill them.
- Block defaults appear when a child does not fill a block, and `{{ super() }}` adds to the parent's block.
- Static files live in `static/` and are linked with `url_for('static', filename=...)`.
- Use `extends` for the shared layout and `include` for reusable fragments.
- `request.endpoint` lets the navigation mark the current page.
- Inheritance mistakes are silent: content outside blocks and mismatched block names are ignored without any error.
